function applyTheme(){const p=palettes[state.palette]||palettes.frietkot;document.documentElement.style.setProperty('--bg',p[0]);document.documentElement.style.setProperty('--accent',p[1])}function nav(page,extra={}){history.pushState({page,...extra},'');route={page,...extra};render()}window.addEventListener('popstate',e=>{const s=e.state||{page:'home'};route=s;render()});function unitDone(i){return !!state.done[i]}function progress(){return UNITS.filter((_,i)=>unitDone(i)).length}
function home(){let next=UNITS.findIndex((_,i)=>!unitDone(i));if(next<0)next=29;return `<div class="top"><div class="logo">Patatino</div><div class="stats"><span class="pill">🔥 ${state.streak}</span><span class="pill">⭐ ${state.xp} XP</span><button class="pill" onclick="nav('settings')">⚙</button></div></div><section class="hero"><div><h1>Neerlandese vero, un passo alla volta.</h1><p>Lezioni brevi per vivere e lavorare nelle Fiandre.</p></div>${mascot('saluto')}</section><section class="card next"><div><span class="tag">PROSSIMA LEZIONE</span><h2>${UNITS[next].title}</h2><p>${UNITS[next].it}</p></div><button class="primary" onclick="nav('unit',{unit:${next},part:'grammar'})">Continua</button></section><section class="card"><div class="row"><h2>Ripasso errori</h2><b>${state.errors.length}</b></div>${state.errors.length?'<button class="wide" onclick="nav(\'review\')">Ripassa ora</button>':'<p class="muted">Nessun errore in coda. Goed zo!</p>'}</section>${[0,1,2,3,4,5].map(g=>`<details class="card group" ${Math.floor(next/5)===g?'open':''}><summary>${g+1}. ${['Le basi','Prime frasi','Descrivere','Agire e raccontare','Precisare','Frasi complesse'][g]} <span class="muted">${[0,1,2,3,4].filter(x=>unitDone(g*5+x)).length}/5</span></summary><p class="small">${UNITS.slice(g*5,g*5+5).map((u,j)=>`<button class="wide" style="margin:4px 0;text-align:left" onclick="nav('unit',{unit:${g*5+j},part:'grammar'})">${unitDone(g*5+j)?'✓':'○'} ${u.title} · ${u.it}</button>`).join('')}</p><div class="progress"><i style="width:${[0,1,2,3,4].filter(x=>unitDone(g*5+x)).length*20}%"></i></div></details>`).join('')}`}
function unit(){const u=UNITS[route.unit];return `<div class="top"><button onclick="nav('home')">← Percorso</button><span class="pill">Unità ${route.unit+1}/30</span></div><section class="card lesson-head"><div><span class="tag">${u.level}</span><h1>${u.title}</h1><p>${u.it}</p></div>${mascot('contento')}</section><section class="card explain"><h2>L'idea</h2>${u.explanation}<h3>Attenzione: errori tipici di chi parla italiano</h3><p>~~${u.error}~~ → <strong>${u.correct}</strong></p><table><tr><th>Neerlandese</th><th>Italiano</th></tr>${u.table.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></section><section class="card vlaanderen"><h2>In Vlaanderen</h2><p>${u.vlaanderen}</p></section><section class="card"><h2>Parole chiave</h2><div class="tiles">${u.keywords.map(x=>`<button class="tile" onclick="speak('${esc(x.nl)}')">${x.nl}<small>${x.it}</small></button>`).join('')}</div></section><section class="card"><h2>Lessico</h2><div class="tiles">${u.words.map(x=>`<button class="tile" onclick="speak('${esc(x.nl)}')"><b>${x.nl}</b><small>${x.it}</small></button>`).join('')}</div></section><section class="card"><h2>Esercizi</h2><p>Due parti, soglia di superamento: 80%.</p><button class="wide primary" onclick="nav('exercise',{unit:${route.unit},part:'grammar',q:0,score:0})">Parte 2 · Grammatica</button><button class="wide" onclick="nav('exercise',{unit:${route.unit},part:'vocab',q:0,score:0})">Parte 1 · Lessico</button></section><div class="bottom"><button onclick="nav('home')">‹ Percorso</button><button class="primary" onclick="nav('exercise',{unit:${route.unit},part:'${route.part}',q:0,score:0})">Inizia</button></div>`}
function exercise(){const u=UNITS[route.unit], qs=route.part==='vocab'?u.vocab:u.exercises,q=qs[route.q]||qs[0];return `<div class="top"><button onclick="nav('unit',{unit:${route.unit},part:'${route.part}'})">✕</button><span class="pill">${route.q+1}/${qs.length}</span></div><div class="progress"><i style="width:${(route.q/qs.length)*100}%"></i></div><section class="hero">${mascot('festa')}<div><h1>${route.part==='vocab'?'Lessico':'Grammatica'}</h1><p>${q.prompt}</p></div></section><section class="card exercise">${q.type==='fill'?`<input id="answer" class="input" placeholder="${q.hint}" autocomplete="off">`:q.type==='tr'?`<div class="tiles">${q.tiles.map(t=>`<button class="tile" onclick="speak('${esc(t)}');this.classList.toggle('primary')">${t}</button>`).join('')}</div><p class="muted">${q.hint||'Tocca le tessere nell’ordine corretto.'}</p>`:`<div>${q.options.map((o,i)=>`<button class="choice" onclick="choose(${i},'${esc(o.nl||o)}')">${o.nl||o}<small>${o.it||''}</small></button>`).join('')}</div>`}<div id="feedback"></div><button class="wide primary" onclick="checkAnswer()">Controlla</button></section>`}
let selected=null;function choose(i,t){selected={i,t};speak(t);document.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('primary',j===i))}function checkAnswer(){const u=UNITS[route.unit],qs=route.part==='vocab'?u.vocab:u.exercises,q=qs[route.q];let ok=false,answer='';if(q.type==='fill'){answer=(document.querySelector('#answer')?.value||'').trim();ok=q.answers.some(a=>norm(a)===norm(answer))}else if(q.type==='tr'){answer=[...document.querySelectorAll('.tile.primary')].map(x=>x.innerText).join(' ');ok=q.answers.some(a=>norm(a)===norm(answer))}else{ok=selected?.i===q.correct;answer=selected?.t||''}document.querySelector('#feedback').innerHTML=`<div class="feedback"><h2>${ok?'Goed zo!':'Niet helemaal'}</h2>${ok?'<p>Ottimo: risposta accettata.</p>':`<div class="answer red"><b>La tua scelta</b><br>${esc(answer||'Nessuna risposta')}<br><small>${q.userIt||'Controlla ordine e forma.'}</small></div><div class="answer green"><b>Giusta</b><br>${esc(q.answer)}<br><small>${q.answerIt}</small></div><p>${q.note}</p>`}<button class="wide" onclick="nextQ(${ok})">Continua</button></div>`}function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.!?,;:'’]/g,'').replace(/\s+/g,' ').trim()}function nextQ(ok){route.score+=(ok?1:0);if(!ok)state.errors.push({unit:route.unit,part:route.part,q:route.q});route.q++;const n=(route.part==='vocab'?UNITS[route.unit].vocab:UNITS[route.unit].exercises).length;if(route.q<n)render();else nav('result',{unit:route.unit,part:route.part,score:route.score,total:n})}
function result(){const u=UNITS[route.unit],passed=route.score/route.total>=.8;state.xp+=route.score*5;if(passed){state.done[`${route.unit}-${route.part}`]=true;if(state.done[`${route.unit}-vocab`]&&state.done[`${route.unit}-grammar`])state.done[route.unit]=true}save();return `<section class="card" style="text-align:center"><h1>${passed?'Goed zo!':'Nog een keer?'}</h1>${mascot(passed?'festa':'dispiaciuto')}<h2>${route.score}/${route.total}</h2><p>${passed?'Hai superato questa parte.':'Serve almeno l’80%: gli errori restano nel ripasso.'}</p><button class="wide primary" onclick="nav('unit',{unit:${route.unit},part:'${passed?(route.part==='vocab'?'grammar':'vocab'):route.part}'})">${passed?'Continua':'Rifai'}</button><button class="wide" onclick="nav('home')">Torna al percorso</button></section>`}
function settings(){const voices=[...speechSynthesis.getVoices()].filter(v=>/^nl(-|_)/i.test(v.lang));return `<div class="top"><button onclick="nav('home')">← Percorso</button><h2>Impostazioni</h2></div><section class="card"><h2>Palette</h2><div class="settings-grid">${Object.entries(palettes).map(([k,p])=>`<button class="palette" style="background:${p[0]}" onclick="state.palette='${k}';save();applyTheme();render()">${k}<span>${p[0]} · ${p[1]}</span></button>`).join('')}</div></section><section class="card"><h2>Voce neerlandese</h2><p class="small">${voices.length?'Seleziona una voce nl-*; preferenza per nl-BE.':'Nessuna voce nl-* trovata: installane una nelle impostazioni vocali del dispositivo.'}</p>${voices.map(v=>`<button class="wide" onclick="state.voice='${v.lang}';save();speak('Dag, we gaan!')">${v.name} · ${v.lang} · Prova</button>`).join('')}</section><section class="card"><h2>Installazione audio</h2><p>Android: Impostazioni → Sistema → Lingue e immissione → Sintesi vocale. iPhone: Impostazioni → Accessibilità → Contenuti parlati → Voci. Scegli una voce neerlandese.</p></section>`}
function review(){return `<section class="card"><h1>Ripasso errori</h1><p>${state.errors.length} elementi in coda.</p><button class="wide primary" onclick="state.errors=[];save();nav('home')">Segna come ripassati</button></section>`}function render(){applyTheme();let html=route.page==='home'?home():route.page==='unit'?unit():route.page==='exercise'?exercise():route.page==='result'?result():route.page==='settings'?settings():review();document.querySelector('#app').innerHTML=html}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script></body></html>
