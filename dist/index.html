rue},{"text":"te","speak":true},{"text":"volgen","speak":true},{"text":"taal","speak":true,"distractor":true}],"note":"Te precede l’infinito; nei separabili entra fra particella e verbo. Om può introdurre lo scopo."},{"id":"25-m9","type":"order","prompt":"Ricomponi la frase.","it":"Lui viene per lavorare.","answer":"Hij komt om te werken.","answers":["Hij komt om te werken.","Om te werken komt hij.","Hij komt werken.","Werken komt hij."],"tiles":[{"text":"Hij","speak":true},{"text":"komt","speak":true},{"text":"om","speak":true},{"text":"te","speak":true},{"text":"werken","speak":true},{"text":"werkent","speak":false,"distractor":true}],"note":"Te precede l’infinito; nei separabili entra fra particella e verbo. Om può introdurre lo scopo."},{"id":"25-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Dimentico di portare con me il libro.","answer":"Ik vergeet het boek mee te nemen.","answers":["Ik vergeet het boek mee te nemen.","Ik vergeet om het boek mee te nemen.","Het boek vergeet ik mee te nemen."],"tiles":[{"text":"Ik","speak":true},{"text":"vergeet","speak":true},{"text":"het","speak":true},{"text":"boek","speak":true},{"text":"mee","speak":true},{"text":"te","speak":true},{"text":"nemen","speak":true},{"text":"om","speak":true},{"text":"doel","speak":true,"distractor":true}],"note":"Te precede l’infinito; nei separabili entra fra particella e verbo. Om può introdurre lo scopo."}]},{"id":26,"title":"Omdat ik hier woon","it":"Le subordinate","group":5,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Una subordinata dipende da un'altra parte della frase. In italiano l'ordine dei verbi cambia poco; in neerlandese una congiunzione subordinante porta il verbo coniugato verso la fine: \u003ci>ik werk hier omdat ik hier woon\u003c/i>, «lavoro qui perché abito qui». Non applicare V2 dentro questa subordinata. Prima riconosci dove comincia e dove finisce il gruppo introdotto dalla congiunzione.\u003c/p>\n\u003ch3>1 · Riconosci le congiunzioni\u003c/h3>\u003cp>\u003ci>Omdat\u003c/i> introduce una causa, \u003ci>dat\u003c/i> un contenuto, \u003ci>als\u003c/i> una condizione o una situazione temporale ripetuta, \u003ci>hoewel\u003c/i> una concessione. Dopo queste parole compare normalmente il soggetto, poi le altre informazioni e infine il verbo. \u003ci>Omdat ik moe ben\u003c/i> significa «perché sono stanco». Il verbo si coniuga ancora in base al soggetto: soltanto la sua posizione cambia.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Principale\u003c/th>\u003cth>Subordinata\u003c/th>\u003c/tr>\u003ctr>\u003ctd>ik ben moe\u003c/td>\u003ctd>omdat ik moe ben\u003c/td>\u003c/tr>\u003ctr>\u003ctd>hij werkt hier\u003c/td>\u003ctd>dat hij hier werkt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>wij komen morgen\u003c/td>\u003ctd>als wij morgen komen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>zij belt mij op\u003c/td>\u003ctd>omdat zij mij opbelt\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Gestisci più verbi\u003c/h3>\u003cp>Con modale e infinito, il gruppo verbale si concentra alla fine: \u003ci>omdat ik moet werken\u003c/i>. Anche \u003ci>omdat ik werken moet\u003c/i> è possibile, ma meno comune. Con ausiliare e participio sono possibili ordini diversi, come \u003ci>omdat ik heb gewerkt\u003c/i> e \u003ci>omdat ik gewerkt heb\u003c/i>. Non trasformare una preferenza di ordine in una regola assoluta. Gli esercizi accettano le varianti standard indicate quando mantengono lo stesso significato.\u003c/p>\n\u003ch3>3 · Metti la subordinata all'inizio\u003c/h3>\u003cp>Una subordinata intera può occupare il primo posto della principale: \u003ci>omdat ik moe ben, blijf ik hier\u003c/i>, «siccome sono stanco, resto qui». Dopo la virgola viene il verbo della principale e poi il soggetto. Non ricominciare come se il primo posto fosse ancora libero. La virgola aiuta a leggere il confine fra i due gruppi.\u003c/p>\n\u003cp>Non tutte le congiunzioni fanno questo lavoro. \u003ci>En\u003c/i> («e»), \u003ci>maar\u003c/i> («ma») e \u003ci>want\u003c/i> («perché») collegano normalmente frasi senza imporre l'ordine subordinato. Per dire «perché» puoi incontrare \u003ci>omdat\u003c/i> o \u003ci>want\u003c/i>, ma la costruzione seguente cambia. Impara parola e struttura insieme: tradurre soltanto il significato italiano lascia fuori una parte essenziale dell'informazione. Quando sposti una subordinata, conserva il rapporto iniziale: una causa non diventa una condizione e una dichiarazione non diventa una domanda.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Omdat ik ben moe\u003c/s> → \u003cstrong>omdat ik moe ben\u003c/strong>. \u003cs>Omdat ik moe ben, ik blijf hier.\u003c/s> → \u003cstrong>Omdat ik moe ben, blijf ik hier.\u003c/strong> \u003cs>Want ik moe ben\u003c/s> → \u003cstrong>want ik ben moe\u003c/strong>.\u003c/p>","keywords":[{"nl":"omdat","it":"perché, subordinante"},{"nl":"dat","it":"che, congiunzione"},{"nl":"als","it":"se, quando"},{"nl":"hoewel","it":"benché"},{"nl":"terwijl","it":"mentre"},{"nl":"voordat","it":"prima che"},{"nl":"want","it":"perché, coordinante"},{"nl":"maar","it":"ma"}],"words":[{"nl":"regenen","it":"piovere"},{"nl":"weten","it":"sapere"},{"nl":"zeggen","it":"dire"},{"nl":"blijven","it":"rimanere"},{"nl":"de regen","it":"la pioggia"},{"nl":"het weer","it":"il tempo atmosferico"},{"nl":"de reden","it":"il motivo"},{"nl":"thuis","it":"a casa"}],"vlaanderen":{"text":"Lo standard belga comprende varianti regionali riconosciute. L’ordine subordinato qui presentato fa parte della grammatica comune, utilizzabile anche nelle Fiandre.","source":{"label":"Taaladvies · lo standard in Belgio","url":"https://taaladvies.net/wat-is-standaardtaal-algemeen/"}},"source":"standard","practiceNote":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale.","grammar":[{"id":"26-g1","type":"fill","prompt":"Completa la frase.","sentence":"Omdat ik moe ___.","answer":"ben","answers":["ben"],"it":"Perché sono stanco.","hint":"Essere con ik, in fondo.","note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale."},{"id":"26-g2","type":"mc","prompt":"Completa la frase.","sentence":"Dat hij hier ___.","answer":"woont","answers":["woont"],"it":"Che lui abita qui.","hint":"Wonen, terza persona.","note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale.","options":[{"text":"woont","it":"Nella frase: Che lui abita qui.","speak":true},{"text":"woon","it":"Prima persona.","speak":true},{"text":"wonen","it":"Plurale.","speak":true}],"correct":0},{"id":"26-g3","type":"fill","prompt":"Completa la frase.","sentence":"komen → Als wij morgen ___.","answer":"komen","answers":["komen"],"it":"Se veniamo domani.","hint":"Accorda il verbo dato con wij, nella subordinata.","note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale."},{"id":"26-g4","type":"mc","prompt":"Completa la frase.","sentence":"Omdat zij koffie ___.","answer":"drinkt","answers":["drinkt"],"it":"Perché lei beve caffè.","hint":"Drinken, lei singolare.","note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale.","options":[{"text":"drinkt","it":"Nella frase: Perché lei beve caffè.","speak":true},{"text":"drink","it":"Prima persona.","speak":true},{"text":"drinken","it":"Plurale.","speak":true}],"correct":0},{"id":"26-g5","type":"fill","prompt":"Completa la frase.","sentence":"Ik blijf hier ___ ik moe ben.","answer":"omdat","answers":["omdat"],"it":"Resto qui perché sono stanco.","hint":"Usa la congiunzione causale subordinante presentata tra le parole chiave.","note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale."},{"id":"26-g6","type":"mc","prompt":"Completa la frase.","sentence":"Ik blijf hier, ___ ik ben moe.","answer":"want","answers":["want"],"it":"Resto qui, perché sono stanco.","hint":"Causa con ordine principale.","note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale.","options":[{"text":"want","it":"Nella frase: Resto qui, perché sono stanco.","speak":true},{"text":"omdat","it":"Richiederebbe ben alla fine.","speak":true},{"text":"hoewel","it":"Concessione e ordine subordinato.","speak":true}],"correct":0},{"id":"26-g7","type":"fill","prompt":"Completa la frase.","sentence":"Omdat ik moe ben, ___ ik hier.","answer":"blijf","answers":["blijf"],"it":"Siccome sono stanco, resto qui.","hint":"Blijven, prima persona.","note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale."},{"id":"26-g8","type":"mc","prompt":"Completa la frase.","sentence":"Omdat hij mij ___.","answer":"opbelt","answers":["opbelt"],"it":"Perché lui mi telefona.","hint":"Separabile coniugato in fondo.","note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale.","options":[{"text":"opbelt","it":"Nella frase: Perché lui mi telefona.","speak":true},{"text":"beltop","it":"Ordine scritto errato.","speak":false},{"text":"opbellen","it":"Infinito, non concorda.","speak":true}],"correct":0},{"id":"26-g9","type":"fill","prompt":"Completa la frase.","sentence":"Omdat ik heb ___.","answer":"gewerkt","answers":["gewerkt"],"it":"Perché ho lavorato.","hint":"Participio di werken dopo l’ausiliare.","note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale."},{"id":"26-g10","type":"mc","prompt":"Completa la frase.","sentence":"Omdat ik ___ werken.","answer":"moet","answers":["moet"],"it":"Perché devo lavorare.","hint":"Modale con ik.","note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale.","options":[{"text":"moet","it":"Nella frase: Perché devo lavorare.","speak":true},{"text":"moeten","it":"Plurale.","speak":true},{"text":"moett","it":"Forma inesistente.","speak":false}],"correct":0}],"mixed":[{"id":"26-m1","type":"order","prompt":"Ricomponi la frase.","it":"Resto a casa perché piove.","answer":"Ik blijf thuis omdat het regent.","answers":["Ik blijf thuis omdat het regent.","Omdat het regent blijf ik thuis."],"tiles":[{"text":"Ik","speak":true},{"text":"blijf","speak":true},{"text":"thuis","speak":true},{"text":"omdat","speak":true},{"text":"het","speak":true},{"text":"regent","speak":true},{"text":"regentt","speak":false,"distractor":true}],"note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale."},{"id":"26-m2","type":"tr","prompt":"Traduci con le tessere.","it":"Lui dice che è stanco.","answer":"Hij zegt dat hij moe is.","answers":["Hij zegt dat hij moe is."],"tiles":[{"text":"Hij","speak":true},{"text":"zegt","speak":true},{"text":"dat","speak":true},{"text":"hij","speak":true},{"text":"moe","speak":true},{"text":"is","speak":true},{"text":"weten","speak":true,"distractor":true}],"note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale."},{"id":"26-m3","type":"order","prompt":"Ricomponi la frase.","it":"Se piove resto qui.","answer":"Als het regent blijf ik hier.","answers":["Als het regent blijf ik hier.","Ik blijf hier als het regent."],"tiles":[{"text":"Als","speak":true},{"text":"het","speak":true},{"text":"regent","speak":true},{"text":"blijf","speak":true},{"text":"ik","speak":true},{"text":"hier","speak":true},{"text":"blijff","speak":false,"distractor":true}],"note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale."},{"id":"26-m4","type":"tr","prompt":"Traduci con le tessere.","it":"So che lei è a casa.","answer":"Ik weet dat zij thuis is.","answers":["Ik weet dat zij thuis is.","Ik weet dat ze thuis is."],"tiles":[{"text":"Ik","speak":true},{"text":"weet","speak":true},{"text":"dat","speak":true},{"text":"zij","speak":true},{"text":"thuis","speak":true},{"text":"is","speak":true},{"text":"ze","speak":true},{"text":"blijven","speak":true,"distractor":true}],"note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale."},{"id":"26-m5","type":"order","prompt":"Ricomponi la frase.","it":"Veniamo benché siamo stanchi.","answer":"Wij komen hoewel wij moe zijn.","answers":["Wij komen hoewel wij moe zijn.","Hoewel wij moe zijn komen wij.","We komen hoewel we moe zijn.","Hoewel we moe zijn komen we.","Wij komen hoewel we moe zijn.","We komen hoewel wij moe zijn.","Hoewel wij moe zijn komen we.","Hoewel we moe zijn komen wij."],"tiles":[{"text":"Wij","speak":true},{"text":"komen","speak":true},{"text":"hoewel","speak":true},{"text":"wij","speak":true},{"text":"moe","speak":true},{"text":"zijn","speak":true},{"text":"We","speak":true},{"text":"we","speak":true},{"text":"zijnn","speak":false,"distractor":true}],"note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale."},{"id":"26-m6","type":"tr","prompt":"Traduci con le tessere.","it":"Lui dice che ha lavorato.","answer":"Hij zegt dat hij heeft gewerkt.","answers":["Hij zegt dat hij heeft gewerkt.","Hij zegt dat hij gewerkt heeft."],"tiles":[{"text":"Hij","speak":true},{"text":"zegt","speak":true},{"text":"dat","speak":true},{"text":"hij","speak":true},{"text":"heeft","speak":true},{"text":"gewerkt","speak":true},{"text":"regenen","speak":true,"distractor":true}],"note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale."},{"id":"26-m7","type":"order","prompt":"Ricomponi la frase.","it":"Leggo mentre lui cucina.","answer":"Ik lees terwijl hij kookt.","answers":["Ik lees terwijl hij kookt.","Terwijl hij kookt lees ik."],"tiles":[{"text":"Ik","speak":true},{"text":"lees","speak":true},{"text":"terwijl","speak":true},{"text":"hij","speak":true},{"text":"kookt","speak":true},{"text":"kooktt","speak":false,"distractor":true}],"note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale."},{"id":"26-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Lei resta a casa perché è malata.","answer":"Zij blijft thuis omdat zij ziek is.","answers":["Zij blijft thuis omdat zij ziek is.","Omdat zij ziek is blijft zij thuis.","Ze blijft thuis omdat ze ziek is.","Omdat ze ziek is blijft ze thuis.","Zij blijft thuis omdat ze ziek is.","Ze blijft thuis omdat zij ziek is.","Omdat zij ziek is blijft ze thuis.","Omdat ze ziek is blijft zij thuis."],"tiles":[{"text":"Zij","speak":true},{"text":"blijft","speak":true},{"text":"thuis","speak":true},{"text":"omdat","speak":true},{"text":"zij","speak":true},{"text":"ziek","speak":true},{"text":"is","speak":true},{"text":"Ze","speak":true},{"text":"ze","speak":true},{"text":"zeggen","speak":true,"distractor":true}],"note":"Zij e ze possono riferirsi alla stessa donna nelle due proposizioni. Conserva la causa introdotta da omdat."},{"id":"26-m9","type":"order","prompt":"Ricomponi la frase.","it":"Poiché lui mi telefona, aspetto.","answer":"Omdat hij mij opbelt wacht ik.","answers":["Omdat hij mij opbelt wacht ik.","Ik wacht omdat hij mij opbelt.","Omdat hij me opbelt wacht ik.","Ik wacht omdat hij me opbelt."],"tiles":[{"text":"Omdat","speak":true},{"text":"hij","speak":true},{"text":"mij","speak":true},{"text":"opbelt","speak":true},{"text":"wacht","speak":true},{"text":"ik","speak":true},{"text":"me","speak":true},{"text":"opbeltt","speak":false,"distractor":true}],"note":"Subordinante + soggetto + resto + verbo. Una subordinata iniziale occupa il primo posto della principale."},{"id":"26-m10","type":"tr","prompt":"Traduci con le tessere.","it":"So che domani dobbiamo lavorare.","answer":"Ik weet dat wij morgen moeten werken.","answers":["Ik weet dat wij morgen moeten werken.","Ik weet dat we morgen moeten werken.","Ik weet dat wij morgen werken moeten.","Ik weet dat we morgen werken moeten."],"tiles":[{"text":"Ik","speak":true},{"text":"weet","speak":true},{"text":"dat","speak":true},{"text":"wij","speak":true},{"text":"morgen","speak":true},{"text":"moeten","speak":true},{"text":"werken","speak":true},{"text":"we","speak":true},{"text":"weer","speak":true,"distractor":true}],"note":"Moeten werken è l’ordine più comune; werken moeten è possibile. Morgen indica quando lavoriamo, non quando lo so."}]},{"id":27,"title":"De man die hier woont","it":"Le frasi relative","group":5,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Una relativa aggiunge informazioni a un nome: «il libro che leggo». In neerlandese la parola che introduce la relativa dipende spesso dal tipo del nome: \u003ci>het boek dat ik lees\u003c/i>, ma \u003ci>de brief die ik lees\u003c/i>. L'italiano «che» non cambia, quindi devi ricordarti di controllare articolo e numero prima di scegliere \u003ci>die\u003c/i> o \u003ci>dat\u003c/i>.\u003c/p>\n\u003ch3>1 · Trova il nome ripreso\u003c/h3>\u003cp>Il nome a cui si riferisce la relativa viene chiamato antecedente. Con un singolare di tipo \u003ci>de\u003c/i> usa \u003ci>die\u003c/i>; con un singolare neutro usa \u003ci>dat\u003c/i>; al plurale usa \u003ci>die\u003c/i> per tutti i nomi. Non scegliere in base alla vicinanza o lontananza: qui \u003ci>die\u003c/i> e \u003ci>dat\u003c/i> non sono dimostrativi, anche se hanno la stessa forma.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Antecedente\u003c/th>\u003cth>Relativa\u003c/th>\u003cth>Italiano\u003c/th>\u003c/tr>\u003ctr>\u003ctd>de man\u003c/td>\u003ctd>die hier woont\u003c/td>\u003ctd>che abita qui\u003c/td>\u003c/tr>\u003ctr>\u003ctd>het boek\u003c/td>\u003ctd>dat ik lees\u003c/td>\u003ctd>che leggo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>de boeken\u003c/td>\u003ctd>die ik lees\u003c/td>\u003ctd>che leggo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>de vrouw\u003c/td>\u003ctd>met wie ik praat\u003c/td>\u003ctd>con cui parlo\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Metti il verbo in fondo\u003c/h3>\u003cp>Una relativa è una subordinata: il verbo coniugato va verso la fine. \u003ci>De man die hier woont\u003c/i> non contiene un secondo \u003ci>hij\u003c/i>, perché \u003ci>die\u003c/i> è già il soggetto della relativa. In \u003ci>het boek dat ik lees\u003c/i>, invece, \u003ci>ik\u003c/i> è il soggetto e \u003ci>dat\u003c/i> è l'oggetto. La stessa parola relativa può dunque svolgere ruoli diversi senza cambiare forma.\u003c/p>\n\u003ch3>3 · Gestisci le preposizioni\u003c/h3>\u003cp>Con una persona, dopo una preposizione usi spesso \u003ci>wie\u003c/i>: \u003ci>de collega met wie ik werk\u003c/i>. Con una cosa puoi usare \u003ci>waar\u003c/i> e la preposizione: \u003ci>het boek waarover ik praat\u003c/i>, «il libro di cui parlo». \u003ci>Praten over\u003c/i> significa «parlare di»; è possibile anche separare i due elementi: \u003ci>het boek waar ik over praat\u003c/i>. La preposizione dipende dal verbo e dal senso; non si può ometterla soltanto perché l'italiano impiega «che» in altre costruzioni.\u003c/p>\n\u003cp>Una relativa può identificare quale oggetto intendi oppure aggiungere un commento su un oggetto già identificato. Nello scritto, le virgole aiutano a distinguere queste funzioni. Qui iniziamo dalle relative che identificano il nome. Prima individua l'antecedente, poi scegli il relativo, quindi verifica soggetto e posizione verbale dentro la subordinata. Se sposti un gruppo, mantieni la relativa collegata allo stesso nome: «lo studente che abita qui è stanco» non identifica lo studente tramite la stanchezza, ma tramite il luogo in cui abita.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Het boek die ik lees\u003c/s> → \u003cstrong>het boek dat ik lees\u003c/strong>. \u003cs>De man die hij hier woont\u003c/s> → \u003cstrong>de man die hier woont\u003c/strong>. \u003cs>De vrouw met die ik praat\u003c/s> → \u003cstrong>de vrouw met wie ik praat\u003c/strong>.\u003c/p>","keywords":[{"nl":"die","it":"che, relativo de/plurale"},{"nl":"dat","it":"che, relativo het singolare"},{"nl":"wie","it":"chi, cui dopo preposizione"},{"nl":"waarover","it":"di cui"}],"words":[{"nl":"de buurvrouw","it":"la vicina"},{"nl":"de leraar","it":"l’insegnante"},{"nl":"de student","it":"lo studente"},{"nl":"het verhaal","it":"il racconto"},{"nl":"het bericht","it":"il messaggio"},{"nl":"ontmoeten","it":"incontrare"},{"nl":"sturen","it":"inviare"},{"nl":"begrijpen","it":"capire"}],"vlaanderen":{"text":"Le relative fanno parte dello standard condiviso. Le note regionali riguardano l’uso effettivo: non occorre una grammatica relativa separata per comunicare nelle Fiandre.","source":{"label":"Taaladvies · lo standard in Belgio","url":"https://taaladvies.net/wat-is-standaardtaal-algemeen/"}},"source":"standard","practiceNote":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa.","grammar":[{"id":"27-g1","type":"fill","prompt":"Completa la frase.","sentence":"De man ___ hier woont","answer":"die","answers":["die"],"it":"L’uomo che abita qui.","hint":"Usa un relativo presentato nell’unità; man usa de.","note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-g2","type":"mc","prompt":"Completa la frase.","sentence":"Het boek ___ ik lees","answer":"dat","answers":["dat"],"it":"Il libro che leggo.","hint":"Boek è neutro singolare.","note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa.","options":[{"text":"dat","it":"Nella frase: Il libro che leggo.","speak":true},{"text":"die","it":"Con de o plurale.","speak":true},{"text":"wie","it":"Persone dopo preposizione.","speak":true}],"correct":0},{"id":"27-g3","type":"fill","prompt":"Completa la frase.","sentence":"De boeken ___ ik lees","answer":"die","answers":["die"],"it":"I libri che leggo.","hint":"Usa un relativo presentato nell’unità; antecedente plurale.","note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-g4","type":"mc","prompt":"Completa la frase.","sentence":"De vrouw met ___ ik praat","answer":"wie","answers":["wie"],"it":"La donna con cui parlo.","hint":"Persona dopo preposizione.","note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa.","options":[{"text":"wie","it":"Nella frase: La donna con cui parlo.","speak":true},{"text":"die","it":"Non si usa qui dopo met.","speak":true},{"text":"dat","it":"Neutro.","speak":true}],"correct":0},{"id":"27-g5","type":"fill","prompt":"Completa la frase.","sentence":"Het huis ___ groot is","answer":"dat","answers":["dat"],"it":"La casa che è grande.","hint":"Relativo studiato dello standard: huis è het singolare.","note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-g6","type":"mc","prompt":"Completa la frase.","sentence":"De fiets ___ ik koop","answer":"die","answers":["die"],"it":"La bici che compro.","hint":"Fiets usa de.","note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa.","options":[{"text":"die","it":"Nella frase: La bici che compro.","speak":true},{"text":"dat","it":"Per het singolare.","speak":true},{"text":"wie","it":"Persona dopo preposizione.","speak":true}],"correct":0},{"id":"27-g7","type":"fill","prompt":"Completa la frase.","sentence":"De man die hier ___","answer":"werkt","answers":["werkt"],"it":"L’uomo che lavora qui.","hint":"Werken, terza persona nella relativa.","note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-g8","type":"mc","prompt":"Completa la frase.","sentence":"Het boek dat ik ___","answer":"lees","answers":["lees"],"it":"Il libro che leggo.","hint":"Verbo con ik.","note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa.","options":[{"text":"lees","it":"Nella frase: Il libro che leggo.","speak":true},{"text":"leest","it":"Terza persona.","speak":true},{"text":"lezen","it":"Plurale.","speak":true}],"correct":0},{"id":"27-g9","type":"fill","prompt":"Completa la frase.","sentence":"werken → De collega met wie wij ___","answer":"werken","answers":["werken"],"it":"Il collega con cui lavoriamo.","hint":"Accorda il verbo dato con il soggetto plurale nella relativa.","note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-g10","type":"mc","prompt":"Completa la frase.","sentence":"De huizen ___ hier staan","answer":"die","answers":["die"],"it":"Le case che si trovano qui.","hint":"Antecedente plurale.","note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa.","options":[{"text":"die","it":"Nella frase: Le case che si trovano qui.","speak":true},{"text":"dat","it":"Solo singolare.","speak":true},{"text":"wie","it":"Persona.","speak":true}],"correct":0}],"mixed":[{"id":"27-m1","type":"order","prompt":"Ricomponi la frase.","it":"Lo studente che abita qui è stanco.","answer":"De student die hier woont is moe.","answers":["De student die hier woont is moe.","Moe is de student die hier woont."],"tiles":[{"text":"De","speak":true},{"text":"student","speak":true},{"text":"die","speak":true},{"text":"hier","speak":true},{"text":"woont","speak":true},{"text":"is","speak":true},{"text":"moe","speak":true},{"text":"diie","speak":false,"distractor":true}],"note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-m2","type":"tr","prompt":"Traduci con le tessere.","it":"Il racconto che leggo è bello.","answer":"Het verhaal dat ik lees is goed.","answers":["Het verhaal dat ik lees is goed.","Goed is het verhaal dat ik lees."],"tiles":[{"text":"Het","speak":true},{"text":"verhaal","speak":true},{"text":"dat","speak":true},{"text":"ik","speak":true},{"text":"lees","speak":true},{"text":"is","speak":true},{"text":"goed","speak":true},{"text":"bericht","speak":true,"distractor":true}],"note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-m3","type":"order","prompt":"Ricomponi la frase.","it":"L’insegnante che conosco è qui.","answer":"De leraar die ik ken is hier.","answers":["De leraar die ik ken is hier.","Hier is de leraar die ik ken."],"tiles":[{"text":"De","speak":true},{"text":"leraar","speak":true},{"text":"die","speak":true},{"text":"ik","speak":true},{"text":"ken","speak":true},{"text":"is","speak":true},{"text":"hier","speak":true},{"text":"kentt","speak":false,"distractor":true}],"note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-m4","type":"tr","prompt":"Traduci con le tessere.","it":"Il messaggio che lei invia è breve.","answer":"Het bericht dat zij stuurt is kort.","answers":["Het bericht dat zij stuurt is kort.","Het bericht dat ze stuurt is kort.","Kort is het bericht dat zij stuurt.","Kort is het bericht dat ze stuurt."],"tiles":[{"text":"Het","speak":true},{"text":"bericht","speak":true},{"text":"dat","speak":true},{"text":"zij","speak":true},{"text":"stuurt","speak":true},{"text":"is","speak":true},{"text":"kort","speak":true},{"text":"ze","speak":true},{"text":"verhaal","speak":true,"distractor":true}],"note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-m5","type":"order","prompt":"Ricomponi la frase.","it":"La vicina con cui parlo è contenta.","answer":"De buurvrouw met wie ik praat is blij.","answers":["De buurvrouw met wie ik praat is blij.","Blij is de buurvrouw met wie ik praat."],"tiles":[{"text":"De","speak":true},{"text":"buurvrouw","speak":true},{"text":"met","speak":true},{"text":"wie","speak":true},{"text":"ik","speak":true},{"text":"praat","speak":true},{"text":"is","speak":true},{"text":"blij","speak":true},{"text":"wiie","speak":false,"distractor":true}],"note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-m6","type":"tr","prompt":"Traduci con le tessere.","it":"Leggo il libro che hai.","answer":"Ik lees het boek dat jij hebt.","answers":["Ik lees het boek dat jij hebt.","Ik lees het boek dat je hebt.","Het boek dat jij hebt lees ik.","Het boek dat je hebt lees ik."],"tiles":[{"text":"Ik","speak":true},{"text":"lees","speak":true},{"text":"het","speak":true},{"text":"boek","speak":true},{"text":"dat","speak":true},{"text":"jij","speak":true},{"text":"hebt","speak":true},{"text":"je","speak":true},{"text":"bericht","speak":true,"distractor":true}],"note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-m7","type":"order","prompt":"Ricomponi la frase.","it":"Gli studenti che lavorano qui sono stanchi.","answer":"De studenten die hier werken zijn moe.","answers":["De studenten die hier werken zijn moe.","Moe zijn de studenten die hier werken."],"tiles":[{"text":"De","speak":true},{"text":"studenten","speak":true},{"text":"die","speak":true},{"text":"hier","speak":true},{"text":"werken","speak":true},{"text":"zijn","speak":true},{"text":"moe","speak":true},{"text":"werkent","speak":false,"distractor":true}],"note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Questo è il racconto che capisco.","answer":"Dit is het verhaal dat ik begrijp.","answers":["Dit is het verhaal dat ik begrijp."],"tiles":[{"text":"Dit","speak":true},{"text":"is","speak":true},{"text":"het","speak":true},{"text":"verhaal","speak":true},{"text":"dat","speak":true},{"text":"ik","speak":true},{"text":"begrijp","speak":true},{"text":"bericht","speak":true,"distractor":true}],"note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-m9","type":"order","prompt":"Ricomponi la frase.","it":"L’uomo che incontro è tranquillo.","answer":"De man die ik ontmoet is rustig.","answers":["De man die ik ontmoet is rustig.","Rustig is de man die ik ontmoet."],"tiles":[{"text":"De","speak":true},{"text":"man","speak":true},{"text":"die","speak":true},{"text":"ik","speak":true},{"text":"ontmoet","speak":true},{"text":"is","speak":true},{"text":"rustig","speak":true},{"text":"ontmoett","speak":false,"distractor":true}],"note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."},{"id":"27-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Il libro di cui parlo è nuovo.","answer":"Het boek waarover ik praat is nieuw.","answers":["Het boek waarover ik praat is nieuw.","Het boek waar ik over praat is nieuw.","Nieuw is het boek waarover ik praat.","Nieuw is het boek waar ik over praat."],"tiles":[{"text":"Het","speak":true},{"text":"boek","speak":true},{"text":"waarover","speak":true},{"text":"ik","speak":true},{"text":"praat","speak":true},{"text":"is","speak":true},{"text":"nieuw","speak":true},{"text":"waar","speak":true},{"text":"over","speak":true},{"text":"verhaal","speak":true,"distractor":true}],"note":"Relativo die con de/plurale, dat con het singolare; verbo in fondo alla relativa."}]},{"id":28,"title":"Hij zegt dat…","it":"Il discorso indiretto","group":5,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Il discorso diretto ripete le parole di qualcuno; quello indiretto le integra nella tua frase. «Nora dice: “Sono stanca”» diventa \u003ci>Nora zegt dat ze moe is\u003c/i>. Non basta togliere le virgolette: devi adattare la prospettiva, scegliere il collegamento e usare l'ordine subordinato. L'italiano fa cambiamenti simili nei pronomi, ma non sposta il verbo nello stesso modo.\u003c/p>\n\u003ch3>1 · Riporta una dichiarazione\u003c/h3>\u003cp>Dopo verbi come \u003ci>zeggen\u003c/i> e \u003ci>vertellen\u003c/i>, una dichiarazione viene spesso introdotta da \u003ci>dat\u003c/i>. Il soggetto originale \u003ci>ik\u003c/i> diventa il pronome che identifica chi ha parlato. Se Nora dice \u003ci>ik ben thuis\u003c/i>, tu puoi riferire \u003ci>Nora zegt dat zij thuis is\u003c/i>. La forma verbale cambia insieme alla persona, e si colloca verso la fine.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Tipo\u003c/th>\u003cth>Collegamento\u003c/th>\u003cth>Struttura riferita\u003c/th>\u003c/tr>\u003ctr>\u003ctd>affermazione\u003c/td>\u003ctd>dat\u003c/td>\u003ctd>hij zegt dat hij komt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>domanda sì/no\u003c/td>\u003ctd>of\u003c/td>\u003ctd>hij vraagt of ik kom\u003c/td>\u003c/tr>\u003ctr>\u003ctd>domanda sul luogo\u003c/td>\u003ctd>waar\u003c/td>\u003ctd>hij vraagt waar ik woon\u003c/td>\u003c/tr>\u003ctr>\u003ctd>domanda sul tempo\u003c/td>\u003ctd>wanneer\u003c/td>\u003ctd>hij vraagt wanneer ik kom\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Riporta una domanda\u003c/h3>\u003cp>Una domanda sì/no usa \u003ci>of\u003c/i>, «se»: \u003ci>hij vraagt of de winkel open is\u003c/i>. Non usare \u003ci>als\u003c/i>, che introduce una condizione. Se la domanda originale contiene una parola interrogativa, conserva quella parola: \u003ci>waar\u003c/i>, \u003ci>wie\u003c/i>, \u003ci>wanneer\u003c/i>. Dentro la domanda indiretta non usare l'inversione della domanda diretta: \u003ci>waar ik woon\u003c/i>, non \u003ci>waar woon ik\u003c/i>.\u003c/p>\n\u003ch3>3 · Controlla tempo e prospettiva\u003c/h3>\u003cp>Quando riferisci al passato, il tempo della subordinata può arretrare: \u003ci>hij zei dat hij moe was\u003c/i>. Qui \u003ci>zei\u003c/i> è il passato di \u003ci>zeggen\u003c/i>, «disse»; \u003ci>vroeg\u003c/i> è il passato di \u003ci>vragen\u003c/i>, «chiese», e non l'avverbio «presto» già incontrato. Ricorda anche \u003ci>komen → kwam\u003c/i> al singolare e \u003ci>kwamen\u003c/i> al plurale. Non applicare però una sostituzione meccanica a ogni frase: se un fatto resta vero, il presente può essere adatto. Anche parole come «qui», «oggi» e «domani» dipendono dal momento e dal luogo di chi riferisce. La traduzione deve conservare il riferimento, non soltanto le parole originali.\u003c/p>\n\u003cp>Negli esercizi trovi indicazioni esplicite su chi parla e su quale tempo usare. Questo permette una risposta determinata senza inventare il contesto. In una conversazione reale, prima identifica il parlante originale e l'interlocutore, poi ricostruisci i pronomi e infine controlla la posizione dei verbi.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Hij vraagt als ik kom.\u003c/s> → \u003cstrong>Hij vraagt of ik kom.\u003c/strong> \u003cs>Hij vraagt waar woon ik.\u003c/s> → \u003cstrong>Hij vraagt waar ik woon.\u003c/strong> \u003cs>Nora zegt dat ik moe ben\u003c/s> → \u003cstrong>Nora zegt dat zij moe is\u003c/strong>, se Nora parlava di se stessa.\u003c/p>","keywords":[{"nl":"dat","it":"che, dichiarazione riferita"},{"nl":"of","it":"se, domanda indiretta"},{"nl":"waar","it":"dove"},{"nl":"wanneer","it":"quando"},{"nl":"zei","it":"disse"},{"nl":"vroeg","it":"chiese"}],"words":[{"nl":"vertellen","it":"raccontare, dire"},{"nl":"vragen","it":"chiedere"},{"nl":"antwoorden","it":"rispondere"},{"nl":"geloven","it":"credere"},{"nl":"de boodschap","it":"il messaggio, comunicazione"},{"nl":"het gesprek","it":"la conversazione"},{"nl":"de vergadering","it":"la riunione"},{"nl":"de informatie","it":"l’informazione"}],"vlaanderen":{"text":"Om hoe laat è standard in Belgio e può comparire anche in una domanda indiretta. Hoe laat resta una scelta condivisa in tutta l’area neerlandofona.","source":{"label":"Team Taaladvies · hoe laat","url":"https://www.vlaanderen.be/team-taaladvies/taaladviezen/hoe-laat-om-hoe-laat-om-welk-uur"}},"source":"hour","practiceNote":"Dat per dichiarazioni; of per domande sì/no; nella domanda indiretta usa l’ordine subordinato.","grammar":[{"id":"28-g1","type":"fill","prompt":"Completa la frase.","sentence":"Hij zegt ___ hij komt.","answer":"dat","answers":["dat"],"it":"Lui dice che viene.","hint":"Riporta un’affermazione.","note":"Dat per dichiarazioni; of per domande sì/no; nella domanda indiretta usa l’ordine subor "],"tiles":[{"text":"Hij","speak":true},{"text":"vertelt","speak":true},{"text":"dat","speak":true},{"text":"hij","speak":true},{"text":"moe","speak":true},{"text":"is","speak":true},{"text":"vertelltt","speak":false,"distractor":true}],"note":"Dat per dichiarazioni; of per domande sì/no; nella domanda indiretta usa l’ordine subordinato."},{"id":"28-m2","type":"tr","prompt":"Traduci con le tessere.","it":"Lei chiede se vengo.","answer":"Zij vraagt of ik kom.","answers":["Zij vraagt of ik kom.","Ze vraagt of ik kom."],"tiles":[{"text":"Zij","speak":true},{"text":"vraagt","speak":true},{"text":"of","speak":true},{"text":"ik","speak":true},{"text":"kom","speak":true},{"text":"Ze","speak":true},{"text":"geloven","speak":true,"distractor":true}],"note":"Dat per dichiarazioni; of per domande sì/no; nella domanda indiretta usa l’ordine subordinato."},{"id":"28-m3","type":"order","prompt":"Ricomponi la frase.","it":"Chiedo dove si tiene la riunione.","answer":"Ik vraag waar de vergadering is.","answers":["Ik vraag waar de vergadering is."],"tiles":[{"text":"Ik","speak":true},{"text":"vraag","speak":true},{"text":"waar","speak":true},{"text":"de","speak":true},{"text":"vergadering","speak":true},{"text":"is","speak":true},{"text":"vraagg","speak":false,"distractor":true}],"note":"Dat per dichiarazioni; of per domande sì/no; nella domanda indiretta usa l’ordine subordinato."},{"id":"28-m4","type":"tr","prompt":"Traduci con le tessere.","it":"Lui risponde che resta a casa.","answer":"Hij antwoordt dat hij thuis blijft.","answers":["Hij antwoordt dat hij thuis blijft."],"tiles":[{"text":"Hij","speak":true},{"text":"antwoordt","speak":true},{"text":"dat","speak":true},{"text":"hij","speak":true},{"text":"thuis","speak":true},{"text":"blijft","speak":true},{"text":"vertellen","speak":true,"distractor":true}],"note":"Dat per dichiarazioni; of per domande sì/no; nella domanda indiretta usa l’ordine subordinato."},{"id":"28-m5","type":"order","prompt":"Ricomponi la frase.","it":"Non t":"de","speak":true},{"text":"informatie","speak":true},{"text":"goed","speak":true},{"text":"is","speak":true},{"text":"boodschap","speak":true,"distractor":true}],"note":"Dat per dichiarazioni; of per domande sì/no; nella domanda indiretta usa l’ordine subordinato."},{"id":"28-m9","type":"order","prompt":"Ricomponi la frase.","it":"Lui chiede a che ora comincia la conversazione.","answer":"Hij vraagt hoe laat het gesprek begint.","answers":["Hij vraagt hoe laat het gesprek begint.","Hij vraagt om hoe laat het gesprek begint."],"tiles":[{"text":"Hij","speak":true},{"text":"vraagt","speak":true},{"text":"hoe","speak":true},{"text":"laat","speak":true},{"text":"het","speak":true},{"text":"gesprek","speak":true},{"text":"begint","speak":true},{"text":"om","speak":true},{"text":"begintt","speak":false,"distractor":true}],"note":"Hoe laat è comune a tutta l’area neerlandofona; om hoe laat è anche standard in Belgio. Entrambe chiedono l’orario."},{"id":"28-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Lei racconta che ha lavorato.","answer":"Zij vertelt dat zij heeft gewerkt.","answers":["Zij vertelt dat zij heeft gewerkt.","Zij vertelt dat zij gewerkt heeft.","Ze vertelt dat ze heeft gewerkt.","Ze vertelt dat ze gewerkt heeft.","Zij vertelt dat ze heeft gewerkt.","Zij vertelt dat ze gewerkt heeft.","Ze vertelt dat zij heeft gewerkt.","Ze vertelt dat zij gewerkt heeft."],"tiles":[{"text":"Zij","speak":true},{"text":"vertelt","speak":true},{"text":"dat","speak":true},{"text":"zij","speak":true},{"text":"heeft","speak":true},{"text":"gewerkt","speak":true},{"text":"Ze","speak":true},{"text":"ze","speak":true},{"text":"antwoorden","speak":true,"distractor":true}],"note":"Zij e ze possono riferirsi alla stessa donna. Heeft gewerkt e gewerkt heeft mantengono lo stesso tempo; dat introduce sempre ciò che lei racconta."}]},{"id":29,"title":"Niet meer, nog niet","it":"Negazione II","group":5,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Dire che qualcosa non accade può implicare tempi diversi: «non ancora» lascia aperta un'attesa, «non più» indica un cambiamento. Il neerlandese rende questa distinzione con \u003ci>nog niet\u003c/i> e \u003ci>niet meer\u003c/i>. Conoscere soltanto \u003ci>niet\u003c/i> non basta a esprimere questi significati. In questa unità allarghi la negazione a persone, cose, luoghi e quantità senza aggiungere automaticamente il «non» italiano.\u003c/p>\n\u003ch3>1 · Colloca l'evento nel tempo\u003c/h3>\u003cp>\u003ci>Ik werk nog niet\u003c/i> significa «non lavoro ancora»: la situazione potrebbe cambiare. \u003ci>Ik werk niet meer\u003c/i> significa «non lavoro più»: prima lavoravo. In questa frase è possibile anche \u003ci>niet langer\u003c/i>, con lo stesso senso di cessazione. Con un nome indefinito usa \u003ci>nog geen\u003c/i> oppure \u003ci>geen … meer\u003c/i>: \u003ci>ik heb nog geen fiets\u003c/i>, «non ho ancora una bici», e \u003ci>ik heb geen fiets meer\u003c/i>, «non ho più una bici».\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Forma\u003c/th>\u003cth>Significato\u003c/th>\u003cth>Frase breve\u003c/th>\u003c/tr>\u003ctr>\u003ctd>nog niet\u003c/td>\u003ctd>non ancora\u003c/td>\u003ctd>ik ben nog niet klaar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>niet meer\u003c/td>\u003ctd>non più\u003c/td>\u003ctd>ik werk niet meer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>niemand\u003c/td>\u003ctd>nessuno\u003c/td>\u003ctd>niemand komt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>niets\u003c/td>\u003ctd>niente\u003c/td>\u003ctd>ik zie niets\u003c/td>\u003c/tr>\u003ctr>\u003ctd>nergens\u003c/td>\u003ctd>da nessuna parte\u003c/td>\u003ctd>ik ga nergens heen\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>In \u003ci>nergens heen\u003c/i>, \u003ci>heen\u003c/i> indica una direzione, «verso un luogo». Il gruppo significa «verso nessun luogo» e accompagna qui \u003ci>gaan\u003c/i>; non aggiunge una seconda negazione.\u003c/p>\n\u003ch3>2 · Evita la doppia negazione automatica\u003c/h3>\u003cp>In italiano «non vedo nessuno» contiene due elementi negativi. Nello standard neerlandese, \u003ci>ik zie niemand\u003c/i> basta. Lo stesso vale con \u003ci>niets\u003c/i>, «niente», e \u003ci>nooit\u003c/i>, «mai». Anche \u003ci>niks\u003c/i> significa «niente»: è corretto, ma generalmente più informale di \u003ci>niets\u003c/i>. Una seconda negazione può cambiare il significato oppure produrre una forma regionale, ma non è la costruzione neutra esercitata qui. Quando \u003ci>niemand\u003c/i> è soggetto, il verbo è normalmente singolare.\u003c/p>\n\u003ch3>3 · Leggi cosa viene negato\u003c/h3>\u003cp>La posizione di \u003ci>niet\u003c/i> può mettere in contrasto una parte specifica: \u003ci>niet vandaag, maar morgen\u003c/i>, «non oggi, ma domani». Non giudicare una frase soltanto dalla presenza della parola negativa. Per «non ho proprio niente», \u003ci>helemaal niets\u003c/i> intensifica la negazione senza ripetere \u003ci>niet\u003c/i>. \u003ci>Nog nooit\u003c/i> significa «mai fino ad ora», mentre \u003ci>nooit meer\u003c/i> indica «mai più». È corretto anche \u003ci>nooit weer\u003c/i>, meno frequente: qui \u003ci>weer\u003c/i> significa «di nuovo», non «tempo atmosferico».\u003c/p>\n\u003cp>Per costruire la risposta, decidi prima se parli di tempo, quantità, persona o cosa. Poi scegli il gruppo negativo completo. Il corso separa questi significati nella traduzione: una frase con \u003ci>nog niet\u003c/i> è grammaticalmente valida, ma non traduce una richiesta che dice «non più».\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Ik zie niet niemand.\u003c/s> → \u003cstrong>Ik zie niemand.\u003c/strong> \u003cs>Ik heb niet meer een fiets.\u003c/s> → \u003cstrong>Ik heb geen fiets meer.\u003c/strong> \u003cs>Niemand komen.\u003c/s> → \u003cstrong>Niemand komt.\u003c/strong>\u003c/p>","keywords":[{"nl":"nog niet","it":"non ancora"},{"nl":"niet meer","it":"non più"},{"nl":"nog geen","it":"non ancora un/nessun"},{"nl":"niemand","it":"nessuno"},{"nl":"niets","it":"niente"},{"nl":"nergens","it":"da nessuna parte"},{"nl":"nooit meer","it":"mai più"},{"nl":"nog nooit","it":"mai finora"}],"words":[{"nl":"beschikbaar","it":"disponibile"},{"nl":"volledig","it":"completo"},{"nl":"leeg","it":"vuoto"},{"nl":"nodig","it":"necessario"},{"nl":"vinden","it":"trovare"},{"nl":"ontbreken","it":"mancare"},{"nl":"de voorraad","it":"la scorta"},{"nl":"de hulp","it":"l’aiuto"}],"vlaanderen":{"text":"In Belgio goesting è usato informalmente per “voglia”. Nog geen goesting significa “non ancora voglia”; geen goesting meer significa “non più voglia”.","source":{"label":"Canon van Vlaanderen · goesting","url":"https://www.canonvanvlaanderen.be/events/goesting/"}},"source":"goesting","practiceNote":"Nog niet = non ancora; niet meer = non più. Niemand/niets/nooit normalmente bastano senza niet.","grammar":[{"id":"29-g1","type":"fill","prompt":"Completa la frase.","sentence":"Ik werk niet ___.","answer":"meer","answers":["meer","langer"],"it":"Non lavoro più.","hint":"Una situazione passata è terminata.","note":"Niet meer e niet langer indicano qui che il lavoro non continua."},{"id":"29-g2","type":"mc","prompt":"Completa la frase.","sentence":"Ik ben ___ niet klaar.","answer":"nog","answers":["nog"],"it":"Non sono ancora pronto.","hint":"La preparazione è attesa.","note":"Nog niet = non ancora; niet meer = non più. Niemand/niets/nooit normalmente bastano senza niet.","options":[{"text":"nog","it":"Nella frase: Non sono ancora pronto.","speak":true},{"text":"meer","it":"Non più, altro ordine.","speak":true},{"text":"geen","it":"Nega un nome.","speak":true}],"correct":0},{"id":"29-g3","type":"fill","prompt":"Completa la frase.","sentence":"Ik heb ___ fiets meer.","answer":"geen","answers":["geen"],"it":"Non ho più una bici.","hint":"Negazione di un nome indefinito.","note":"Nog niet = non ancora; niet meer = non più. Niemand/niets/nooit normalmente bastano senza niet."},{"id":"29-g4","type":"mc","prompt":"Completa la frase.","sentence":"___ komt.","answer": les":[{"text":"Wij","speak":true},{"text":"vinden","speak":true},{"text":"niemand","speak":true},{"text":"We","speak":true},{"text":"nodig","speak":true,"distractor":true}],"note":"Nog niet = non ancora; niet meer = non più. Niemand/niets/nooit normalmente bastano senza niet."}]},{"id":30,"title":"Goed geschreven","it":"Punteggiatura e ortografia","group":5,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Scrivere correttamente non significa riprodurre ogni pausa della voce. Il neerlandese usa convenzioni che aiutano a riconoscere parole e confini della frase: maiuscole, segni di punteggiatura, apostrofi e dieresi svolgono ruoli diversi. Per un italiano sono particolarmente importanti le vocali lunghe e brevi e la scrittura unita di molti composti. Questa unità raccoglie le regole incontrate lungo il percorso.\u003c/p>\n\u003ch3>1 · Conserva il suono nella grafia\u003c/h3>\u003cp>Una vocale lunga può richiedere due lettere in una sillaba chiusa e una sola in una sillaba aperta: \u003ci>maan\u003c/i> e \u003ci>manen\u003c/i>. Una vocale breve può richiedere una doppia consonante quando aggiungi una sillaba: \u003ci>man\u003c/i> e \u003ci>mannen\u003c/i>. Non è una scelta estetica: cambiare il raddoppiamento può creare un'altra parola. Osserva quindi struttura sillabica e suono, non soltanto la lunghezza visiva.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Segno o regola\u003c/th>\u003cth>Forma\u003c/th>\u003cth>Funzione\u003c/th>\u003c/tr>\u003ctr>\u003ctd>apostrofo\u003c/td>\u003ctd>auto's\u003c/td>\u003ctd>conserva la vocale del plurale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>dieresi\u003c/td>\u003ctd>België\u003c/td>\u003ctd>separa suoni vocalici\u003c/td>\u003c/tr>\u003ctr>\u003ctd>trattino\u003c/td>\u003ctd>e-mail\u003c/td>\u003ctd>fa parte della parola\u003c/td>\u003c/tr>\u003ctr>\u003ctd>composto\u003c/td>\u003ctd>huisdeur\u003c/td>\u003ctd>unisce due elementi\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Distingui segni di parola e di frase\u003c/h3>\u003cp>L'apostrofo in \u003ci>auto's\u003c/i> non è equivalente a un punto finale: appartiene alla grafia della parola. Anche la dieresi in \u003ci>België\u003c/i>, «Belgio», e il trattino in \u003ci>e-mail\u003c/i> devono essere conservati. L'apostrofo diritto e quello tipografico rappresentano lo stesso segno ortografico. La dieresi segnala che la vocale inizia una nuova sillaba; eliminarla non equivale a cambiare una pausa della frase.\u003c/p>\n\u003ch3>3 · Segna i confini\u003c/h3>\u003cp>Una frase dichiarativa termina normalmente con un punto; una domanda diretta con un punto interrogativo. Una domanda indiretta dentro una dichiarazione non richiede automaticamente il punto interrogativo: \u003ci>ik weet niet waar hij woont\u003c/i>. La virgola può rendere leggibile il confine dopo una subordinata iniziale. Non separare abitualmente soggetto e verbo con una virgola solo perché nella lettura fai una pausa.\u003c/p>\n\u003cp>Nomi propri e nomi delle lingue prendono la maiuscola; giorni e mesi normalmente no. Molti composti si scrivono uniti: \u003ci>huisdeur\u003c/i>, «porta di casa». Per rendere leggibile un composto difficile è ammesso anche un trattino facoltativo; negli esercizi usiamo la grafia comune del lessico. Quando una forma ti è nuova, controlla la parola intera. Gli esercizi sulle tessere allenano la struttura; le lacune scritte chiedono una sola parola e permettono di esercitare i segni interni.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Belgie\u003c/s> → \u003cstrong>België\u003c/strong>. \u003cs>Autos\u003c/s> → \u003cstrong>auto's\u003c/strong>. \u003cs>E mail\u003c/s> → \u003cstrong>e-mail\u003c/strong>. \u003cs>Huis deur\u003c/s> → \u003cstrong>huisdeur\u003c/strong>, quando intendi il nome composto.\u003c/p>","keywords":[{"nl":"de punt","it":"il punto"},{"nl":"de komma","it":"la virgola"},{"nl":"het vraagteken","it":"il punto interrogativo"},{"nl":"de apostrof","it":"l’apostrofo"},{"nl":"het trema","it":"la dieresi"},{"nl":"het koppelteken","it":"il trattino"}],"words":[{"nl":"de e-mail","it":"l’e-mail"},{"nl":"de huisdeur","it":"la porta di casa"},{"nl":"de maan","it":"la luna"},{"nl":"het woord","it":"la parola"},{"nl":"de letter","it":"la lettera dell’alfabeto"},{"nl":"de regel","it":"la regola, riga"},{"nl":"schrijven","it":"scrivere"},{"nl":"controleren","it":"controllare"}],"vlaanderen":{"text":"Le indicazioni ufficiali sulla lingua standard belga distinguono varianti riconosciute e usi non standard. Per la grafia, consulta un repertorio ortografico quando una parola non è familiare.","source":{"label":"Taaladvies · lo standard in Belgio","url":"https://taaladvies.net/wat-is-standaardtaal-algemeen/"}},"source":"standard","practiceNote":"Conserva i segni interni nelle grafie studiate: België, auto’s, e-mail. Mantieni il tipo di frase e il significato della traduzione.","grammar":[{"id":"30-g1","type":"fill","prompt":"Completa la frase.","sentence":"Il nome del Belgio: ___","answer":"België","answers":["België"],"it":"Belgio.","hint":"Conserva il segno che separa le vocali.","note":"Conserva i segni interni nelle grafie studiate: België, auto’s, e-mail. Mantieni il tipo di frase e il significato della traduzione."},{"id":"30-g2","type":"mc","prompt":"Completa la frase.","sentence":"Plurale di auto: ___","answer":"auto's","answers":["auto's"],"it":"Automobili.","hint":"Conserva la vocale finale.","note":"Conserva i segni interni nelle grafie studiate: België, auto’s, e-mail. Mantieni il tipo di frase e il significato della traduzione.","options":[{"text":"auto's","it":"Nella frase: Automobili.","speak":true},{"text":"autos","it":"Manca l’apostrofo.","speak":false},{"text":"auto","it":"Singolare.","speak":true}],"correct":0},{"id":"30-g3","type":"fill","prompt":"Completa la frase.","sentence":"Plurale di foto: ___","answer":"foto's","answers":["foto's"],"it":"Foto al plurale.","hint":"Usa il segno interno necessario.","note":"Conserva i segni interni nelle grafie studi   <aside class="sidebar">${nextCard(next)}<section class="card"><div class="row"><h2>Ci riproviamo?</h2><span class="pill" data-testid="error-count">${errorCount}</span></div><p class="small">Gli errori sono il punto da cui ripartire.</p><button class="wide" data-action="review" ${errorCount?'':'disabled'}>Ripasso errori${errorCount?' →':''}</button></section><div class="card"><span class="eyebrow">Il metodo Patatino</span><p class="small">Prima il lessico, poi la grammatica. Due parti, un traguardo: almeno l’80% al primo tentativo delle domande.</p><p class="small">Tocca una parola per ascoltarla. Toccala ancora per rallentare.</p></div></aside></div><footer class="footer">Contenuti originali · Nessun account · Progressi su questo dispositivo <br><button class="back" data-action="settings">Audio, colori e installazione</button></footer>`;
}
function wordCards(words){return `<div class="lexicon">${words.map(word=>`<button class="word" data-action="speak" data-text="${esc(word.nl)}"><strong lang="nl">${esc(word.nl)} <span class="speaker" aria-hidden="true">♪</span></strong><small>${esc(word.it)}</small></button>`).join('')}</div>`;}
function scoreLabel(record){return record?`${record.passed?'✓ ':''}Migliore: ${record.best}% · ultimo: ${record.last}%`:'Da iniziare';}
function renderUnit(){
  const u=unitById(route.unit),next=nextPart(state,u),blocks=vocabularyBlocks(u.words);
  return `<div class="lesson"><div class="row page-head"><button class="back" data-action="back">‹ Percorso</button><span class="pill">Unità ${u.id} / 30</span></div><header class="row start page-head"><div><span class="eyebrow">${GROUPS[u.group]}</span><h1 lang="nl">${esc(u.title)}</h1><p>${esc(u.it)}</p></div>${mascot(unitComplete(state,u)?'festa':'contento')}</header>
  <article class="card explanation">${u.explanation}</article>
  <aside class="card vlaanderen"><span class="pill">IN VLAANDEREN</span><p>${esc(u.vlaanderen.text)}</p><a class="small" href="${esc(u.vlaanderen.source.url)}" target="_blank" rel="noopener noreferrer">${esc(u.vlaanderen.source.label)} ↗</a></aside>
  ${u.keywords.length?`<section class="card"><span class="eyebrow">Ascolta · tocca ancora per rallentare</span><h2>Parole chiave della grammatica</h2>${wordCards(u.keywords)}</section>`:''}
  <section class="card"><span class="eyebrow">${u.words.length} parole per questa unità</span><h2>Lessico</h2>${wordCards(u.words)}</section>
  <section class="card"><h2>Mettiamolo in pratica</h2><p class="section-intro">Per completare l’unità supera ogni blocco di lessico e la grammatica con almeno l’80%. Gli errori tornano in fondo alla sessione.</p>
  <div class="part"><span class="eyebrow">Parte 1</span><h3>Lessico</h3><p class="small">Presentazione → riconoscimento → ascolto → produzione. Un gruppo di massimo 6 parole alla volta.</p>${blocks.map((block,i)=>`<button class="part-button" data-action="start" data-unit="${u.id}" data-part="vocab" data-block="${i}"><span>${blocks.length>1?`Blocco ${i+1} · `:''}${block.length} parole<small class="muted" style="display:block">${scoreLabel(scoreFor(state,u.id,'vocab',i))}</small></span><span>→</span></button>`).join('')}</div>
  <div class="part"><span class="eyebrow">Parte 2</span><h3>Grammatica</h3><p class="small">Le parole chiave, 6 esercizi sulla regola e 8 frasi miste. Le domande ruotano tra i tentativi.</p><button class="part-button" data-action="start" data-unit="${u.id}" data-part="grammar"><span>Inizia grammatica<small class="muted" style="display:block">${scoreLabel(scoreFor(state,u.id,'grammar'))}</small></span><span>→</span></button></div></section>
  <div class="bottom"><button data-action="back">‹ Percorso</button><button class="primary" data-action="start" data-unit="${u.id}" data-part="${next.part}" data-block="${next.block}">${esc(next.label)} →</button></div></div>`;
}
function startSession(unitId,part,block=0,replace=false){
  const u=unitById(unitId);
  let queue=part==='review'?Object.values(state.errors).map(error=>({...error.question,unit:error.unit})):
    part==='vocab'?makeVocabularyQueue(u,block):makeGrammarQueue(u,scoreFor(state,unitId,'grammar')?.attempts||0);
  if(!queue.length){toast('Nessun errore da ripassare. Goed zo!');return;}
  session={id:`${Date.now()}-${Math.random().toString(36).slice(2)}`,unit:unitId||0,part,block,queue,index:0,total:queue.filter(q=>q.type!=='card').length,correct:0,firstAnswers:{},selection:[],selected:null,checked:false,feedback:null,prepared:null,initialCount:queue.length};
  if(part==='review'){
    if(route.page==='home')go('review');
    go('exercise',{unit:0},replace);
  }else go('exercise',{unit:unitId},replace);
}
function currentQuestion(){return session?.queue[session.index];}
function prepareQuestion(){
  const q=currentQuestion();if(!q)return;
  if(session.prepared===session.index)return;
  session.options=q.options?shuffle(q.options.map((option,i)=>({...option,sourceIndex:i}))):[];
  session.tiles=q.tiles?shuffle(q.tiles.map((tile,i)=>({...tile,id:i}))):[];
  session.selection=[];session.selected=null;session.checked=false;session.feedback=null;session.prepared=session.index;session.input='';
}
function renderExercise(){
  prepareQuestion();const q=currentQuestion();
  const percent=Math.round(session.index/session.queue.length*100);
  const counter=`${session.index+1} / ${session.queue.length}`;
  const reaction=session.checked?(session.feedback.ok?'contento':'dispiaciuto'):'saluto';
  return `<section class="exercise-shell"><div class="exercise-top"><button class="icon" data-action="back" aria-label="Esci dagli esercizi">×</button>${progressBar(percent,'Avanzamento sessione')}<span class="count">${counter}</span></div>
  <div class="card exercise-card">${mascot(reaction,'exercise-watermark')}${q.retry?'<span class="pill review-tag">Riproviamo questa domanda</span>':''}
  ${q.type==='card'?renderStudy(q):renderQuestion(q)}
  </div><p class="exercise-footer">${session.part==='review'?'Ripasso · ogni risposta corretta elimina un errore salvato.':`${session.part==='vocab'?'Parte 1 · Lessico':'Parte 2 · Grammatica'} · Le ripetizioni aiutano a imparare, ma non cambiano il punteggio iniziale.`}</p></section>`;
}
function renderStudy(q){
  return `<div class="card-study"><span class="eyebrow">${q.kind==='grammatica'?'Prima, le parole chiave':'Una parola da conoscere'}</span>${mascot('contento')}<h1 class="study-word" lang="nl">${esc(q.word.nl)}</h1><p>${esc(q.word.it)}</p><button data-action="speak" data-text="${esc(q.word.nl)}">♪ Ascolta</button><p class="small muted" style="margin-top:14px">Tocca ancora per la versione lenta.</p><div class="form-actions"><button class="primary" data-action="next">Continua →</button></div></div>`;
}
function renderQuestion(q){
  const hasAudio=q.mode==='listen',canListen=!!synth&&voices.length>0&&state.audio;
  const isTiles=q.type==='order'||q.type==='tr';
  return `<span class="eyebrow">${q.type==='fill'?'Una parola':q.type==='order'?'Ordine delle parole':q.type==='tr'?'Traduzione':'Scegli una risposta'}</span><h1>${esc(q.prompt)}</h1>
  ${q.sentence?`<p class="prompt-nl" ${q.mode==='produce'?'':'lang="nl"'}>${esc(q.sentence)}</p>`:''}
  ${hasAudio?`<button data-action="speak" data-text="${esc(q.audio)}" class="wide">♪ Ascolta la parola</button>${!canListen?`<p class="notice">Audio ${state.audio?'neerlandese non disponibile':'disattivato'}. Puoi continuare leggendo: <strong lang="nl">${esc(q.audio)}</strong>.</p>`:''}`:''}
  ${!q.mode?`<p class="prompt-it">${esc(q.it)}</p>`:''}
  ${q.hint?`<p class="hint">${esc(q.hint)}</p>`:''}
  ${q.type==='mc'?`<div class="choices">${session.options.map((opt,i)=>`<button class="choice ${session.selected===i?'selected':''}" data-action="choose" data-index="${i}" aria-pressed="${session.selected===i}" ${session.checked?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span ${opt.speak?'lang="nl"':''}>${esc(opt.text)}</span></button>`).join('')}</div>`:''}
  ${q.type==='fill'?`<label class="sr-only" for="written-answer">La parola mancante</label><input id="written-answer" class="text-answer" value="${esc(session.input||'')}" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Scrivi una parola…" ${session.checked?'disabled':''}><p class="small muted">Maiuscole e punteggiatura finale non contano. Conserva i segni interni richiesti, come in België e auto's.</p>`:''}
  ${isTiles?`<div class="tile-answer" aria-label="La tua frase">${session.selection.length?session.selection.map(id=>{const tile=session.tiles.find(t=>t.id===id);return `<button class="tile" lang="nl" data-action="remove-tile" data-id="${id}" ${session.checked?'disabled':''}>${esc(tile.text)}</button>`;}).join(''):'<span class="placeholder">Tocca le parole nell’ordine desiderato.</span>'}</div><div class="tile-bank" aria-label="Parole disponibili">${session.tiles.map(tile=>`<button class="tile ${session.selection.includes(tile.id)?'used':''}" data-action="tile" data-id="${tile.id}" ${session.checked||session.selection.includes(tile.id)?'disabled':''} lang="nl">${esc(tile.text)}</button>`).join('')}</div><p class="small muted">Non servono tutte le tessere. Tocca una parola nella frase per rimuoverla.</p>`:''}
  ${session.checked?renderFeedback(q):''}
  <div class="form-actions"><button class="primary" data-action="${session.checked?'next':'check'}">${session.checked?'Continua →':'Controlla'}</button></div>`;
}
function explanationForInput(q,input){
  if(q.type==='mc')return session.options[session.selected]?.it||'Nessuna alternativa selezionata.';
  const known=UNITS.flatMap(u=>[...u.words,...u.keywords]).find(w=>acceptsAnswer(input,[w.nl,w.nl.replace(/^(?:de|het|zich) /,'')]));
  if(known)return `«${known.it}». ${q.note}`;
  if(q.type==='fill')return `La forma scritta non completa la frase con il significato richiesto. ${q.note}`;
  const terms=UNITS.flatMap(u=>[...u.words,...u.keywords]);
  const glosses=input.split(/\s+/).map(token=>{const word=terms.find(w=>acceptsAnswer(token,[w.nl,w.nl.replace(/^(?:de|het|zich) /,'')]));return word?`${token} = ${word.it}`:null;}).filter(Boolean);
  return glosses.length?`Parole riconosciute: ${[...new Set(glosses)].join('; ')}. La sequenza non rende la frase richiesta.`:'L’ordine o le forme scelte non costituiscono la traduzione richiesta; vedi la frase corretta.';
}
function renderFeedback(q){
  const f=session.feedback,full=q.sentence?.includes('___')?q.sentence.replace('___',q.answer):q.mode==='meaning'||q.mode==='listen'?q.audio||q.sentence:q.answer;
  return `<section class="feedback ${f.ok?'':'bad'}" role="status" aria-live="polite"><h2 lang="nl">${f.ok?'Goed zo!':'Niet helemaal'}</h2>
  ${f.ok?`<p>${q.retry?'Questa volta è giusta.': 'Risposta corretta.'}</p>`:`<div class="compare"><div class="answer-box wrong"><span class="label">La tua scelta</span><p>${esc(f.answer)}</p><small>${esc(explanationForInput(q,f.answer))}</small></div><div class="answer-box"><span class="label">Giusta</span><p lang="nl">${esc(q.answer)}</p><small>${esc(q.it)}</small></div></div>`}
  <p><b lang="nl">${esc(full)}</b><br>${esc(q.it)}</p><p class="small">${esc(q.note)}</p>
  ${q.type==='mc'?`<details><summary class="small">Significato delle alternative</summary><ul class="small">${q.options.map(o=>`<li><b>${esc(o.text)}</b>: ${esc(o.it)}</li>`).join('')}</ul></details>`:''}
  ${!f.ok?`<p class="small">${session.part==='review'?'La domanda torna più avanti nel ripasso.':q.retry?'Resta nel ripasso errori per la prossima volta.':'La domanda torna in fondo alla sessione ed è salvata nel ripasso.'}</p>`:''}</section>`;
}
function checkAnswer(){
  if(session.checked)return;
  const q=currentQuestion();let answer;
  if(q.type==='mc'){if(session.selected===null){toast('Scegli una risposta.');return;}answer=session.options[session.selected].text;}
  else if(q.type==='fill'){answer=document.querySelector('#written-answer').value.trim();session.input=answer;if(!answer){toast('Scrivi la parola mancante.');return;}}
  else {answer=session.selection.map(id=>session.tiles.find(t=>t.id===id).text).join(' ');if(!answer){toast('Componi la frase con le tessere.');return;}}
  const ok=q.type==='mc'?session.options[session.selected].sourceIndex===q.correct:acceptsAnswer(answer,q.answers);
  if(!session.firstAnswers[q.id]){
    session.firstAnswers[q.id]={ok};if(ok)session.correct++;
  }
  if(session.part==='review'){
    if(ok)delete state.errors[q.id];else session.queue.push({...q,retry:true});
  }else if(!ok){
    state.errors[q.id]={unit:q.unit||session.unit,question:{...q,retry:false},lastAnswer:answer};
    if(!q.retry)session.queue.push({...q,retry:true});
  }
  session.checked=true;session.feedback={ok,answer};save();render(false);
  document.querySelector('.feedback')?.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function nextQuestion(){
  const q=currentQuestion();if(q.type!=='card'&&!session.checked)return;
  session.index++;
  if(session.index>=session.queue.length){
    lastResult=finishSession(state,session);save();go('result',{unit:session.unit},true);
  }else render(true);
}
function renderResult(){
  const r=lastResult,u=unitById(r.unit),complete=u&&unitComplete(state,u),next=u?nextPart(state,u):null;
  const expression=r.percent===100?'festa':r.passed?'contento':'dispiaciuto';
  return `<section class="card result"><span class="eyebrow">${r.part==='review'?'Ripasso concluso':complete?'Unità completata':r.passed?'Parte superata':'Un altro passo per imparare'}</span>
  <h1>${r.part==='review'?'Errori risolti!':r.passed?'Goed gedaan!':'Ci riproviamo.'}</h1>${mascot(expression)}
  <div class="score">${r.percent}%</div><p>${r.correct} / ${r.total} risposte corrette al primo tentativo</p>
  <p>${r.part==='review'?'Hai corretto la coda di ripasso.':r.passed?'Hai raggiunto la soglia dell’80%.':'Per superare questa parte serve l’80%. Gli errori sono salvati: ripartiamo da quelli.'}</p>
  <div class="result-stats"><span class="pill">+${r.xp} XP</span><span class="pill">↗ ${visibleStreak(state)} giorni</span><span class="pill">${state.xp} XP totali</span></div>
  <div class="column">${r.part==='review'?'<button class="primary" data-action="finish-review">Torna al percorso →</button>':
    complete&&u.id<30?`<button class="primary" data-action="next-unit" data-unit="${u.id+1}">Unità ${u.id+1} · ${esc(unitById(u.id+1).it)} →</button>`:
    r.passed&&!complete?`<button class="primary" data-action="result-next" data-unit="${u.id}" data-part="${next.part}" data-block="${next.block}">${esc(next.label)} →</button>`:
    complete?'<button class="primary" data-action="result-home">Percorso completato →</button>':''}
    <button data-action="retry">Rifai${r.part==='review'?' le domande':''}</button><button class="back" data-action="back">${r.part==='review'?'‹ Ripasso':'‹ Torna all’unità'}</button></div></section>`;
}
function renderReview(){
  const errors=Object.values(state.errors);
  return `<div class="lesson"><button class="back" data-action="back">‹ Percorso</button><section class="card" style="margin-top:20px"><span class="eyebrow">Un passo alla volta</span><h1>Ripasso errori</h1><p><span data-testid="error-count">${errors.length}</span> domande da riprendere. Ogni risposta corretta elimina l’errore; quelle sbagliate tornano in fondo.</p><button class="primary wide" data-action="start-review" ${errors.length?'':'disabled'}>${errors.length?'Inizia il ripasso →':'Tutto ripassato ✓'}</button></section>${errors.length?`<div class="card"><h2>Da queste unità</h2><p>${[...new Set(errors.map(e=>e.unit))].map(id=>`${id}. ${esc(unitById(id)?.it||'Lessico')}`).join('<br>')}</p></div>`:`<div class="empty">${mascot('festa')}<p>Goed zo! Nessun errore in coda.</p></div>`}</div>`;
}
function renderSettings(){
  return `<div class="settings"><div class="row page-head"><button class="back" data-action="back">‹ Percorso</button><span class="pill">Su questo dispositivo</span></div><h1>Fallo tuo.</h1>
  <section class="card"><h2>Il tuo colore</h2><div class="palette-grid">${Object.entries(PALETTES).map(([id,p])=>`<button class="palette-button ${state.palette===id?'chosen':''}" data-action="palette" data-palette="${id}" aria-pressed="${state.palette===id}" style="background:${p.bg};box-shadow:4px 4px 0 ${p.accent}"><span class="palette-dot" style="background:${p.accent}"></span>${p.name}${state.palette===id?' ✓':''}<small style="display:block">Testo nero · sfondo chiaro</small></button>`).join('')}</div></section>
  <section class="card"><h2>Una voce neerlandese</h2><p>Preferenza per il Belgio (nl-BE), poi altre voci neerlandesi. Tocca due volte lo stesso testo per ascoltarlo più lentamente.</p>
  <button data-action="audio" aria-pressed="${state.audio}" style="margin-bottom:18px">Audio ${state.audio?'attivo ♪':'disattivato'}</button>
  <label for="voice-select" class="small">Voce del dispositivo</label><select id="voice-select" class="voice-select" ${voices.length?'':'disabled'}><option value="">Automatica · preferisci nl-BE</option>${voices.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===state.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})${v.localService?' · locale':''}</option>`).join('')}</select>
  <button data-action="test-voice" ${voices.length?'':'disabled'}>♪ Prova: Dag, we gaan!</button><button class="back" data-action="voices" style="margin-left:14px">Aggiorna voci</button>
  ${voices.length?'':`<p class="notice" style="margin-top:18px">Nessuna voce neerlandese trovata. Finché non è disponibile, Patatino resta silenzioso e gli esercizi di ascolto mostrano la parola.</p>`}
  <h3>Android</h3><p class="small">Nelle Impostazioni cerca “Sintesi vocale” o “Output sintesi vocale”. Apri le impostazioni del motore vocale e scarica i dati per Nederlands. I nomi dei menu possono variare. Poi riapri Chrome e aggiorna le voci.</p>
  <h3>iPhone / iPad</h3><p class="small">Apri Impostazioni → Accessibilità → Contenuto letto ad alta voce (o Contenuti parlati) → Voci → Neerlandese/Nederlands. Scarica una voce, poi riapri Safari. Alcune voci del sistema potrebbero non essere esposte al browser.</p>
  <p class="small">Per ascoltare offline, scarica una voce locale. La disponibilità dell’audio dipende dal dispositivo.</p></section>
  <section class="card"><h2>Patatino sulla Home</h2><p class="small">Android / Chrome: menu ⋮ → Installa app o Aggiungi a schermata Home. iPhone / Safari: Condividi → Aggiungi alla schermata Home. Apri una volta online per preparare la copia offline.</p>${installEvent?'<button class="primary" data-action="install">Installa Patatino</button>':''}<p id="offline-status" class="small">${'serviceWorker' in navigator?'Il supporto offline si attiva quando apri l’app tramite HTTPS o localhost.':'Questo browser non supporta il funzionamento offline.'}</p></section>
  <section class="card"><h2>I tuoi progressi</h2><p class="small">Salvati soltanto in questo browser. Cambiando dispositivo o cancellando i dati del sito, non vengono trasferiti automaticamente.</p>${state.legacyProgress?'<p class="small">I punti della versione precedente sono conservati. Le nuove unità hanno contenuti diversi e vanno completate nel nuovo percorso.</p>':''}</section></div>`;
}
function render(scroll=false){
  applyTheme();
  app.innerHTML=(storageFailed?'<p class="notice" role="alert">Il browser non permette di salvare. Puoi studiare, ma i progressi potrebbero andare persi alla chiusura.</p>':'')+
    (route.page==='home'?renderHome():route.page==='unit'?renderUnit():route.page==='exercise'?renderExercise():route.page==='result'?renderResult():route.page==='settings'?renderSettings():renderReview());
  document.title=route.page==='unit'?`${unitById(route.unit).it} · Patatino`:'Patatino · Nederlands in Vlaanderen';
  if(scroll)window.scrollTo(0,0);
}
app.addEventListener('input',event=>{if(event.target.id==='written-answer')session.input=event.target.value;});
app.addEventListener('change',event=>{if(event.target.id==='voice-select'){state.voiceURI=event.target.value;save();}});
app.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.id==='written-answer'){event.preventDefault();checkAnswer();}});
app.addEventListener('click',event=>{
  const el=event.target.closest('[data-action]');if(!el||el.disabled)return;
  event.preventDefault();const {action}=el.dataset;
  if(action==='back')back();
  else if(action==='home'){if(route.page!=='home')fromHome(()=>render(true));}
  else if(action==='unit')go('unit',{unit:Number(el.dataset.unit)});
  else if(action==='settings')fromHome(()=>go('settings'));
  else if(action==='audio'){state.audio=!state.audio;if(!state.audio)synth?.cancel();save();render(false);}
  else if(action==='speak')speak(el.dataset.text);
  else if(action==='palette'){state.palette=el.dataset.palette;save();render(false);}
  else if(action==='voices')discoverVoices();
  else if(action==='test-voice'){state.audio=true;save();speak('Dag, we gaan!');}
  else if(action==='start')startSession(Number(el.dataset.unit),el.dataset.part,Number(el.dataset.block||0));
  else if(action==='review')go('review');
  else if(action==='start-review')startSession(0,'review');
  else if(action==='choose'){
    if(session.checked)return;session.selected=Number(el.dataset.index);
    const choice=session.options[session.selected];speak(choice.text,choice.speak);render(false);
  }else if(action==='tile'||action==='remove-tile'){
    if(session.checked)return;const id=Number(el.dataset.id),tile=session.tiles.find(t=>t.id===id);
    speak(tile.text,tile.speak);
    if(action==='tile')session.selection.push(id);else session.selection=session.selection.filter(x=>x!==id);
    render(false);
  }else if(action==='check')checkAnswer();
  else if(action==='next')nextQuestion();
  else if(action==='streak')toast('Un giorno conta quando completi una sessione. Due giorni consecutivi fanno crescere la serie.');
  else if(action==='xp')toast('5 XP per risposta giusta al primo tentativo, più 20 XP quando superi una parte.');
  else if(action==='retry'){
    const old={...lastResult};
    if(old.part==='review'){
      const originals=session.queue.filter(q=>!q.retry&&q.type!=='card');
      session={id:`${Date.now()}-review`,unit:0,part:'review',block:0,queue:originals,index:0,total:originals.length,correct:0,firstAnswers:{},prepared:null};
      go('exercise',{unit:0},true);
    }else startSession(old.unit,old.part,old.block,true);
  }else if(action==='result-next'){startSession(Number(el.dataset.unit),el.dataset.part,Number(el.dataset.block),true);}
  else if(action==='next-unit'){fromHome(()=>go('unit',{unit:Number(el.dataset.unit)}));}
  else if(action==='result-home'||action==='finish-review'){fromHome(()=>render(true));}
  else if(action==='install'&&installEvent){installEvent.prompt();installEvent=null;}
});
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installEvent=event;if(route.page==='settings')render(false);});
window.addEventListener('online',()=>toast('Connessione disponibile.'));
window.addEventListener('offline',()=>toast('Sei offline. Continua con il corso salvato.'));
if(synth){
  synth.addEventListener?.('voiceschanged',discoverVoices);
  for(const delay of [100,600,1800,3500])setTimeout(discoverVoices,delay);
}else voiceReady=true;
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{toast('La copia offline non è pronta. Riapri Patatino online.');});
}
render(true);

  </script>
</body>
</html>
