:"doos","speak":true},{"text":"is","speak":true},{"text":"klein","speak":true},{"text":"rodee","speak":false,"distractor":true}],"note":"Aggettivo predicativo senza e; attributivo con e, tranne het singolare indefinito."},{"id":"14-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Il bar è caldo.","answer":"Het café is warm.","answers":["Het café is warm.","Warm is het café."],"tiles":[{"text":"Het","speak":true},{"text":"café","speak":true},{"text":"is","speak":true},{"text":"warm","speak":true},{"text":"koud","speak":true,"distractor":true}],"note":"Aggettivo predicativo senza e; attributivo con e, tranne het singolare indefinito."}]},{"id":15,"title":"Groter, het grootst","it":"Comparativo e superlativo","group":2,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Per confrontare due cose, in italiano dici spesso «più grande». Il neerlandese forma di solito una sola parola: \u003ci>groter\u003c/i>. Per indicare il massimo grado usa il superlativo: \u003ci>het grootst\u003c/i>, «il più grande» in funzione predicativa. Non aggiungere automaticamente una parola equivalente a «più» davanti a ogni aggettivo: il suffisso svolge già quel lavoro.\u003c/p>\n\u003ch3>1 · Forma il comparativo\u003c/h3>\u003cp>Aggiungi normalmente \u003ci>-er\u003c/i> alla base. La grafia segue le regole già viste: \u003ci>groot\u003c/i> diventa \u003ci>groter\u003c/i>, \u003ci>dik\u003c/i> diventa \u003ci>dikker\u003c/i>. Se la base termina in \u003ci>r\u003c/i>, spesso compare \u003ci>-der\u003c/i>, come in \u003ci>duurder\u003c/i>. Per introdurre il secondo termine del confronto usa \u003ci>dan\u003c/i>: \u003ci>de fiets is goedkoper dan de auto\u003c/i>, «la bici è più economica dell'auto».\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Base\u003c/th>\u003cth>Comparativo\u003c/th>\u003cth>Superlativo\u003c/th>\u003c/tr>\u003ctr>\u003ctd>klein\u003c/td>\u003ctd>kleiner\u003c/td>\u003ctd>het kleinst\u003c/td>\u003c/tr>\u003ctr>\u003ctd>groot\u003c/td>\u003ctd>groter\u003c/td>\u003ctd>het grootst\u003c/td>\u003c/tr>\u003ctr>\u003ctd>duur\u003c/td>\u003ctd>duurder\u003c/td>\u003ctd>het duurst\u003c/td>\u003c/tr>\u003ctr>\u003ctd>goed\u003c/td>\u003ctd>beter\u003c/td>\u003ctd>het best\u003c/td>\u003c/tr>\u003ctr>\u003ctd>veel\u003c/td>\u003ctd>meer\u003c/td>\u003ctd>het meest\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Forma il superlativo\u003c/h3>\u003cp>La terminazione più comune è \u003ci>-st\u003c/i>. Dopo il verbo, usa di solito \u003ci>het\u003c/i> davanti al superlativo: \u003ci>dit boek is het goedkoopst\u003c/i>. Prima del nome il superlativo prende normalmente \u003ci>-e\u003c/i>: \u003ci>het goedkoopste boek\u003c/i>. Non confondere l'articolo del nome con il \u003ci>het\u003c/i> della costruzione predicativa: anche un nome con \u003ci>de\u003c/i> può comparire in \u003ci>de fiets is het goedkoopst\u003c/i>. Nel parlato e nello scritto informale è comune anche \u003ci>het goedkoopste\u003c/i> dopo il verbo. Se sottintendi il nome, conserva invece il suo articolo e la forma in \u003ci>-e\u003c/i>: \u003ci>de fiets is de goedkoopste\u003c/i>, «la bici è la più economica». Gli esercizi accettano queste varianti quando compatibili con la frase.\u003c/p>\n\u003ch3>3 · Impara eccezioni e uguaglianza\u003c/h3>\u003cp>\u003ci>Goed\u003c/i>, «buono», diventa \u003ci>beter\u003c/i> e \u003ci>best\u003c/i>; \u003ci>veel\u003c/i>, «molto», diventa \u003ci>meer\u003c/i> e \u003ci>meest\u003c/i>; \u003ci>weinig\u003c/i>, «poco», diventa \u003ci>minder\u003c/i> e \u003ci>minst\u003c/i>. Per un confronto di uguaglianza usa \u003ci>even … als\u003c/i>: \u003ci>even groot als\u003c/i>, «grande quanto». La parola dopo il confronto cambia dunque con il tipo di rapporto: \u003ci>dan\u003c/i> per differenza, \u003ci>als\u003c/i> per uguaglianza.\u003c/p>\n\u003cp>Alcuni aggettivi lunghi o particolari preferiscono costruzioni con \u003ci>meer\u003c/i> e \u003ci>meest\u003c/i>. Qui alleniamo le forme frequenti in tabella. Il secondo termine può essere espresso, come in «più veloce della bici», oppure restare implicito: \u003ci>dit boek is beter\u003c/i>, «questo libro è migliore», presuppone un confronto già noto.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Meer groot\u003c/s> → \u003cstrong>groter\u003c/strong>. \u003cs>Groter als\u003c/s> → \u003cstrong>groter dan\u003c/strong> nel confronto standard. \u003cs>Goeder\u003c/s> → \u003cstrong>beter\u003c/strong>: questa forma è irregolare.\u003c/p>","keywords":[{"nl":"dan","it":"di, nel confronto"},{"nl":"als","it":"come, nel confronto uguale"},{"nl":"even","it":"ugualmente"},{"nl":"meer","it":"più quantità"},{"nl":"meest","it":"massimo di quantità"},{"nl":"minder","it":"meno"},{"nl":"minst","it":"minimo di quantità"}],"words":[{"nl":"goed","it":"buono"},{"nl":"snel","it":"veloce"},{"nl":"traag","it":"lento"},{"nl":"lang","it":"lungo"},{"nl":"kort","it":"corto"},{"nl":"licht","it":"leggero"},{"nl":"dik","it":"spesso, di grosso spessore"},{"nl":"dun","it":"sottile"}],"vlaanderen":{"text":"Lo standard distingue le forme riconosciute dagli usi regionali informali. Qui esercitiamo groter dan, la costruzione standard per esprimere una differenza.","source":{"label":"Taaladvies · lo standard in Belgio","url":"https://taaladvies.net/wat-is-standaardtaal-algemeen/"}},"source":"standard","practiceNote":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best.","grammar":[{"id":"15-g1","type":"fill","prompt":"Completa la frase.","sentence":"groot → ___","answer":"groter","answers":["groter"],"it":"Grande → più grande.","hint":"Comparativo, attenzione alla vocale.","note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best."},{"id":"15-g2","type":"mc","prompt":"Completa la frase.","sentence":"goed → ___","answer":"beter","answers":["beter"],"it":"Buono → migliore.","hint":"Comparativo irregolare.","note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best.","options":[{"text":"beter","it":"Nella frase: Buono → migliore.","speak":true},{"text":"goeder","it":"Non è la forma standard.","speak":false},{"text":"best","it":"Superlativo.","speak":true}],"correct":0},{"id":"15-g3","type":"fill","prompt":"Completa la frase.","sentence":"duur → ___","answer":"duurder","answers":["duurder"],"it":"Caro → più caro.","hint":"Dopo r compare d.","note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best."},{"id":"15-g4","type":"mc","prompt":"Completa la frase.","sentence":"De fiets is goedkoper ___ de auto.","answer":"dan","answers":["dan"],"it":"La bici è più economica dell’auto.","hint":"Confronto di differenza: scegli la forma dello standard curato.","note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best.","options":[{"text":"dan","it":"Nella frase: La bici è più economica dell’auto.","speak":true},{"text":"als","it":"Dopo un comparativo si incontra nel parlato, ma non è la forma qui richiesta.","speak":true},{"text":"met","it":"Con.","speak":true}],"correct":0},{"id":"15-g5","type":"fill","prompt":"Completa la frase.","sentence":"Het huis is even groot ___ de school.","answer":"als","answers":["als"],"it":"La casa è grande quanto la scuola.","hint":"Confronto di uguaglianza.","note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best."},{"id":"15-g6","type":"mc","prompt":"Completa la frase.","sentence":"klein → het ___","answer":"kleinst","answers":["kleinst"],"it":"Piccolo → il più piccolo.","hint":"Superlativo dopo het.","note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best.","options":[{"text":"kleinst","it":"Nella frase: Piccolo → il più piccolo.","speak":true},{"text":"kleiner","it":"Comparativo.","speak":true},{"text":"klein","it":"Base.","speak":true}],"correct":0},{"id":"15-g7","type":"fill","prompt":"Completa la frase.","sentence":"goed → het ___","answer":"best","answers":["best","beste"],"it":"Buono → il migliore.","hint":"Superlativo irregolare.","note":"Het best e het beste sono entrambi possibili; l’uso dipende dalla costruzione e dal registro."},{"id":"15-g8","type":"mc","prompt":"Completa la frase.","sentence":"veel → ___","answer":"meer","answers":["meer"],"it":"Molto → più.","hint":"Comparativo di quantità.","note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best.","options":[{"text":"meer","it":"Nella frase: Molto → più.","speak":true},{"text":"meest","it":"Superlativo.","speak":true},{"text":"veeler","it":"Forma errata.","speak":false}],"correct":0},{"id":"15-g9","type":"fill","prompt":"Completa la frase.","sentence":"weinig → ___","answer":"minder","answers":["minder"],"it":"Poco → meno.","hint":"Comparativo irregolare.","note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best."},{"id":"15-g10","type":"mc","prompt":"Completa la frase.","sentence":"Het ___ huis","answer":"grootste","answers":["grootste"],"it":"La casa più grande.","hint":"Superlativo prima del nome.","note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best.","options":[{"text":"grootste","it":"Nella frase: La casa più grande.","speak":true},{"text":"groter","it":"Comparativo senza flessione.","speak":true},{"text":"grootst","it":"Forma senza e.","speak":true}],"correct":0}],"mixed":[{"id":"15-m1","type":"order","prompt":"Ricomponi la frase.","it":"Il treno è più veloce della bici.","answer":"De trein is sneller dan de fiets.","answers":["De trein is sneller dan de fiets.","Sneller dan de fiets is de trein.","Sneller is de trein dan de fiets."],"tiles":[{"text":"De","speak":true},{"text":"trein","speak":true},{"text":"is","speak":true},{"text":"sneller","speak":true},{"text":"dan","speak":true},{"text":"de","speak":true},{"text":"fiets","speak":true},{"text":"snellerr","speak":false,"distractor":true}],"note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best."},{"id":"15-m2","type":"tr","prompt":"Traduci con le tessere.","it":"Questo libro è migliore.","answer":"Dit boek is beter.","answers":["Dit boek is beter.","Beter is dit boek."],"tiles":[{"text":"Dit","speak":true},{"text":"boek","speak":true},{"text":"is","speak":true},{"text":"beter","speak":true},{"text":"traag","speak":true,"distractor":true}],"note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best."},{"id":"15-m3","type":"order","prompt":"Ricomponi la frase.","it":"Questa giacca è la più leggera.","answer":"Deze jas is het lichtst.","answers":["Deze jas is het lichtst.","Het lichtst is deze jas.","Deze jas is het lichtste.","Het lichtste is deze jas.","Deze jas is de lichtste.","De lichtste is deze jas."],"tiles":[{"text":"Deze","speak":true},{"text":"jas","speak":true},{"text":"is","speak":true},{"text":"het","speak":true},{"text":"lichtst","speak":true},{"text":"lichtste","speak":true},{"text":"de","speak":true},{"text":"lichtsst","speak":false,"distractor":true}],"note":"Het lichtst è la forma predicativa; het lichtste è comune nel parlato. De lichtste sottintende de jas."},{"id":"15-m4","type":"tr","prompt":"Traduci con le tessere.","it":"La lettera è più corta del documento.","answer":"De brief is korter dan het document.","answers":["De brief is korter dan het document.","Korter dan het document is de brief.","Korter is de brief dan het document."],"tiles":[{"text":"De","speak":true},{"text":"brief","speak":true},{"text":"is","speak":true},{"text":"korter","speak":true},{"text":"dan","speak":true},{"text":"het","speak":true},{"text":"document","speak":true},{"text":"lang","speak":true,"distractor":true}],"note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best."},{"id":"15-m5","type":"order","prompt":"Ricomponi la frase.","it":"La casa è più grande dell’ufficio.","answer":"Het huis is groter dan het kantoor.","answers":["Het huis is groter dan het kantoor.","Groter dan het kantoor is het huis.","Groter is het huis dan het kantoor."],"tiles":[{"text":"Het","speak":true},{"text":"huis","speak":true},{"text":"is","speak":true},{"text":"groter","speak":true},{"text":"dan","speak":true},{"text":"het","speak":true},{"text":"kantoor","speak":true},{"text":"grooter","speak":false,"distractor":true}],"note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best."},{"id":"15-m6","type":"tr","prompt":"Traduci con le tessere.","it":"Questo libro è il più spesso.","answer":"Dit boek is het dikst.","answers":["Dit boek is het dikst.","Het dikst is dit boek.","Dit boek is het dikste.","Het dikste is dit boek."],"tiles":[{"text":"Dit","speak":true},{"text":"boek","speak":true},{"text":"is","speak":true},{"text":"het","speak":true},{"text":"dikst","speak":true},{"text":"dikste","speak":true},{"text":"dun","speak":true,"distractor":true}],"note":"Dik significa spesso nello spessore, non spesso nel senso di frequentemente. Sono validi het dikst e het dikste."},{"id":"15-m7","type":"order","prompt":"Ricomponi la frase.","it":"La bici costa quanto il computer.","answer":"De fiets is even duur als de computer.","answers":["De fiets is even duur als de computer.","Even duur als de computer is de fiets.","Even duur is de fiets als de computer.","De computer is even duur als de fiets.","Even duur als de fiets is de computer.","Even duur is de computer als de fiets."],"tiles":[{"text":"De","speak":true},{"text":"fiets","speak":true},{"text":"is","speak":true},{"text":"even","speak":true},{"text":"duur","speak":true},{"text":"als","speak":true},{"text":"de","speak":true},{"text":"computer","speak":true},{"text":"evven","speak":false,"distractor":true}],"note":"Il confronto di uguaglianza conserva il significato anche scambiando i due termini."},{"id":"15-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Questo treno è più lento.","answer":"Deze trein is trager.","answers":["Deze trein is trager.","Trager is deze trein."],"tiles":[{"text":"Deze","speak":true},{"text":"trein","speak":true},{"text":"is","speak":true},{"text":"trager","speak":true},{"text":"snel","speak":true,"distractor":true}],"note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best."},{"id":"15-m9","type":"order","prompt":"Ricomponi la frase.","it":"Questa è la strada più lunga.","answer":"Dit is de langste straat.","answers":["Dit is de langste straat.","De langste straat is dit.","Deze is de langste straat.","De langste straat is deze."],"tiles":[{"text":"Dit","speak":true},{"text":"is","speak":true},{"text":"de","speak":true},{"text":"langste","speak":true},{"text":"straat","speak":true},{"text":"Deze","speak":true},{"text":"langsst","speak":false,"distractor":true}],"note":"Dit presenta; deze può riprendere de straat quando la strada è già identificabile."},{"id":"15-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Ho meno denaro.","answer":"Ik heb minder geld.","answers":["Ik heb minder geld.","Minder geld heb ik."],"tiles":[{"text":"Ik","speak":true},{"text":"heb","speak":true},{"text":"minder","speak":true},{"text":"geld","speak":true},{"text":"goed","speak":true,"distractor":true}],"note":"Comparativo in er + dan; superlativo predicativo con het. Goed ha beter/best."}]},{"id":16,"title":"Vaak, soms, nooit","it":"Gli avverbi","group":3,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Un avverbio precisa come, quando, dove o con quale frequenza succede qualcosa. In italiano spesso riconosci il finale «-mente»; in neerlandese molti avverbi hanno la stessa forma dell'aggettivo. \u003ci>Snel\u003c/i> può descrivere un treno veloce oppure il modo in cui qualcuno cammina; anche \u003ci>vlug\u003c/i> e \u003ci>rap\u003c/i> possono significare «velocemente». La funzione dipende dal collegamento nella frase, non da una terminazione obbligatoria.\u003c/p>\n\u003ch3>1 · Separa qualità e modo\u003c/h3>\u003cp>\u003ci>Een snelle trein\u003c/i> contiene un aggettivo prima del nome e quindi la flessione in \u003ci>-e\u003c/i>. In \u003ci>de trein rijdt snel\u003c/i>, «il treno va veloce», \u003ci>snel\u003c/i> precisa l'azione e non prende quella terminazione. Non aggiungere una \u003ci>-e\u003c/i> solo perché il soggetto è plurale. La forma avverbiale rimane stabile anche quando cambia il numero delle persone.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Funzione\u003c/th>\u003cth>Parole\u003c/th>\u003cth>Significato\u003c/th>\u003c/tr>\u003ctr>\u003ctd>frequenza\u003c/td>\u003ctd>altijd, vaak, soms, nooit\u003c/td>\u003ctd>sempre, spesso, talvolta, mai\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tempo\u003c/td>\u003ctd>nu, later\u003c/td>\u003ctd>adesso, più tardi\u003c/td>\u003c/tr>\u003ctr>\u003ctd>modo\u003c/td>\u003ctd>snel, rustig\u003c/td>\u003ctd>velocemente, tranquillamente\u003c/td>\u003c/tr>\u003ctr>\u003ctd>grado\u003c/td>\u003ctd>heel, erg\u003c/td>\u003ctd>molto\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Trova una posizione naturale\u003c/h3>\u003cp>Nelle frasi semplici un avverbio di frequenza sta spesso dopo il verbo coniugato: \u003ci>ik wandel vaak\u003c/i>. Con un modale può stare fra modale e infinito: \u003ci>ik wil nu vertrekken\u003c/i>. Se lo porti all'inizio, applica V2: \u003ci>soms wandel ik\u003c/i>. Questa possibilità non significa che tutte le parole possano essere spostate liberamente; conserva i gruppi e controlla ciò che vuoi mettere in evidenza. Riprendi anche le forme del presente: \u003ci>slapen → zij slaapt\u003c/i>, \u003ci>rijden → hij rijdt\u003c/i>, \u003ci>praten → wij praten\u003c/i>, \u003ci>luisteren → ik luister\u003c/i>, \u003ci>vertrekken → wij vertrekken\u003c/i>.\u003c/p>\n\u003ch3>3 · Distingui intensità e quantità\u003c/h3>\u003cp>\u003ci>Heel\u003c/i> può intensificare un aggettivo: \u003ci>heel rustig\u003c/i>, «molto tranquillo». Per una quantità, invece, userai spesso \u003ci>veel\u003c/i>: \u003ci>veel koffie\u003c/i>. Non tradurre ogni «molto» con la stessa parola. Alcuni avverbi, come \u003ci>nooit\u003c/i>, esprimono già una negazione. Nello standard non aggiungere automaticamente \u003ci>niet\u003c/i> solo perché l'italiano dice «non vengo mai».\u003c/p>\n\u003cp>Quando sono possibili due ordini naturali, il corso li accetta. Per capire una frase ascoltata, cerca prima il verbo coniugato e poi chiediti quale parola indica tempo, modo o frequenza. Non confondere \u003ci>soms\u003c/i>, che esprime occasionalità, con \u003ci>vaak\u003c/i>, che indica un'abitudine frequente: entrambi lasciano possibili eccezioni, mentre \u003ci>altijd\u003c/i> è più assoluto. \u003ci>Dikwijls\u003c/i> è un sinonimo di \u003ci>vaak\u003c/i>; il più formale \u003ci>nimmer\u003c/i> significa \u003ci>nooit\u003c/i>.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Hij loopt snelle.\u003c/s> → \u003cstrong>Hij loopt snel.\u003c/strong> L'avverbio non prende la flessione attributiva. \u003cs>Soms ik werk.\u003c/s> → \u003cstrong>Soms werk ik.\u003c/strong> \u003cs>Ik kom niet nooit.\u003c/s> → \u003cstrong>Ik kom nooit.\u003c/strong> Per «non vengo mai» basta la parola negativa.\u003c/p>","keywords":[{"nl":"altijd","it":"sempre"},{"nl":"vaak","it":"spesso"},{"nl":"soms","it":"talvolta"},{"nl":"nooit","it":"mai"},{"nl":"nu","it":"adesso"},{"nl":"later","it":"più tardi"},{"nl":"heel","it":"molto, intensità"},{"nl":"erg","it":"molto, intensità"}],"words":[{"nl":"wandelen","it":"passeggiare"},{"nl":"rijden","it":"guidare, viaggiare su un mezzo"},{"nl":"vertrekken","it":"partire"},{"nl":"slapen","it":"dormire"},{"nl":"praten","it":"parlare"},{"nl":"luisteren","it":"ascoltare"},{"nl":"gemakkelijk","it":"facile"},{"nl":"moeilijk","it":"difficile"}],"vlaanderen":{"text":"Vannamiddag è standard in Belgio e indica questo pomeriggio, all’incirca fra le 14 e le 18. È particolarmente usato nella conversazione informale.","source":{"label":"Team Taaladvies · vanmiddag","url":"https://www.vlaanderen.be/team-taaladvies/taaladviezen/deze-middag-vanmiddag-vannamiddag"}},"source":"afternoon","practiceNote":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione.","grammar":[{"id":"16-g1","type":"fill","prompt":"Completa la frase.","sentence":"Hij loopt ___.","answer":"snel","answers":["snel","vlug","rap"],"it":"Lui cammina velocemente.","hint":"Forma avverbiale di veloce.","note":"Snel è invariabile come avverbio; anche vlug e rap significano velocemente."},{"id":"16-g2","type":"mc","prompt":"Completa la frase.","sentence":"___ werk ik.","answer":"Soms","answers":["Soms"],"it":"Talvolta lavoro.","hint":"Frequenza occasionale.","note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione.","options":[{"text":"Soms","it":"Nella frase: Talvolta lavoro.","speak":true},{"text":"Altijd","it":"Sempre.","speak":true},{"text":"Nooit","it":"Mai.","speak":true}],"correct":0},{"id":"16-g3","type":"fill","prompt":"Completa la frase.","sentence":"Ik kom ___.","answer":"nooit","answers":["nooit","nimmer"],"it":"Non vengo mai.","hint":"Una parola negativa.","note":"Nooit significa mai; nimmer è un sinonimo più formale."},{"id":"16-g4","type":"mc","prompt":"Completa la frase.","sentence":"Het huis is ___ groot.","answer":"heel","answers":["heel"],"it":"La casa è molto grande.","hint":"Intensifica un aggettivo.","note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione.","options":[{"text":"heel","it":"Nella frase: La casa è molto grande.","speak":true},{"text":"veel","it":"Quantità, non intensifica groot qui.","speak":true},{"text":"nooit","it":"Mai, altro significato.","speak":true}],"correct":0},{"id":"16-g5","type":"fill","prompt":"Completa la frase.","sentence":"Ik drink ___ koffie.","answer":"veel","answers":["veel"],"it":"Bevo molto caffè.","hint":"Indica una quantità.","note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione."},{"id":"16-g6","type":"mc","prompt":"Completa la frase.","sentence":"Nu ___ ik werken.","answer":"wil","answers":["wil"],"it":"Adesso voglio lavorare.","hint":"Volere, prima persona.","note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione.","options":[{"text":"wil","it":"Nella frase: Adesso voglio lavorare.","speak":true},{"text":"willen","it":"Plurale.","speak":true},{"text":"wilt","it":"Forma con jij/u, non con ik.","speak":true}],"correct":0},{"id":"16-g7","type":"fill","prompt":"Completa la frase.","sentence":"Zij werkt ___.","answer":"vaak","answers":["vaak","dikwijls"],"it":"Lei lavora spesso.","hint":"Frequenza alta ma non assoluta.","note":"Vaak e dikwijls significano spesso."},{"id":"16-g8","type":"mc","prompt":"Completa la frase.","sentence":"Wij komen ___.","answer":"later","answers":["later"],"it":"Veniamo più tardi.","hint":"Tempo successivo.","note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione.","options":[{"text":"later","it":"Nella frase: Veniamo più tardi.","speak":true},{"text":"nu","it":"Adesso.","speak":true},{"text":"nooit","it":"Mai.","speak":true}],"correct":0},{"id":"16-g9","type":"fill","prompt":"Completa la frase.","sentence":"Soms ___ wij koffie.","answer":"drinken","answers":["drinken"],"it":"Talvolta beviamo caffè.","hint":"Bere, plurale dopo inversione.","note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione."},{"id":"16-g10","type":"mc","prompt":"Completa la frase.","sentence":"Hij werkt ___.","answer":"rustig","answers":["rustig"],"it":"Lui lavora tranquillamente.","hint":"Modo, senza flessione.","note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione.","options":[{"text":"rustig","it":"Nella frase: Lui lavora tranquillamente.","speak":true},{"text":"rustige","it":"Forma attributiva.","speak":true},{"text":"rustiger","it":"Più tranquillamente: comparativo, altro significato.","speak":true}],"correct":0}],"mixed":[{"id":"16-m1","type":"order","prompt":"Ricomponi la frase.","it":"Passeggio spesso.","answer":"Ik wandel vaak.","answers":["Ik wandel vaak.","Vaak wandel ik."],"tiles":[{"text":"Ik","speak":true},{"text":"wandel","speak":true},{"text":"vaak","speak":true},{"text":"vaakk","speak":false,"distractor":true}],"note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione."},{"id":"16-m2","type":"tr","prompt":"Traduci con le tessere.","it":"Lei dorme adesso.","answer":"Zij slaapt nu.","answers":["Zij slaapt nu.","Nu slaapt zij.","Ze slaapt nu.","Nu slaapt ze."],"tiles":[{"text":"Zij","speak":true},{"text":"slaapt","speak":true},{"text":"nu","speak":true},{"text":"Ze","speak":true},{"text":"praten","speak":true,"distractor":true}],"note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione."},{"id":"16-m3","type":"order","prompt":"Ricomponi la frase.","it":"Partiamo più tardi.","answer":"Wij vertrekken later.","answers":["Wij vertrekken later.","Later vertrekken wij.","We vertrekken later.","Later vertrekken we."],"tiles":[{"text":"Wij","speak":true},{"text":"vertrekken","speak":true},{"text":"later","speak":true},{"text":"We","speak":true},{"text":"laterr","speak":false,"distractor":true}],"note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione."},{"id":"16-m4","type":"tr","prompt":"Traduci con le tessere.","it":"Lui guida velocemente.","answer":"Hij rijdt snel.","answers":["Hij rijdt snel.","Snel rijdt hij."],"tiles":[{"text":"Hij","speak":true},{"text":"rijdt","speak":true},{"text":"snel","speak":true},{"text":"slapen","speak":true,"distractor":true}],"note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione."},{"id":"16-m5","type":"order","prompt":"Ricomponi la frase.","it":"Talvolta parliamo.","answer":"Soms praten wij.","answers":["Soms praten wij.","Wij praten soms.","Soms praten we.","We praten soms."],"tiles":[{"text":"Soms","speak":true},{"text":"praten","speak":true},{"text":"wij","speak":true},{"text":"we","speak":true},{"text":"somss","speak":false,"distractor":true}],"note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione."},{"id":"16-m6","type":"tr","prompt":"Traduci con le tessere.","it":"Ascolto sempre.","answer":"Ik luister altijd.","answers":["Ik luister altijd.","Altijd luister ik."],"tiles":[{"text":"Ik","speak":true},{"text":"luister","speak":true},{"text":"altijd","speak":true},{"text":"vertrekken","speak":true,"distractor":true}],"note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione."},{"id":"16-m7","type":"order","prompt":"Ricomponi la frase.","it":"Questo è molto difficile.","answer":"Dit is heel moeilijk.","answers":["Dit is heel moeilijk.","Heel moeilijk is dit."],"tiles":[{"text":"Dit","speak":true},{"text":"is","speak":true},{"text":"heel","speak":true},{"text":"moeilijk","speak":true},{"text":"heell","speak":false,"distractor":true}],"note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione."},{"id":"16-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Non passeggiamo mai.","answer":"Wij wandelen nooit.","answers":["Wij wandelen nooit.","We wandelen nooit.","Nooit wandelen wij.","Nooit wandelen we."],"tiles":[{"text":"Wij","speak":true},{"text":"wandelen","speak":true},{"text":"nooit","speak":true},{"text":"We","speak":true},{"text":"rijden","speak":true,"distractor":true}],"note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione."},{"id":"16-m9","type":"order","prompt":"Ricomponi la frase.","it":"La lezione è molto facile.","answer":"De les is erg gemakkelijk.","answers":["De les is erg gemakkelijk.","Erg gemakkelijk is de les."],"tiles":[{"text":"De","speak":true},{"text":"les","speak":true},{"text":"is","speak":true},{"text":"erg","speak":true},{"text":"gemakkelijk","speak":true},{"text":"ergg","speak":false,"distractor":true}],"note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione."},{"id":"16-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Adesso voglio dormire.","answer":"Nu wil ik slapen.","answers":["Nu wil ik slapen.","Ik wil nu slapen.","Slapen wil ik nu."],"tiles":[{"text":"Nu","speak":true},{"text":"wil","speak":true},{"text":"ik","speak":true},{"text":"slapen","speak":true},{"text":"praten","speak":true,"distractor":true}],"note":"Negli esempi l’avverbio di modo non prende e. All’inizio della principale provoca inversione."}]},{"id":17,"title":"Ik sta op","it":"I verbi separabili","group":3,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Alcuni verbi neerlandesi sono costruiti con una particella che può staccarsi. \u003ci>Opstaan\u003c/i> significa «alzarsi», ma nella frase principale diventa \u003ci>ik sta op\u003c/i>. In italiano puoi cambiare verbo senza modificare la struttura; qui devi tenere presente che una parte dell'informazione arriva alla fine. La particella non è un dettaglio decorativo: può cambiare radicalmente il significato della base.\u003c/p>\n\u003ch3>1 · Separa quando il verbo è coniugato\u003c/h3>\u003cp>Nella principale semplice il verbo coniugato occupa la seconda posizione e la particella si colloca verso la fine: \u003ci>Nora belt mij op\u003c/i>, «Nora mi telefona». Il soggetto non deve per forza essere all'inizio: \u003ci>vandaag belt Nora mij op\u003c/i>. V2 riguarda la parte coniugata; la particella rimane nel posto finale della cornice verbale.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Infinito\u003c/th>\u003cth>Principale\u003c/th>\u003cth>Italiano\u003c/th>\u003c/tr>\u003ctr>\u003ctd>opstaan\u003c/td>\u003ctd>ik sta op\u003c/td>\u003ctd>mi alzo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>opbellen\u003c/td>\u003ctd>ik bel je op\u003c/td>\u003ctd>ti telefono\u003c/td>\u003c/tr>\u003ctr>\u003ctd>aankomen\u003c/td>\u003ctd>de trein komt aan\u003c/td>\u003ctd>il treno arriva\u003c/td>\u003c/tr>\u003ctr>\u003ctd>meenemen\u003c/td>\u003ctd>ik neem het mee / wij nemen het mee\u003c/td>\u003ctd>lo porto con me / lo portiamo con noi\u003c/td>\u003c/tr>\u003ctr>\u003ctd>aandoen\u003c/td>\u003ctd>zij doet haar jas aan\u003c/td>\u003ctd>lei si mette la sua giacca\u003c/td>\u003c/tr>\u003ctr>\u003ctd>opendoen\u003c/td>\u003ctd>ik doe de deur open\u003c/td>\u003ctd>apro la porta\u003c/td>\u003c/tr>\u003ctr>\u003ctd>dichtdoen\u003c/td>\u003ctd>hij doet het raam dicht\u003c/td>\u003ctd>lui chiude la finestra\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Riunisci con l'infinito\u003c/h3>\u003cp>Se un modale è il verbo coniugato, il separabile resta all'infinito e si scrive unito: \u003ci>ik wil opstaan\u003c/i>. Non separare meccanicamente ogni volta che vedi una particella. Prima trova quale verbo è coniugato. Nelle subordinate incontrerai un altro contesto in cui le due parti si riuniscono; per ora confronta soltanto principale semplice e costruzione con modale.\u003c/p>\n\u003ch3>3 · Impara il verbo completo\u003c/h3>\u003cp>\u003ci>Meenemen\u003c/i> contiene il verbo irregolare \u003ci>nemen\u003c/i>: al presente trovi \u003ci>ik neem\u003c/i> e \u003ci>wij nemen\u003c/i>. I composti di \u003ci>doen\u003c/i> usano \u003ci>ik doe\u003c/i>, \u003ci>hij/zij doet\u003c/i>, \u003ci>wij doen\u003c/i>. La separabilità non elimina le normali regole di coniugazione. Non tutti i prefissi sono separabili: \u003ci>be-\u003c/i>, \u003ci>ver-\u003c/i> e altri prefissi comuni non si trattano allo stesso modo. Per un verbo nuovo impara significato, forma con \u003ci>ik\u003c/i> e comportamento della particella, ascoltando dove cade l'accento.\u003c/p>\n\u003cp>Negli esercizi, una lacuna può chiedere soltanto la particella oppure la parte coniugata. Leggi il suggerimento prima di completarla. Le tessere, invece, ti fanno costruire l'intera cornice: puoi mettere il tempo all'inizio, ma la particella deve continuare a completare il verbo.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Ik opsta.\u003c/s> → \u003cstrong>Ik sta op.\u003c/strong> \u003cs>Ik wil sta op.\u003c/s> → \u003cstrong>Ik wil opstaan.\u003c/strong> \u003cs>Ik neem mee het boek.\u003c/s> → \u003cstrong>Ik neem het boek mee.\u003c/strong> L'oggetto entra nella cornice.\u003c/p>","keywords":[{"nl":"op","it":"particella di opstaan e opbellen"},{"nl":"aan","it":"particella di aankomen"},{"nl":"mee","it":"con sé, particella"},{"nl":"uit","it":"fuori, particella"}],"words":[{"nl":"opstaan","it":"alzarsi"},{"nl":"opbellen","it":"telefonare a"},{"nl":"aankomen","it":"arrivare"},{"nl":"meenemen","it":"portare con sé"},{"nl":"uitgaan","it":"uscire"},{"nl":"aandoen","it":"mettersi un indumento"},{"nl":"opendoen","it":"aprire"},{"nl":"dichtdoen","it":"chiudere"}],"vlaanderen":{"text":"Deze middag è standard in tutto il territorio neerlandofono ed è più frequente nel parlato belga. In Belgio può indicare questo pomeriggio oppure la fascia di oggi fra le 12 e le 14: un orario preciso evita ambiguità.","source":{"label":"Team Taaladvies · vanmiddag","url":"https://www.vlaanderen.be/team-taaladvies/taaladviezen/deze-middag-vanmiddag-vannamiddag"}},"source":"afternoon","practiceNote":"Principale: parte coniugata al secondo posto, particella in fondo. Dopo modale: infinito unito.","grammar":[{"id":"17-g1","type":"fill","prompt":"Completa la frase.","sentence":"Ik sta ___.","answer":"op","answers":["op"],"it":"Mi alzo.","hint":"Completa opstaan.","note":"Principale: parte coniugata al secondo posto, particella in fondo. Dopo modale: infinito unito."},{"id":"17-g2","type":"mc","prompt":"Completa la frase.","sentence":"Hij ___ mij op.","answer":"belt","answers":["belt"],"it":"Lui mi telefona.","hint":"Opbellen, terza persona.","note":"Principale: parte coniugata al secondo posto, particella in fondo. Dopo modale: infinito unito.","options":[{"text":"belt","it":"Nella frase: Lui mi telefona.","speak":true},{"text":"bel","it":"Forma con ik.","speak":true},{"text":"bellen","it":"Plurale.","speak":true}],"correct":0},{"id":"17-g3","type":"fill","prompt":"Completa la frase.","sentence":"De trein komt ___.","answer":"aan","answers":["aan"],"it":"Il treno arriva.","hint":"Completa aankomen.","note":"Principale: parte coniugata al secondo posto, particella in fondo. Dopo modale: infinito unito."},{"id":"17-g4","type":"mc","prompt":"Completa la frase.","sentence":"Ik neem het boek ___.","answer":"mee","answers":["mee"],"it":"Porto con me il libro.","hint":"Completa meenemen.","note":"Principale: parte coniugata al secondo posto, particella in fondo. Dopo modale: infinito unito.","options":[{"text":"mee","it":"Nella frase: Porto con me il libro.","speak":true},{"text":"op","it":"Registrare o raccogliere, altro verbo.","speak":true},{"text":"aan","it":"Accettare, altro verbo.","speak":true}],"correct":0},{"id":"17-g5","type":"fill","prompt":"Completa la frase.","sentence":"Wij willen ___.","answer":"opstaan","answers":["opstaan"],"it":"Vogliamo alzarci.","hint":"L’infinito resta unito.","note":"Principale: parte coniugata al secondo posto, particella in fondo. Dopo modale: infinito unito."},{"id":"17-g6","type":"mc","prompt":"Completa la frase.","sentence":"Hij doet de jas ___.","answer":"aan","answers":["aan"],"it":"Lui si mette la giacca.","hint":"Completa aandoen.","note":"Principale: parte coniugata al secondo posto, particella in fondo. Dopo modale: infinito unito.","options":[{"text":"aan","it":"Nella frase: Lui si mette la giacca.","speak":true},{"text":"uit","it":"Si toglie la giacca.","speak":true},{"text":"mee","it":"Qui non significa mettersi la giacca.","speak":true}],"correct":0},{"id":"17-g7","type":"fill","prompt":"Completa la frase.","sentence":"Ik doe de deur ___.","answer":"open","answers":["open"],"it":"Apro la porta.","hint":"Completa opendoen.","note":"Principale: parte coniugata al secondo posto, particella in fondo. Dopo modale: infinito unito."},{"id":"17-g8","type":"mc","prompt":"Comp "text":"haar","speak":true},{"text":"jas","speak":true},{"text":"aan","speak":true},{"text":"Ze","speak":true},{"text":"aankomen","speak":true,"distractor":true}],"note":"Principale: parte coniugata al secondo posto, particella in fondo. Dopo modale: infinito unito."},{"id":"17-m7","type":"order","prompt":"Ricomponi la frase.","it":"Apro la porta.","answer":"Ik doe de deur open.","answers":["Ik doe de deur open.","De deur doe ik open."],"tiles":[{"text":"Ik","speak":true},{"text":"doe","speak":true},{"text":"de","speak":true},{"text":"deur","speak":true},{"text":"open","speak":true},{"text":"openn","speak":false,"distractor":true}],"note":"Principale: parte coniugata al secondo posto, particella in fondo. Dopo modale: infinito unito."},{"id":"17-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Vogliamo uscire.","answer":"Wij willen uitgaan.","answers":["Wij willen uitgaan.","We willen uitgaan.","Uitgaan willen wij.","Uitgaan willen we."],"tiles":[{"text":"Wij","speak":true},{"text":"willen","speak":true},{"text":"uitgaan","speak":true},{"text":"We","speak":true},{"text":"dichtdoen","speak":true,"distractor":true}],"note":"Principale: parte coniugata al secondo posto, particella in fondo. Dopo modale: infinito unito."},{"id":"17-m9","type":"order","prompt":"Ricomponi la frase.","it":"Domani ti telefono.","answer":"Morgen bel ik jou op.","answers":["Morgen bel ik jou op.","Ik bel jou morgen op.","Ik bel morgen jou op.","Morgen bel ik je op.","Ik bel je morgen op.","Jou bel ik morgen op."],"tiles":[{"text":"Morgen","speak":true},{"text":"bel","speak":true},{"text":"ik","speak":true},{"text":"jou","speak":true},{"text":"op","speak":true},{"text":"je","speak":true},{"text":"belltt","speak":false,"distractor":true}],"note":"Principale: parte coniugata al secondo posto, particella in fondo. Dopo modale: infinito unito."},{"id":"17-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Lui chiude la finestra.","answer":"Hij doet het raam dicht.","answers":["Hij doet het raam dicht.","Het raam doet hij dicht."],"tiles":[{"text":"Hij","speak":true},{"text":"doet","speak":true},{"text":"het","speak":true},{"text":"raam","speak":true},{"text":"dicht","speak":true},{"text":"opendoen","speak":true,"distractor":true}],"note":"Principale: parte coniugata al secondo posto, particella in fondo. Dopo modale: infinito unito."}]},{"id":18,"title":"Kom binnen!","it":"L’imperativo","group":3,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>L'imperativo serve per un'istruzione, un invito, un consiglio o un ordine. In neerlandese la forma corrente è spesso uguale alla radice del verbo: \u003ci>wacht!\u003c/i>, «aspetta!» oppure «aspettate!». Non devi costruire forme diverse per ogni interlocutore come in italiano. Il contesto e il tono stabiliscono a chi parli e quanto diretto risulta il messaggio.\u003c/p>\n\u003ch3>1 · Metti il verbo all'inizio\u003c/h3>\u003cp>La normale frase imperativa non esprime il soggetto: \u003ci>lees de brief\u003c/i>, «leggi la lettera». È un'eccezione pratica alla regola del soggetto espresso nelle dichiarative. Non confonderla con una frase dichiarativa incompleta. Il verbo iniziale indica che stai chiedendo un'azione. Con più persone puoi mantenere la stessa forma: \u003ci>kom binnen\u003c/i> può invitare una persona o un gruppo.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Infinito\u003c/th>\u003cth>Imperativo\u003c/th>\u003cth>Significato\u003c/th>\u003c/tr>\u003ctr>\u003ctd>wachten\u003c/td>\u003ctd>wacht\u003c/td>\u003ctd>aspetta / aspettate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>lezen\u003c/td>\u003ctd>lees\u003c/td>\u003ctd>leggi / leggete\u003c/td>\u003c/tr>\u003ctr>\u003ctd>binnenkomen\u003c/td>\u003ctd>kom binnen\u003c/td>\u003ctd>entra / entrate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>zijn\u003c/td>\u003ctd>wees\u003c/td>\u003ctd>sii / siate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>geven\u003c/td>\u003ctd>geef\u003c/td>\u003ctd>dai / date\u003c/td>\u003c/tr>\u003ctr>\u003ctd>nemen\u003c/td>\u003ctd>neem\u003c/td>\u003ctd>prendi / prendete\u003c/td>\u003c/tr>\u003ctr>\u003ctd>herhalen\u003c/td>\u003ctd>herhaal\u003c/td>\u003ctd>ripeti / ripetete\u003c/td>\u003c/tr>\u003ctr>\u003ctd>proberen\u003c/td>\u003ctd>probeer\u003c/td>\u003ctd>prova / provate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>kijken\u003c/td>\u003ctd>kijk\u003c/td>\u003ctd>guarda / guardate\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Conserva separabilità e negazione\u003c/h3>\u003cp>Un verbo separabile mantiene la particella verso la fine: \u003ci>doe de deur dicht\u003c/i>, «chiudi la porta». Per vietare o sconsigliare, aggiungi \u003ci>niet\u003c/i> nella posizione adatta: \u003ci>wacht niet\u003c/i>. Se neghi un nome indefinito usa ancora \u003ci>geen\u003c/i>: \u003ci>drink geen koffie\u003c/i>. L'italiano usa spesso «non + infinito» al singolare, ma il neerlandese non passa all'infinito per questo motivo.\u003c/p>\n\u003ch3>3 · Modula la cortesia\u003c/h3>\u003cp>Una forma grammaticalmente corretta può risultare troppo diretta in una situazione formale. \u003ci>Alstublieft\u003c/i> e \u003ci>alsjeblieft\u003c/i> accompagnano richieste cortesi; una domanda con un modale può risultare ancora più morbida: \u003ci>kunt u wachten?\u003c/i>. Parole come \u003ci>even\u003c/i> attenuano spesso una richiesta, ma il tono e la relazione contano. Non considerare ogni imperativo scortese: nelle istruzioni brevi è normale e chiaro.\u003c/p>\n\u003cp>Il verbo \u003ci>zijn\u003c/i> usa \u003ci>wees\u003c/i>, da imparare a parte: \u003ci>wees rustig\u003c/i>, «stai tranquillo». \u003ci>Probeer het!\u003c/i> significa «provaci!». Negli esercizi usa l'imperativo personale corrente, senza soggetto espresso; le antiche forme plurali con \u003ci>-t\u003c/i> sopravvivono in espressioni fisse, ma non sono il modello qui richiesto. Nelle traduzioni con tessere il destinatario è indicato dal significato italiano, mentre la forma neerlandese normalmente non distingue il numero.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Niet wachten!\u003c/s> → \u003cstrong>Wacht niet!\u003c/strong> come imperativo personale diretto. L'infinito è invece possibile su cartelli e istruzioni impersonali. \u003cs>Ben rustig!\u003c/s> → \u003cstrong>Wees rustig!\u003c/strong> \u003cs>Doe dicht de deur!\u003c/s> → \u003cstrong>Doe de deur dicht!\u003c/strong>\u003c/p>","keywords":[{"nl":"alstublieft","it":"per favore, cortese"},{"nl":"alsjeblieft","it":"per favore, informale"},{"nl":"wees","it":"sii, siate"}],"words":[{"nl":"binnenkomen","it":"entrare"},{"nl":"nemen","it":"prendere"},{"nl":"geven","it":"dare"},{"nl":"kijken","it":"guardare"},{"nl":"proberen","it":"provare"},{"nl":"herhalen","it":"ripetere"},{"nl":"de zin","it":"la frase"},{"nl":"het antwoord","it":"la risposta"}],"vlaanderen":{"text":"U è la forma di cortesia dello standard anche in Belgio. Kunt u…? consente di trasformare un’istruzione in una richiesta rivolta cortesemente all’interlocutore.","source":{"label":"Team Taaladvies · gij/ge","url":"https://www.vlaanderen.be/team-taaladvies/taaladviezen/gij-ge-gebruik"}},"source":"gij","practiceNote":"Imperativo diretto: radice all’inizio, normalmente senza soggetto. Zijn diventa wees.","grammar":[{"id":"18-g1","type":"fill","prompt":"Completa la frase.","sentence":"___ hier!","answer":"Wacht","answers":["Wacht"],"it":"Aspetta qui!","hint":"Imperativo di aspettare.","note":"Imperativo diretto: radice all’inizio, normalmente senza soggetto. Zijn diventa wees."},{"id":"18-g2","type":"mc","prompt":"Completa la frase.","sentence":"___ de brief!","answer":"Lees","answers":["Lees"],"it":"Leggi la lettera!","hint":"Imperativo personale corrente, senza soggetto, di leggere.","note":"Imperativo diretto: radice all’inizio, normalmente senza soggetto. Zijn diventa wees.","options":[{"text":"Lees","it":"Nella frase: Leggi la lettera!","speak":true},{"text":"Lezen","it":"Infinito: non è la forma personale richiesta.","speak":true},{"text":"Leest","it":"Presente con hij/j aduci con le tessere.","it":"Guarda lo schermo!","answer":"Kijk naar het scherm!","answers":["Kijk naar het scherm!"],"tiles":[{"text":"Kijk","speak":true},{"text":"naar","speak":true},{"text":"het","speak":true},{"text":"scherm","speak":true},{"text":"geven","speak":true,"distractor":true}],"note":"Imperativo diretto: radice all’inizio, normalmente senza soggetto. Zijn diventa wees."},{"id":"18-m9","type":"order","prompt":"Ricomponi la frase.","it":"Non bere caffè!","answer":"Drink geen koffie!","answers":["Drink geen koffie!"],"tiles":[{"text":"Drink","speak":true},{"text":"geen","speak":true},{"text":"koffie","speak":true},{"text":"drinktt","speak":false,"distractor":true}],"note":"Imperativo diretto: radice all’inizio, normalmente senza soggetto. Zijn diventa wees."},{"id":"18-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Dalle la penna!","answer":"Geef haar de pen!","answers":["Geef haar de pen!","Geef ze de pen!"],"tiles":[{"text":"Geef","speak":true},{"text":"haar","speak":true},{"text":"de","speak":true},{"text":"pen","speak":true},{"text":"ze","speak":true},{"text":"herhalen","speak":true,"distractor":true}],"note":"Imperativo diretto: radice all’inizio, normalmente senza soggetto. Zijn diventa wees."}]},{"id":19,"title":"Ik heb gewerkt","it":"Il passato prossimo","group":3,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Il passato prossimo neerlandese collega un ausiliare al participio: \u003ci>ik heb gewerkt\u003c/i>, «ho lavorato». La somiglianza con l'italiano aiuta, ma non basta: ausiliare e participio possono essere separati da altre informazioni, e il participio non si accorda con il genere del soggetto. Per raccontare un fatto concluso nella conversazione quotidiana questa struttura è molto utile.\u003c/p>\n\u003ch3>1 · Costruisci la cornice\u003c/h3>\u003cp>L'ausiliare coniugato occupa la normale posizione del verbo; il participio si trova verso la fine. In \u003ci>ik heb gisteren gewerkt\u003c/i>, «ho lavorato ieri», l'avverbio entra fra i due. Se inizi con il tempo, inverti soltanto ausiliare e soggetto: \u003ci>gisteren heb ik gewerkt\u003c/i>. Il participio rimane stabile.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Infinito\u003c/th>\u003cth>Passato prossimo\u003c/th>\u003cth>Italiano\u003c/th>\u003c/tr>\u003ctr>\u003ctd>werken\u003c/td>\u003ctd>ik heb gewerkt\u003c/td>\u003ctd>ho lavorato\u003c/td>\u003c/tr>\u003ctr>\u003ctd>maken\u003c/td>\u003ctd>ik heb gemaakt\u003c/td>\u003ctd>ho fatto\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bellen\u003c/td>\u003ctd>ik heb gebeld\u003c/td>\u003ctd>ho telefonato\u003c/td>\u003c/tr>\u003ctr>\u003ctd>gaan\u003c/td>\u003ctd>ik ben gegaan\u003c/td>\u003ctd>sono andato\u003c/td>\u003c/tr>\u003ctr>\u003ctd>aankomen\u003c/td>\u003ctd>ik ben aangekomen\u003c/td>\u003ctd>sono arrivato\u003c/td>\u003c/tr>\u003ctr>\u003ctd>drinken\u003c/td>\u003ctd>ik heb gedronken\u003c/td>\u003ctd>ho bevuto\u003c/td>\u003c/tr>\u003ctr>\u003ctd>kopen\u003c/td>\u003ctd>ik heb gekocht\u003c/td>\u003ctd>ho comprato\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bezoeken\u003c/td>\u003ctd>ik heb bezocht\u003c/td>\u003ctd>ho visitato\u003c/td>\u003c/tr>\u003ctr>\u003ctd>blijven\u003c/td>\u003ctd>ik ben gebleven\u003c/td>\u003ctd>sono rimasto\u003c/td>\u003c/tr>\u003ctr>\u003ctd>reizen\u003c/td>\u003ctd>ik heb gereisd\u003c/td>\u003ctd>ho viaggiato\u003c/td>\u003c/tr>\u003ctr>\u003ctd>verhuizen\u003c/td>\u003ctd>ik ben verhuisd\u003c/td>\u003ctd>ho traslocato\u003c/td>\u003c/tr>\u003ctr>\u003ctd>zijn\u003c/td>\u003ctd>ik ben geweest\u003c/td>\u003ctd>sono stato\u003c/td>\u003c/tr>\u003ctr>\u003ctd>hebben\u003c/td>\u003ctd>ik heb gehad\u003c/td>\u003ctd>ho avuto\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Forma il participio\u003c/h3>\u003cp>Molti verbi regolari prendono \u003ci>ge-\u003c/i>, radice e \u003ci>-t\u003c/i> oppure \u003ci>-d\u003c/i>. La scelta finale dipende dal suono della consonante originaria della base: dopo consonanti sorde come quelle di \u003ci>'t kofschip\u003c/i> compare \u003ci>-t\u003c/i>; negli altri casi compare \u003ci>-d\u003c/i>. Usa l'infinito per riconoscere la consonante, perché la grafia della radice può nascondere una \u003ci>v\u003c/i> o una \u003ci>z\u003c/i>: \u003ci>reizen\u003c/i> dà \u003ci>gereisd\u003c/i>, \u003ci>verhuizen\u003c/i> dà \u003ci>verhuisd\u003c/i>. I verbi irregolari hanno participi da imparare: \u003ci>lezen → gelezen\u003c/i>, \u003ci>drinken → gedronken\u003c/i>, \u003ci>kopen → gekocht\u003c/i>, \u003ci>bezoeken → bezocht\u003c/i>, \u003ci>blijven → gebleven\u003c/i>.\u003c/p>\n\u003ch3>3 · Scegli l'ausiliare\u003c/h3>\u003cp>Molti verbi usano \u003ci>hebben\u003c/i>. \u003ci>Zijn\u003c/i> compare con diversi cambiamenti di stato e movimenti orientati a una destinazione, oltre a verbi specifici. Non applicare ciecamente l'ausiliare italiano: memorizza la combinazione. Con un separabile, \u003ci>ge\u003c/i> entra fra particella e verbo: \u003ci>opgebeld\u003c/i>. Con prefissi non separabili come \u003ci>be-\u003c/i> e \u003ci>ver-\u003c/i>, normalmente non compare un ulteriore \u003ci>ge-\u003c/i>.\u003c/p>\n\u003cp>Il participio non cambia fra uomo, donna e plurale: \u003ci>zij is gegaan\u003c/i> e \u003ci>zij zijn gegaan\u003c/i>. È l'ausiliare a rendere evidente il numero. Per iniziare, impara coppie complete e usale in racconti di una sola frase, prima di combinare più eventi.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Ik heb werk.\u003c/s> → \u003cstrong>Ik heb gewerkt.\u003c/strong> Per «ho lavorato» serve il participio. \u003cs>Zij is gegane.\u003c/s> → \u003cstrong>Zij is gegaan.\u003c/strong> Nessun accordo femminile. \u003cs>Ik heb geopbeld.\u003c/s> → \u003cstrong>Ik heb opgebeld.\u003c/strong>\u003c/p>","keywords":[{"nl":"gisteren","it":"ieri"},{"nl":"gewerkt","it":"lavorato"},{"nl":"gemaakt","it":"fatto"},{"nl":"gebeld","it":"telefonato"},{"nl":"gegaan","it":"andato"},{"nl":"gelezen","it":"letto"},{"nl":"geweest","it":"stato"},{"nl":"gehad"," :"heb","speak":true},{"text":"de","speak":true},{"text":"brief","speak":true},{"text":"gelezen","speak":true},{"text":"gelezent","speak":false,"distractor":true}],"note":"Ausiliare coniugato + participio in fondo. Ge entra dopo la particella separabile."},{"id":"19-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Lui ha viaggiato molto.","answer":"Hij heeft veel gereisd.","answers":["Hij heeft veel gereisd.","Veel heeft hij gereisd.","Gereisd heeft hij veel."],"tiles":[{"text":"Hij","speak":true},{"text":"heeft","speak":true},{"text":"veel","speak":true},{"text":"gereisd","speak":true},{"text":"bezoeken","speak":true,"distractor":true}],"note":"Ausiliare coniugato + participio in fondo. Ge entra dopo la particella separabile."},{"id":"19-m9","type":"order","prompt":"Ricomponi la frase.","it":"Il treno è arrivato.","answer":"De trein is aangekomen.","answers":["De trein is aangekomen.","Aangekomen is de trein."],"tiles":[{"text":"De","speak":true},{"text":"trein","speak":true},{"text":"is","speak":true},{"text":"aangekomen","speak":true},{"text":"geaan","speak":false,"distractor":true}],"note":"Ausiliare coniugato + participio in fondo. Ge entra dopo la particella separabile."},{"id":"19-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Ho trascorso un buon fine settimana.","answer":"Ik heb een goed weekend gehad.","answers":["Ik heb een goed weekend gehad.","Een goed weekend heb ik gehad."],"tiles":[{"text":"Ik","speak":true},{"text":"heb","speak":true},{"text":"een","speak":true},{"text":"goed","speak":true},{"text":"weekend","speak":true},{"text":"gehad","speak":true},{"text":"reis","speak":true,"distractor":true}],"note":"Ausiliare coniugato + participio in fondo. Ge entra dopo la particella separabile."}]},{"id":20,"title":"Vroeger was het anders","it":"Il passato semplice","group":3,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Il passato semplice neerlandese, chiamato \u003ci>onvoltooid verleden tijd\u003c/i>, descrive eventi passati, stati e sfondi narrativi. Non coincide perfettamente né con l'imperfetto né con il passato remoto italiano. \u003ci>Ik werkte\u003c/i> può significare «lavoravo» o «lavorai», secondo il contesto. Molto spesso, nel parlato, incontrerai soprattutto le forme passate di essere, avere e dei modali.\u003c/p>\n\u003ch3>1 · Riconosci i verbi regolari\u003c/h3>\u003cp>I verbi regolari prendono \u003ci>-te\u003c/i> oppure \u003ci>-de\u003c/i> al singolare e \u003ci>-ten\u003c/i> oppure \u003ci>-den\u003c/i> al plurale. La scelta segue lo stesso principio delle consonanti sorde già incontrato nei participi. \u003ci>Werken\u003c/i> dà \u003ci>werkte\u003c/i>; \u003ci>bellen\u003c/i> dà \u003ci>belde\u003c/i>. Tutte le persone singolari condividono la stessa forma: \u003ci>ik werkte\u003c/i>, \u003ci>jij werkte\u003c/i>, \u003ci>hij werkte\u003c/i>.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Infinito\u003c/th>\u003cth>Singolare\u003c/th>\u003cth>Plurale\u003c/th>\u003c/tr>\u003ctr>\u003ctd>werken\u003c/td>\u003ctd>werkte\u003c/td>\u003ctd>werkten\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bellen\u003c/td>\u003ctd>belde\u003c/td>\u003ctd>belden\u003c/td>\u003c/tr>\u003ctr>\u003ctd>zijn\u003c/td>\u003ctd>was\u003c/td>\u003ctd>waren\u003c/td>\u003c/tr>\u003ctr>\u003ctd>hebben\u003c/td>\u003ctd>had\u003c/td>\u003ctd>hadden\u003c/td>\u003c/tr>\u003ctr>\u003ctd>gaan\u003c/td>\u003ctd>ging\u003c/td>\u003ctd>gingen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>komen\u003c/td>\u003ctd>kwam\u003c/td>\u003ctd>kwamen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>lezen\u003c/td>\u003ctd>las\u003c/td>\u003ctd>lazen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>kunnen\u003c/td>\u003ctd>kon\u003c/td>\u003ctd>konden\u003c/td>\u003c/tr>\u003ctr>\u003ctd>moeten\u003c/td>\u003ctd>moest\u003c/td>\u003ctd>moesten\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Impara le forme forti frequenti\u003c/h3>\u003cp>Molti verbi cambiano vocale: \u003ci>komen\u003c/i> diventa \u003ci>kwam\u003c/i>, \u003ci>zien\u003c/i> diventa \u003ci>zag\u003c/i>, \u003ci>lezen\u003c/i> diventa \u003ci>las\u003c/i>. Non puoi ottenere queste forme aggiungendo una desinenza regolare. Impara almeno infinito, passato singolare e participio insieme. I modali più frequenti includono \u003ci>kon\u003c/i>, «potevo», \u003ci>moest\u003c/i>, «dovevo», e \u003ci>wilde\u003c/i>, «volevo»; il verbo dell'azione resta all'infinito.\u003c/p>\n\u003ch3>3 · Mantieni l'ordine della principale\u003c/h3>\u003cp>La forma del verbo cambia, ma V2 rimane: \u003ci>gisteren werkte ik\u003c/i>. Non aggiungere \u003ci>hebben\u003c/i> davanti al passato semplice: sarebbe una combinazione scorretta di due costruzioni. Per uno sfondo come «ero stanco», \u003ci>ik was moe\u003c/i> è naturale. Per riferire un fatto concluso potrai usare anche il passato prossimo, ma non esiste una divisione automatica basata soltanto su «ieri» o sulla distanza temporale. Restano valide anche le regole dell'aggettivo: \u003ci>een goede dag\u003c/i>, «una buona giornata», ma \u003ci>een goed jaar\u003c/i>, «un buon anno».\u003c/p>\n\u003cp>In tutti gli esercizi di questa unità usa il passato semplice neerlandese, anche quando l'italiano potrebbe suggerire più tempi. Nel racconto reale, invece, la scelta dipende dalla prospettiva: una sequenza narrativa tende a mantenere un tempo coerente, mentre una conversazione può alternare stati e fatti conclusi. Il titolo \u003ci>vroeger was het anders\u003c/i> significa «un tempo era diverso»: \u003ci>vroeger\u003c/i> indica un tempo passato e \u003ci>anders\u003c/i> significa «diverso».\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Ik heb werkte.\u003c/s> → \u003cstrong>Ik werkte.\u003c/strong> Oppure \u003cstrong>ik heb gewerkt\u003c/strong>, ma non mescolare le forme. \u003cs>Wij was moe.\u003c/s> → \u003cstrong>Wij waren moe.\u003c/strong> Il plurale resta importante.\u003c/p>","keywords":[{"nl":"was","it":"ero, eri, era"},{"nl":"waren","it":"eravamo, eravate, erano"},{"nl":"had","it":"avevo, avevi, aveva"},{"nl":"hadden","it":"avevamo, avevate, avevano"},{"nl":"ging","it":"andavo, andò"},{"nl":"kwam","it":"venivo, venne"},{"nl":"kon","it":"potevo, poteva"},{"nl":"moest","it":"dovevo, doveva"}],"words":[{"nl":"vroeg","it":"presto"},{"nl":"ziek","it":"malato"},{"nl":"gezond","it":"sano"},{"nl":"jong","it":"giovane"},{"nl":"het jaar","it":"l’anno"},{"nl":"de maand","it":"il mese"},{"nl":"de week","it":"la settimana"},{"nl":"de dag","it":"il giorno"}],"vlaanderen":{"text":"Voormiddag e namiddag hanno in Belgio riferimenti diversi da alcuni usi nei Paesi Bassi. Nel raccontare un evento passato, precisa l’ora se il periodo non è chiaro.","source":{"label":"Taaladvies · voormiddag/namiddag","url":"https://taaladvies.net/voormiddag-namiddag/"}},"source":"time","practiceNote":"Passato semplice senza ausiliare: werkte/werkten, was/waren. Nelle frasi con modale il verbo dell’azione resta all’infinito.","grammar":[{"id":"20-g1","type":"fill","prompt":"Completa la frase.","sentence":"Ik ___ moe.","answer":"was","answers":["was"],"it":"Ero stanco.","hint":"Passato semplice di essere.","note":"Passato semplice senza ausiliare: werkte/werkten, was/waren. Nelle frasi con modale il verbo dell’azione resta all’infinito."},{"id":"20-g2","type":"mc","prompt":"Completa la frase.","sentence":"Wij ___ klaar.","answer":"waren","answers":["waren"],"it":"Eravamo pronti.","hint":"Essere, passato plurale.","note":"Passato semplice senza ausiliare: werkte/werkten, was/waren. Nelle frasi con modale il verbo dell’azione resta all’infinito.","options":[{"text":"waren","it":"Nella frase: Eravamo pronti.","speak":true},{"text":"was","it":"Singolare.","speak":true},{"text":"zijn","it":"Presente.","speak":true}],"correct":0},{"id":"20-g3","type":"fill","prompt":"Completa la frase.","sentence":"Hij ___ een fiets.","answer":"had","answers":["had"],"it":"Lui aveva una bici.","hint":"Avere, passato singolare.","note":"Passato semplice senza ausiliare: werkte/werkten, was/waren. Nelle frasi c
