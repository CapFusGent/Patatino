je soggetto dopo il verbo cade la t di desinenza."},{"id":"7-g8","type":"mc","prompt":"Completa la frase.","sentence":"___ de markt open?","answer":"Is","answers":["Is"],"it":"Il mercato è aperto?","hint":"Essere con soggetto singolare.","note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza.","options":[{"text":"Is","it":"Nella frase: Il mercato è aperto?","speak":true},{"text":"Zijn","it":"Forma plurale.","speak":true},{"text":"Ben","it":"Forma con ik.","speak":true}],"correct":0},{"id":"7-g9","type":"fill","prompt":"Completa la frase.","sentence":"___ woont u?","answer":"Waar","answers":["Waar"],"it":"Dove abita Lei?","hint":"Chiedi un luogo con cortesia.","note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza."},{"id":"7-g10","type":"mc","prompt":"Completa la frase.","sentence":"___ jullie koffie?","answer":"Drinken","answers":["Drinken"],"it":"Bevete caffè?","hint":"Bere con voi.","note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza.","options":[{"text":"Drinken","it":"Nella frase: Bevete caffè?","speak":true},{"text":"Drink","it":"Forma singolare con ik.","speak":true},{"text":"Drinkt","it":"Singolare.","speak":true}],"correct":0}],"mixed":[{"id":"7-m1","type":"order","prompt":"Ricomponi la frase.","it":"Lavori?","answer":"Werk jij?","answers":["Werk jij?","Werk je?"],"tiles":[{"text":"Werk","speak":true},{"text":"jij","speak":true},{"text":"je","speak":true},{"text":"werktt","speak":false,"distractor":true}],"note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza."},{"id":"7-m2","type":"tr","prompt":"Traduci con le tessere.","it":"Il negozio è aperto?","answer":"Is de winkel open?","answers":["Is de winkel open?"],"tiles":[{"text":"Is","speak":true},{"text":"de","speak":true},{"text":"winkel","speak":true},{"text":"open","speak":true},{"text":"gesloten","speak":true,"distractor":true}],"note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza."},{"id":"7-m3","type":"order","prompt":"Ricomponi la frase.","it":"Dove abita lui?","answer":"Waar woont hij?","answers":["Waar woont hij?"],"tiles":[{"text":"Waar","speak":true},{"text":"woont","speak":true},{"text":"hij","speak":true},{"text":"waarrr","speak":false,"distractor":true}],"note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza."},{"id":"7-m4","type":"tr","prompt":"Traduci con le tessere.","it":"Che cosa bevi?","answer":"Wat drink je?","answers":["Wat drink je?","Wat drink jij?"],"tiles":[{"text":"Wat","speak":true},{"text":"drink","speak":true},{"text":"je","speak":true},{"text":"jij","speak":true},{"text":"komen","speak":true,"distractor":true}],"note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza."},{"id":"7-m5","type":"order","prompt":"Ricomponi la frase.","it":"Quando arriva il treno?","answer":"Wanneer komt de trein?","answers":["Wanneer komt de trein?"],"tiles":[{"text":"Wanneer","speak":true},{"text":"komt","speak":true},{"text":"de","speak":true},{"text":"trein","speak":true},{"text":"komtt","speak":false,"distractor":true}],"note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza."},{"id":"7-m6","type":"tr","prompt":"Traduci con le tessere.","it":"La stazione è chiusa?","answer":"Is het station gesloten?","answers":["Is het station gesloten?"],"tiles":[{"text":"Is","speak":true},{"text":"het","speak":true},{"text":"station","speak":true},{"text":"gesloten","speak":true},{"text":"open","speak":true,"distractor":true}],"note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza."},{"id":"7-m7","type":"order","prompt":"Ricomponi la frase.","it":"Chi la aiuta?","answer":"Wie helpt haar?","answers":["Wie helpt haar?","Wie helpt ze?"],"tiles":[{"text":"Wie","speak":true},{"text":"helpt","speak":true},{"text":"haar","speak":true},{"text":"ze","speak":true},{"text":"helptt","speak":false,"distractor":true}],"note":"Haar indica la donna aiutata; nello standard belga anche ze può essere oggetto femminile singolare. Qui wie è il soggetto."},{"id":"7-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Dov’è il mercato?","answer":"Waar is de markt?","answers":["Waar is de markt?"],"tiles":[{"text":"Waar","speak":true},{"text":"is","speak":true},{"text":"de","speak":true},{"text":"markt","speak":true},{"text":"trein","speak":true,"distractor":true}],"note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza."},{"id":"7-m9","type":"order","prompt":"Ricomponi la frase.","it":"Perché Lei lavora?","answer":"Waarom werkt u?","answers":["Waarom werkt u?"],"tiles":[{"text":"Waarom","speak":true},{"text":"werkt","speak":true},{"text":"u","speak":true},{"text":"werktt","speak":false,"distractor":true}],"note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza."},{"id":"7-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Voi andate?","answer":"Gaan jullie?","answers":["Gaan jullie?"],"tiles":[{"text":"Gaan","speak":true},{"text":"jullie","speak":true},{"text":"komen","speak":true,"distractor":true}],"note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza."}]},{"id":8,"title":"Mijn huis, jouw fiets","it":"I possessivi","group":1,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>«Il mio libro» contiene in italiano un articolo e un possessivo. In neerlandese normalmente basta il possessivo: \u003ci>mijn boek\u003c/i>. Non aggiungere \u003ci>het\u003c/i> davanti a \u003ci>mijn\u003c/i>. La parola scelta indica chi possiede qualcosa e, con una sola distinzione importante, non cambia secondo il genere o il numero della cosa posseduta. Questa differenza rende il sistema più semplice di quello italiano, purché tu parta dal possessore.\u003c/p>\n\u003ch3>1 · Guarda il possessore\u003c/h3>\u003cp>\u003ci>Mijn\u003c/i> significa «mio», \u003ci>jouw\u003c/i> significa «tuo», \u003ci>zijn\u003c/i> significa «suo» riferito a un possessore maschile, e \u003ci>haar\u003c/i> «suo» riferito a una donna. «Il suo libro» da solo è ambiguo in italiano; in neerlandese devi sapere di chi parli. La forma di cortesia è \u003ci>uw\u003c/i>. Non confonderla con \u003ci>u\u003c/i>, che indica la persona e non introduce il nome posseduto.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Possessore\u003c/th>\u003cth>Possessivo\u003c/th>\u003cth>Uso\u003c/th>\u003c/tr>\u003ctr>\u003ctd>io / tu\u003c/td>\u003ctd>mijn / jouw, je\u003c/td>\u003ctd>mijn fiets\u003c/td>\u003c/tr>\u003ctr>\u003ctd>lui / lei\u003c/td>\u003ctd>zijn / haar\u003c/td>\u003ctd>haar boek\u003c/td>\u003c/tr>\u003ctr>\u003ctd>noi\u003c/td>\u003ctd>ons / onze\u003c/td>\u003ctd>ons huis, onze fiets\u003c/td>\u003c/tr>\u003ctr>\u003ctd>voi / loro\u003c/td>\u003ctd>jullie / hun\u003c/td>\u003ctd>jullie kamer, hun boeken\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lei\u003c/td>\u003ctd>uw\u003c/td>\u003ctd>uw naam\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Scegli ons oppure onze\u003c/h3>\u003cp>Solo «nostro» cambia regolarmente in questo modo: davanti a un nome singolare con \u003ci>het\u003c/i> usa \u003ci>ons\u003c/i>; davanti a un nome con \u003ci>de\u003c/i>, oppure a qualsiasi plurale, usa \u003ci>onze\u003c/i>. Quindi \u003ci>ons huis\u003c/i>, ma \u003ci>onze huizen\u003c/i>. L'articolo non viene scritto, tuttavia devi conoscerlo per scegliere la forma. È uno dei motivi per cui conviene imparare articolo e nome insieme.\u003c/p>\n\u003ch3>3 · Riconosci il parlato naturale\u003c/h3>\u003cp>\u003ci>Je\u003c/i> è anche un possessivo non accentato: \u003ci>je naam\u003c/i> significa «il tuo nome». Il contesto distingue il soggetto \u003ci>je\u003c/i>, l'oggetto \u003ci>je\u003c/i> e il possessivo. Per rendere una contrapposizione, \u003ci>jouw\u003c/i> mette più enfasi. Non serve però la forma piena in ogni frase. Nella scrittura informale puoi incontrare \u003ci>m'n\u003c/i> per \u003ci>mijn\u003c/i>, \u003ci>z'n\u003c/i> per \u003ci>zijn\u003c/i> e \u003ci>d'r\u003c/i> o \u003ci>'r\u003c/i> per \u003ci>haar\u003c/i>. Dopo \u003ci>zijn\u003c/i> con significato di «essere», un possessore può essere espresso con \u003ci>van\u003c/i>, «di»: \u003ci>het boek is van mij\u003c/i>, «il libro è mio». È una struttura diversa da quella prima del nome.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Het mijn huis\u003c/s> → \u003cstrong>mijn huis\u003c/strong>. Togli l'articolo. \u003cs>Onze huis\u003c/s> → \u003cstrong>ons huis\u003c/strong>. \u003cs>Ons fietsen\u003c/s> → \u003cstrong>onze fietsen\u003c/strong>: al plurale serve \u003ci>onze\u003c/i>.\u003c/p>","keywords":[{"nl":"mijn","it":"mio"},{"nl":"jouw","it":"tuo"},{"nl":"zijn","it":"suo, di lui"},{"nl":"haar","it":"suo, di lei"},{"nl":"ons","it":"nostro, singolare het"},{"nl":"onze","it":"nostro, de o plurale"},{"nl":"uw","it":"Suo di cortesia"},{"nl":"hun","it":"loro possessivo"}],"words":[{"nl":"de naam","it":"il nome"},{"nl":"het adres","it":"l’indirizzo"},{"nl":"de sleutel","it":"la chiave"},{"nl":"de telefoon","it":"il telefono"},{"nl":"de jas","it":"la giacca"},{"nl":"het kantoor","it":"l’ufficio"},{"nl":"de baan","it":"il lavoro, impiego"},{"nl":"de familie","it":"la famiglia"}],"vlaanderen":{"text":"Je/jij sono le forme familiari dello standard; u è la forma di cortesia. Nella stessa distinzione, jouw/je e uw permettono di scegliere come rivolgersi all’interlocutore.","source":{"label":"Team Taaladvies · gij/ge","url":"https://www.vlaanderen.be/team-taaladvies/taaladviezen/gij-ge-gebruik"}},"source":"gij","practiceNote":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale.","grammar":[{"id":"8-g1","type":"fill","prompt":"Completa la frase.","sentence":"___ huis","answer":"mijn","answers":["mijn","m'n"],"it":"La mia casa.","hint":"Il possessore sono io.","note":"Mijn indica il possessore io; m’n è la grafia informale della forma non accentata."},{"id":"8-g2","type":"mc","prompt":"Completa la frase.","sentence":"___ fiets","answer":"jouw","answers":["jouw"],"it":"La tua bici.","hint":"Il possessore è il tu informale.","note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale.","options":[{"text":"jouw","it":"Nella frase: La tua bici.","speak":true},{"text":"jij","it":"Soggetto.","speak":true},{"text":"jou","it":"Oggetto.","speak":true}],"correct":0},{"id":"8-g3","type":"fill","prompt":"Completa la frase.","sentence":"___ huis","answer":"ons","answers":["ons"],"it":"La nostra casa.","hint":"Huis è singolare neutro.","note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale."},{"id":"8-g4","type":"mc","prompt":"Completa la frase.","sentence":"___ fiets","answer":"onze","answers":["onze"],"it":"La nostra bici.","hint":"Fiets usa de.","note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale.","options":[{"text":"onze","it":"Nella frase: La nostra bici.","speak":true},{"text":"ons","it":"Con het singolare.","speak":true},{"text":"wij","it":"Soggetto.","speak":true}],"correct":0},{"id":"8-g5","type":"fill","prompt":"Completa la frase.","sentence":"___ boeken","answer":"onze","answers":["onze"],"it":"I nostri libri.","hint":"Il nome è plurale.","note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale."},{"id":"8-g6","type":"mc","prompt":"Completa la frase.","sentence":"___ naam","answer":"uw","answers":["uw"],"it":"Il Suo nome.","hint":"Forma di cortesia.","note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale.","options":[{"text":"uw","it":"Nella frase: Il Suo nome.","speak":true},{"text":"u","it":"Persona, non possessivo.","speak":true},{"text":"jij","it":"Soggetto informale.","speak":true}],"correct":0},{"id":"8-g7","type":"fill","prompt":"Completa la frase.","sentence":"___ sleutel","answer":"haar","answers":["haar","d'r","'r"],"it":"La sua chiave, di lei.","hint":"La proprietaria è una donna.","note":"Haar indica una proprietaria; d’r e ’r sono grafie informali della forma non accentata."},{"id":"8-g8","type":"mc","prompt":"Completa la frase.","sentence":"___ telefoon","answer":"zijn","answers":["zijn"],"it":"Il suo telefono, di lui.","hint":"Il proprietario è un uomo.","note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale.","options":[{"text":"zijn","it":"Nella frase: Il suo telefono, di lui.","speak":true},{"text":"hij","it":"Soggetto.","speak":true},{"text":"hem","it":"Oggetto.","speak":true}],"correct":0},{"id":"8-g9","type":"fill","prompt":"Completa la frase.","sentence":"___ kantoor","answer":"hun","answers":["hun"],"it":"Il loro ufficio.","hint":"Più persone possiedono l’ufficio.","note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale."},{"id":"8-g10","type":"mc","prompt":"Completa la frase.","sentence":"___ adres","answer":"ons","answers":["ons"],"it":"Il nostro indirizzo.","hint":"Adres usa het ed è singolare.","note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale.","options":[{"text":"ons","it":"Nella frase: Il nostro indirizzo.","speak":true},{"text":"onze","it":"Con de o plurale.","speak":true},{"text":"wij","it":"Soggetto.","speak":true}],"correct":0}],"mixed":[{"id":"8-m1","type":"order","prompt":"Ricomponi la frase.","it":"Il mio nome è Nora.","answer":"Mijn naam is Nora.","answers":["Mijn naam is Nora.","Nora is mijn naam."],"tiles":[{"text":"Mijn","speak":true},{"text":"naam","speak":true},{"text":"is","speak":true},{"text":"Nora","speak":true},{"text":"mijnn","speak":false,"distractor":true}],"note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale."},{"id":"8-m2","type":"tr","prompt":"Traduci con le tessere.","it":"Ho la tua chiave.","answer":"Ik heb jouw sleutel.","answers":["Ik heb jouw sleutel.","Ik heb je sleutel.","Jouw sleutel heb ik.","Je sleutel heb ik."],"tiles":[{"text":"Ik","speak":true},{"text":"heb","speak":true},{"text":"jouw","speak":true},{"text":"sleutel","speak":true},{"text":"je","speak":true},{"text":"jas","speak":true,"distractor":true}],"note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale."},{"id":"8-m3","type":"order","prompt":"Ricomponi la frase.","it":"La nostra casa è pronta.","answer":"Ons huis is klaar.","answers":["Ons huis is klaar.","Klaar is ons huis."],"tiles":[{"text":"Ons","speak":true},{"text":"huis","speak":true},{"text":"is","speak":true},{"text":"klaar","speak":true},{"text":"onss","speak":false,"distractor":true}],"note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale."},{"id":"8-m4","type":"tr","prompt":"Traduci con le tessere.","it":"La nostra bici è economica.","answer":"Onze fiets is goedkoop.","answers":["Onze fiets is goedkoop.","Goedkoop is onze fiets."],"tiles":[{"text":"Onze","speak":true},{"text":"fiets","speak":true},{"text":"is","speak":true},{"text":"goedkoop","speak":true},{"text":"telefoon","speak":true,"distractor":true}],"note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale."},{"id":"8-m5","type":"order","prompt":"Ricomponi la frase.","it":"La sua famiglia, di lei, è tranquilla.","answer":"Haar familie is rustig.","answers":["Haar familie is rustig.","Rustig is haar familie."],"tiles":[{"text":"Haar","speak":true},{"text":"familie","speak":true},{"text":"is","speak":true},{"text":"rustig","speak":true},{"text":"haarr","speak":false,"distractor":true}],"note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale."},{"id":"8-m6","type":"tr","prompt":"Traduci con le tessere.","it":"Il suo ufficio, di lui, è aperto.","answer":"Zijn kantoor is open.","answers":["Zijn kantoor is open.","Open is zijn kantoor."],"tiles":[{"text":"Zijn","speak":true},{"text":"kantoor","speak":true},{"text":"is","speak":true},{"text":"open","speak":true},{"text":"adres","speak":true,"distractor":true}],"note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale."},{"id":"8-m7","type":"order","prompt":"Ricomponi la frase.","it":"Conosciamo il Suo nome.","answer":"Wij kennen uw naam.","answers":["Wij kennen uw naam.","We kennen uw naam.","Uw naam kennen wij.","Uw naam kennen we."],"tiles":[{"text":"Wij","speak":true},{"text":"kennen","speak":true},{"text":"uw","speak":true},{"text":"naam","speak":true},{"text":"We","speak":true},{"text":"uww","speak":false,"distractor":true}],"note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale."},{"id":"8-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Il loro telefono è caro.","answer":"Hun telefoon is duur.","answers":["Hun telefoon is duur.","Duur is hun telefoon."],"tiles":[{"text":"Hun","speak":true},{"text":"telefoon","speak":true},{"text":"is","speak":true},{"text":"duur","speak":true},{"text":"jas","speak":true,"distractor":true}],"note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale."},{"id":"8-m9","type":"order","prompt":"Ricomponi la frase.","it":"I nostri libri sono pronti.","answer":"Onze boeken zijn klaar.","answers":["Onze boeken zijn klaar.","Klaar zijn onze boeken."],"tiles":[{"text":"Onze","speak":true},{"text":"boeken","speak":true},{"text":"zijn","speak":true},{"text":"klaar","speak":true},{"text":"onzze","speak":false,"distractor":true}],"note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale."},{"id":"8-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Conosco la vostra famiglia.","answer":"Ik ken jullie familie.","answers":["Ik ken jullie familie.","Jullie familie ken ik."],"tiles":[{"text":"Ik","speak":true},{"text":"ken","speak":true},{"text":"jullie","speak":true},{"text":"familie","speak":true},{"text":"baan","speak":true,"distractor":true}],"note":"Il possessivo sostituisce l’articolo. Ons davanti a het singolare, onze davanti a de e al plurale."}]},{"id":9,"title":"Kunnen, moeten, mogen","it":"I verbi modali","group":1,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Per dire «posso lavorare» il neerlandese usa due verbi, come l'italiano, ma li distribuisce diversamente: \u003ci>ik kan werken\u003c/i>. Il modale si coniuga e il verbo dell'azione rimane all'infinito, normalmente verso la fine della frase. Se aggiungi un oggetto, questo entra fra i due verbi: \u003ci>ik wil koffie drinken\u003c/i>. Pensa a una cornice che contiene le altre informazioni.\u003c/p>\n\u003ch3>1 · Scegli il significato\u003c/h3>\u003cp>\u003ci>Kunnen\u003c/i> indica capacità o possibilità; \u003ci>moeten\u003c/i> una necessità; \u003ci>mogen\u003c/i> un permesso; \u003ci>willen\u003c/i> una volontà. Non ogni «potere» italiano corrisponde dunque a \u003ci>kunnen\u003c/i>. Se chiedi un'autorizzazione, \u003ci>mogen\u003c/i> è spesso la scelta più precisa. \u003ci>Zullen\u003c/i> compare nelle proposte, nelle previsioni e in altri usi modali: qui lo riconosci soprattutto nella proposta \u003ci>zullen we…?\u003c/i>.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Infinito\u003c/th>\u003cth>Ik\u003c/th>\u003cth>Hij\u003c/th>\u003cth>Wij\u003c/th>\u003c/tr>\u003ctr>\u003ctd>kunnen\u003c/td>\u003ctd>kan\u003c/td>\u003ctd>kan\u003c/td>\u003ctd>kunnen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>moeten\u003c/td>\u003ctd>moet\u003c/td>\u003ctd>moet\u003c/td>\u003ctd>moeten\u003c/td>\u003c/tr>\u003ctr>\u003ctd>mogen\u003c/td>\u003ctd>mag\u003c/td>\u003ctd>mag\u003c/td>\u003ctd>mogen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>willen\u003c/td>\u003ctd>wil\u003c/td>\u003ctd>wil\u003c/td>\u003ctd>willen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>zullen\u003c/td>\u003ctd>zal\u003c/td>\u003ctd>zal\u003c/td>\u003ctd>zullen\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Non aggiungere te\u003c/h3>\u003cp>Dopo questi modali l'infinito non prende \u003ci>te\u003c/i>. Dire \u003ci>ik moet betalen\u003c/i> significa «devo pagare». Non coniugare anche il secondo verbo: il numero e la persona sono già espressi dal modale. Quando il soggetto è plurale, cambia il primo verbo: \u003ci>wij moeten betalen\u003c/i>. La forma dell'azione rimane uguale.\u003c/p>\n\u003ch3>3 · Accetta le varianti corrette\u003c/h3>\u003cp>Con \u003ci>jij\u003c/i> e \u003ci>u\u003c/i> esistono varianti come \u003ci>kan/kunt\u003c/i>, \u003ci>wil/wilt\u003c/i> e \u003ci>zal/zult\u003c/i>. Non tutte le differenze che senti sono errori: dipendono anche dal registro. Con \u003ci>hij\u003c/i>, invece, lo standard è \u003ci>hij wil\u003c/i>, senza una \u003ci>t\u003c/i> aggiunta per analogia. Nelle domande il modale precede il soggetto: \u003ci>mag ik zitten?\u003c/i>, «posso sedermi?». Con \u003ci>jij\u003c/i> dopo il verbo sono corrette \u003ci>kun jij?\u003c/i> e \u003ci>kan jij?\u003c/i>; non conservare la terminazione di \u003ci>kunt\u003c/i>. Con \u003ci>u\u003c/i> invece puoi dire \u003ci>kunt u?\u003c/i> o \u003ci>kan u?\u003c/i>. La presenza di una variante non elimina quindi la regola dell'inversione.\u003c/p>\n\u003cp>Nell'ordine neutro l'infinito resta in fondo: \u003ci>ik kan fietsen\u003c/i>. Per mettere in evidenza l'azione puoi anche anticiparlo: \u003ci>fietsen kan ik\u003c/i>, «andare in bici, lo so fare». Cambia l'enfasi, mentre il modale coniugato resta in seconda posizione. Negli esercizi sono accettate anche queste disposizioni grammaticali delle stesse tessere.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Ik moet te werken.\u003c/s> → \u003cstrong>Ik moet werken.\u003c/strong> Nessun \u003ci>te\u003c/i> dopo il modale. \u003cs>Hij wilt betalen.\u003c/s> → \u003cstrong>Hij wil betalen.\u003c/strong> \u003cs>Wij kunnen werkt.\u003c/s> → \u003cstrong>Wij kunnen werken.\u003c/strong> Il secondo verbo deve restare all'infinito.\u003c/p>","keywords":[{"nl":"kunnen","it":"potere, essere capace"},{"nl":"moeten","it":"dovere"},{"nl":"mogen","it":"avere il permesso"},{"nl":"willen","it":"volere"},{"nl":"zullen","it":"modale di proposta o previsione"}],"words":[{"nl":"fietsen","it":"andare in bici"},{"nl":"lopen","it":"camminare"},{"nl":"wachten","it":"aspettare"},{"nl":"zitten","it":"stare seduto"},{"nl":"lezen","it":"leggere"},{"nl":"schrijven","it":"scrivere"},{"nl":"de brief","it":"la lettera"},{"nl":"het ticket","it":"il biglietto"}],"vlaanderen":{"text":"Lo standard in Belgio ammette proprie varianti riconosciute. Una variante regionale non è automaticamente un errore: negli esercizi distinguiamo il significato richiesto dalla preferenza di registro.","source":{"label":"Taaladvies · lo standard in Belgio","url":"https://taaladvies.net/wat-is-standaardtaal-algemeen/"}},"source":"standard","practiceNote":"Coniuga il modale; nell’ordine neutro l’azione resta all’infinito in fondo, senza te. Se anticipi l’azione, il modale coniugato resta secondo.","grammar":[{"id":"9-g1","type":"fill","prompt":"Completa la frase.","sentence":"Ik ___ lezen.","answer":"kan","answers":["kan"],"it":"So leggere.","hint":"Capacità, prima persona.","note":"Coniuga il modale; nell’ordine neutro l’azione resta all’infinito in fondo, senza te. Se anticipi l’azione, il modale coniugato resta secondo."},{"id":"9-g2","type":"mc","prompt":"Completa la frase.","sentence":"Wij ___ betalen.","answer":"moeten","answers":["moeten"],"it":"Dobbiamo pagare.","hint":"Necessità, plurale.","note":"Coniuga il modale; nell’ordine neutro l’azione resta all’infinito in fondo, senza te. Se anticipi l’azione, il modale coniugato resta secondo.","options":[{"text":"moeten","it":"Nella frase: Dobbiamo pagare.","speak":true},{"text":"moet","it":"Singolare.","speak":true},{"text":"mag","it":"Permesso singolare.","speak":true}],"correct":0},{"id":"9-g3","type":"fill","prompt":"Completa la frase.","sentence":"Hij ___ zitten.","answer":"mag","answers":["mag"],"it":"Lui può sedersi: ha il permesso.","hint":"Autorizzazione, non capacità.","note":"Coniuga il modale; nell’ordine neutro l’azione resta all’infinito in fondo, senza te. Se anticipi l’azione, il modale coniugato resta secondo."},{"id":"9-g4","type":"mc","prompt":"Completa la frase.","sentence":"Zij ___ koffie drinken.","answer":"wil","answers":["wil"],"it":"Lei vuole bere caffè.","hint":"Volontà, lei singolare.","note":"Coniuga il modale; nel sso sedermi? Chiedo permesso.","answer":"Mag ik zitten?","answers":["Mag ik zitten?"],"tiles":[{"text":"Mag","speak":true},{"text":"ik","speak":true},{"text":"zitten","speak":true},{"text":"magg","speak":false,"distractor":true}],"note":"Coniuga il modale; nell’ordine neutro l’azione resta all’infinito in fondo, senza te. Se anticipi l’azione, il modale coniugato resta secondo."},{"id":"9-m4","type":"tr","prompt":"Traduci con le tessere.","it":"Lui vuole scrivere una lettera.","answer":"Hij wil een brief schrijven.","answers":["Hij wil een brief schrijven.","Een brief wil hij schrijven.","Een brief schrijven wil hij.","Schrijven wil hij een brief."],"tiles":[{"text":"Hij","speak":true},{"text":"wil","speak":true},{"text":"een","speak":true},{"text":"brief","speak":true},{"text":"schrijven","speak":true},{"text":"ticket","speak":true,"distractor":true}],"note":"Coniuga il modale; nell’ordine neutro l’azione resta all’infinito in fondo, senza te. Se anticipi l’azione, il modale coniugato resta secondo."},{"id":"9-m5","type":"order","prompt":"Ricomponi la frase.","it":"Voi sapete leggere il libro.","answer":"Jullie kunnen het boek lezen.","answers":["Jullie kunnen het boek lezen.","Het boek kunnen jullie lezen.","Het boek lezen kunnen jullie.","Lezen kunnen jullie het boek."],"tiles":[{"text":"Jullie","speak":true},{"text":"kunnen","speak":true},{"text":"het","speak":true},{"text":"boek","speak":true},{"text":"lezen","speak":true},{"text":"lezent","speak":false,"distractor":true}],"note":"Coniuga il modale; nell’ordine neutro l’azione resta all’infinito in fondo, senza te. Se anticipi l’azione, il modale coniugato resta secondo."},{"id":"9-m6","type":"tr","prompt":"Traduci con le tessere.","it":"Devo pagare il biglietto.","answer":"Ik moet het ticket betalen.","answers":["Ik moet het ticket betalen.","Het ticket moet ik betalen.","Het ticket betalen moet ik.","Betalen moet ik het ticket."],"tiles":[{"text":"Ik","speak":true},{"text":"moet","speak":true},{"text":"het","speak":true},{"text":"ticket","speak":true},{"text":"betalen","speak":true},{"text":"brief","speak":true,"distractor":true}],"note":"Coniuga il modale; nell’ordine neutro l’azione resta all’infinito in fondo, senza te. Se anticipi l’azione, il modale coniugato resta secondo."},{"id":"9-m7","type":"order","prompt":"Ricomponi la frase.","it":"Andiamo? Proposta.","answer":"Zullen we gaan?","answers":["Zullen we gaan?","Zullen wij gaan?"],"tiles":[{"text":"Zullen","speak":true},{"text":"we","speak":true},{"text":"gaan","speak":true},{"text":"wij","speak":true},{"text":"zullent","speak":false,"distractor":true}],"note":"Coniuga il modale; nell’ordine neutro l’azione resta all’infinito in fondo, senza te. Se anticipi l’azione, il modale coniugato resta secondo."},{"id":"9-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Lei ha il permesso di bere caffè.","answer":"Zij mag koffie drinken.","answers":["Zij mag koffie drinken.","Ze mag koffie drinken.","Koffie mag zij drinken.","Koffie mag ze drinken.","Koffie drinken mag zij.","Koffie drinken mag ze.","Drinken mag zij koffie.","Drinken mag ze koffie."],"tiles":[{"text":"Zij","speak":true},{"text":"mag","speak":true},{"text":"koffie","speak":true},{"text":"drinken","speak":true},{"text":"Ze","speak":true},{"text":"lopen","speak":true,"distractor":true}],"note":"Coniuga il modale; nell’ordine neutro l’azione resta all’infinito in fondo, senza te. Se anticipi l’azione, il modale coniugato resta secondo."},{"id":"9-m9","type":"order","prompt":"Ricomponi la frase.","it":"Lei può lavorare.","answer":"U kunt werken.","answers":["U kunt werken.","U kan werken.","Werken kunt u.","Werken kan u."],"tiles":[{"text":"U","speak":true},{"text":"kunt","speak":true},{"text":"werken","speak":true},{"text":"kan","speak":true},{"text":"kunnent","speak":false,"distractor":true}],"note":"Coniuga il modale; nell’ordine neutro l’azione resta all’infinito in fondo, senza te. Se anticipi l’azione, il modale coniugato resta secondo."},{"id":"9-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Vogliamo camminare.","answer":"Wij willen lopen.","answers":["Wij willen lopen.","We willen lopen.","Lopen willen wij.","Lopen willen we."],"tiles":[{"text":"Wij","speak":true},{"text":"willen","speak":true},{"text":"lopen","speak":true},{"text":"We","speak":true},{"text":"zitten","speak":true,"distractor":true}],"note":"Coniuga il modale; nell’ordine neutro l’azione resta all’infinito in fondo, senza te. Se anticipi l’azione, il modale coniugato resta secondo."}]},{"id":10,"title":"Vandaag werk ik","it":"L’ordine delle parole: V2","group":1,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>In una frase dichiarativa principale il verbo coniugato occupa normalmente la seconda posizione. La sigla V2 significa proprio «verbo secondo». Attenzione: si contano i gruppi di parole, non le singole parole. \u003ci>Mijn collega\u003c/i> può essere tutto un soggetto in prima posizione. Questa regola rende l'ordine neerlandese meno libero di quello italiano, ma ti offre un punto fermo per costruire la frase.\u003c/p>\n\u003ch3>1 · Parti dal soggetto\u003c/h3>\u003cp>La struttura più semplice è \u003ci>ik werk vandaag\u003c/i>, «lavoro oggi». Il soggetto viene prima, il verbo secondo e l'indicazione temporale dopo. Se ci sono due verbi, soltanto quello coniugato occupa la seconda posizione: \u003ci>ik wil vandaag werken\u003c/i>. L'infinito resta verso la fine. Per controllare una frase, trova dunque prima il verbo che cambia secondo la persona.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Primo gruppo\u003c/th>\u003cth>Verbo\u003c/th>\u003cth>Resto\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Ik\u003c/td>\u003ctd>werk\u003c/td>\u003ctd>vandaag.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vandaag\u003c/td>\u003ctd>werk\u003c/td>\u003ctd>ik.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>In de winkel\u003c/td>\u003ctd>werkt\u003c/td>\u003ctd>Nora.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Morgen\u003c/td>\u003ctd>moet\u003c/td>\u003ctd>ik werken.\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Metti in evidenza tempo o luogo\u003c/h3>\u003cp>Puoi iniziare con «oggi», «domani» o un luogo per collegarti alla conversazione. Quando quel gruppo occupa il primo posto, il soggetto passa dopo il verbo: \u003ci>vandaag werk ik\u003c/i>. Questo si chiama inversione. Non è una domanda: c'è già un altro elemento prima del verbo. La frase mantiene il valore dichiarativo e cambia soltanto il punto di partenza dell'informazione.\u003c/p>\n\u003ch3>3 · Sposta gruppi completi\u003c/h3>\u003cp>\u003ci>In de winkel\u003c/i> significa «nel negozio» e forma un unico gruppo. \u003ci>Naar\u003c/i> indica la destinazione: \u003ci>naar het park\u003c/i> significa «al parco», quando ci vai. Anche questo gruppo può iniziare la frase. Non separare l'articolo dal nome per ottenere artificiosamente una seconda posizione. Anche «oggi» e il soggetto non possono occupare insieme due posti prima del verbo nella normale frase principale. Con \u003ci>jij\u003c/i> dopo il verbo ricompare la regola sulla \u003ci>t\u003c/i>: \u003ci>vandaag werk jij\u003c/i>. Con \u003ci>u\u003c/i> l'inversione non cambia la forma verbale: \u003ci>vandaag werkt u\u003c/i>, oppure, con il modale già studiato, \u003ci>vandaag kunt u werken\u003c/i> o \u003ci>vandaag kan u werken\u003c/i>.\u003c/p>\n\u003cp>Le frasi con tessere possono ammettere più inizi naturali. Se sono presenti le stesse informazioni, l'app accetta le alternative indicate, per esempio soggetto iniziale oppure tempo iniziale. Non devi indovinare la preferenza stilistica dell'autore. Concentrati sull'accordo verbale e sulla posizione del verbo coniugato.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Vandaag ik werk.\u003c/s> → \u003cstrong>Vandaag werk ik.\u003c/strong> Il verbo resta secondo. \u003cs>Morgen ik moet werken.\u003c/s> → \u003cstrong>Morgen moet ik werken.\u003c/strong> Si sposta il modale, non l'infinito.\u003c/p>","keywords":[{"nl":"vandaag","it":"oggi"},{"nl":"morgen","it":"domani"},{"nl":"hier","it":"qui"},{"nl":"daar","it":"lì"},{"nl":"in","it":"in, dentro"},{"nl":"naar","it":"a, verso una destinazione"}],"words":[{"nl":"de school","it":"la scuola"},{"nl":"het park","it":"il parco"},{"nl":"de bibliotheek","it":"la biblioteca"},{"nl":"het café","it":"il bar"},{"nl":"de keuken","it":"la cucina"},{"nl":"de bakker","it":"il panettiere"},{"nl":"eten","it":"mangiare"},{"nl":"kopen","it":"comprare"}],"vlaanderen":{"text":"Vannamiddag è standard in Belgio e indica il pomeriggio, soprattutto nel parlato informale. Come altre indicazioni di tempo può occupare il primo posto della principale.","source":{"label":"Team Taaladvies · vanmiddag","url":"https://www.vlaanderen.be/team-taaladvies/taaladviezen/deze-middag-vanmiddag-vannamiddag"}},"source":"afternoon","practiceNote":"Il verbo coniugato resta al secondo posto: tempo + verbo + soggetto oppure soggetto + verbo + tempo.","grammar":[{"id":"10-g1","type":"fill","prompt":"Completa la frase.","sentence":"Vandaag ___ ik.","answer":"werk","answers":["werk"],"it":"Oggi lavoro.","hint":"Lavorare, il soggetto è ik.","note":"Il verbo coniugato resta al secondo posto: tempo + verbo + soggetto oppure soggetto + verbo + tempo."},{"id":"10-g2","type":"mc","prompt":"Completa la frase.","sentence":"Morgen ___ wij.","answer":"werken","answers":["werken"],"it":"Domani lavoriamo.","hint":"Lavorare, soggetto plurale.","note":"Il verbo coniugato resta al secondo posto: tempo + verbo + soggetto oppure soggetto + verbo + tempo.","options":[{"text":"werken","it":"Nella frase: Domani lavoriamo.","speak":true},{"text":"werk","it":"Singolare.","speak":true},{"text":"werkt","it":"Singolare.","speak":true}],"correct":0},{"id":"10-g3","type":"fill","prompt":"Completa la frase.","sentence":"Hier ___ hij.","answer":"woont","answers":["woont"],"it":"Qui abita lui.","hint":"Abitare, terza persona.","note":"Il verbo coniugato resta al secondo posto: tempo + verbo + soggetto oppure soggetto + verbo c/i> conta quelli che mancano all'ora successiva. \u003ci>Tien over drie\u003c/i> sono le tre e dieci; \u003ci>tien voor vier\u003c/i> sono le quattro meno dieci. Non confondere il numero pronunciato con l'ora digitale: dopo \u003ci>voor\u003c/i> stai nominando l'ora futura. \u003ci>Kwart\u003c/i> significa quindici minuti, mentre \u003ci>half\u003c/i> introduce una costruzione diversa, senza aggiungere \u003ci>over\u003c/i>. In Fiandra sentirai anche \u003ci>na\u003c/i> al posto di \u003ci>over\u003c/i>: \u003ci>tien na vier\u003c/i> indica le quattro e dieci. Accettiamo anche questa variante.\u003c/p>\n\u003ch3>3 · Fissa un appuntamento\u003c/h3>\u003cp>Per dire a che ora succede qualcosa, usa \u003ci>om\u003c/i>: \u003ci>ik kom om acht uur\u003c/i>, «vengo alle otto». Per una durata, invece, puoi dire \u003ci>ik werk acht uur\u003c/i>, «lavoro otto ore». La presenza di \u003ci>om\u003c/i> cambia quindi il significato. Se sposti l'indicazione all'inizio, conserva V2: \u003ci>om acht uur kom ik\u003c/i>. Negli esercizi leggi se è richiesta una forma parlata o numerica, perché entrambe possono essere valide nella vita reale.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Half drie = 3:30\u003c/s> → \u003cstrong>half drie = 2:30\u003c/strong>. \u003cs>Ik kom in acht uur.\u003c/s> → \u003cstrong>Ik kom om acht uur.\u003c/strong> Per l'appuntamento serve \u003ci>om\u003c/i>, non una traduzione automatica di «in».\u003c/p>","keywords":[{"nl":"uur","it":"ora"},{"nl":"half","it":"mezza verso l’ora successiva"},{"nl":"kwart","it":"quarto d’ora"},{"nl":"over","it":"dopo, nell’ora"},{"nl":"voor","it":"prima, nell’ora"},{"nl":"om","it":"alle, con un orario"}],"words":[{"nl":"de afspraak","it":"l’appuntamento"},{"nl":"de les","it":"la lezione"},{"nl":"de pauze","it":"la pausa"},{"nl":"de ochtend","it":"la mattina"},{"nl":"de avond","it":"la sera"},{"nl":"beginnen","it":"cominciare"},{"nl":"stoppen","it":"fermarsi, finire"},{"nl":"laat","it":"tardi"}],"vlaanderen":{"text":"In Belgio voormiddag è circa la fascia 9–12 e namiddag il periodo fra mezzogiorno e sera. Indicare anche l’ora rende più chiaro un appuntamento.","source":{"label":"Taaladvies · voormiddag/namiddag","url":"https://taaladvies.net/voormiddag-namiddag/"}},"source":"time","practiceNote":"Half nomina l’ora successiva. Om introduce l’orario di un evento.","grammar":[{"id":"11-g1","type":"fill","prompt":"Completa la frase.","sentence":"3:00: Het is drie ___.","answer":"uur","answers":["uur"],"it":"Sono le tre.","hint":"Completa l’ora intera.","note":"Half nomina l’ora successiva. Om introduce l’orario di un evento."},{"id":"11-g2","type":"mc","prompt":"Completa la frase.","sentence":"3:15: Het is kwart ___ drie.","answer":"over","answers":["over"],"it":"Sono le tre e un quarto.","hint":"I minuti sono dopo le tre.","note":"Half nomina l’ora successiva. Om introduce l’orario di un evento.","options":[{"text":"over","it":"Nella frase: Sono le tre e un quarto.","speak":true},{"text":"voor","it":"Prima: darebbe le 2:45.","speak":true},{"text":"om","it":"Introduce un appuntamento.","speak":true}],"correct":0},{"id":"11-g3","type":"fill","prompt":"Completa la frase.","sentence":"3:30: Het is half ___.","answer":"vier","answers":["vier"],"it":"Sono le tre e mezza.","hint":"Scrivi in lettere l’ora successiva.","note":"Half nomina l’ora successiva. Om introduce l’orario di un evento."},{"id":"11-g4","type":"mc","prompt":"Completa la frase.","sentence":"3:45: Het is kwart ___ vier.","answer":"voor","answers":["voor"],"it":"Sono le quattro meno un quarto.","hint":"Manca un quarto alle quattro.","note":"Half nomina l’ora successiva. Om introduce l’orario di un evento.","options":[{"text":"voor","it":"Nella frase: Sono le quattro meno un quarto.","speak":true},{"text":"over","it":"Darebbe le 4:15.","speak":true},{"text":"om","it":"Introduce un evento.","speak":true}],"correct":0},{"id":"11-g5","type":"fill","prompt":"Completa la frase.","sentence >ik heb geen fiets\u003c/i>. Lo stesso vale con nomi senza articolo che indicano quantità indefinite: \u003ci>ik drink geen koffie\u003c/i>. Anche al plurale puoi usare \u003ci>geen\u003c/i>, come in \u003ci>geen boeken\u003c/i>. Non cambia forma secondo il nome.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Positivo\u003c/th>\u003cth>Negativo\u003c/th>\u003cth>Motivo\u003c/th>\u003c/tr>\u003ctr>\u003ctd>een fiets\u003c/td>\u003ctd>geen fiets\u003c/td>\u003ctd>nome indefinito\u003c/td>\u003c/tr>\u003ctr>\u003ctd>koffie\u003c/td>\u003ctd>geen koffie\u003c/td>\u003ctd>sostanza generica\u003c/td>\u003c/tr>\u003ctr>\u003ctd>de fiets\u003c/td>\u003ctd>niet de fiets\u003c/td>\u003ctd>riferimento definito\u003c/td>\u003c/tr>\u003ctr>\u003ctd>nieuw\u003c/td>\u003ctd>niet nieuw\u003c/td>\u003ctd>qualità\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Nega qualità, luogo o azione\u003c/h3>\u003cp>\u003ci>Niet\u003c/i> nega un aggettivo, un avverbio, un gruppo definito o la frase. Davanti a una qualità dici \u003ci>het boek is niet duur\u003c/i>. Davanti a un luogo puoi dire \u003ci>ik woon niet hier\u003c/i>, se stai contrastando quel luogo. Con una semplice azione senza altri complementi, \u003ci>niet\u003c/i> viene spesso dopo il verbo: \u003ci>ik werk niet\u003c/i>. Non cercare un unico posto valido per ogni frase.\u003c/p>\n\u003ch3>3 · Leggi il significato intero\u003c/h3>\u003cp>Con un modale, la negazione può stare prima dell'infinito: \u003ci>ik kan niet komen\u003c/i>, «non posso venire». Se invece neghi l'oggetto indefinito, usa \u003ci>geen\u003c/i>: \u003ci>ik wil geen koffie drinken\u003c/i>. La scelta dipende da ciò che neghi, non dalla presenza del modale. Contrasti espliciti possono produrre usi diversi, come «non una, ma due»: per questo gli esercizi precisano il significato e lavorano sulla negazione neutra, senza contrasto sottinteso. Nelle frasi con tessere accettiamo anche un gruppo anticipato per metterlo in rilievo: \u003ci>geen geld heb ik\u003c/i> conserva la negazione e porta l'oggetto all'inizio. Il verbo resta in seconda posizione.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Ik niet werk.\u003c/s> → \u003cstrong>Ik werk niet.\u003c/strong> Mantieni il verbo in seconda posizione. \u003cs>Ik heb niet een fiets.\u003c/s> → \u003cstrong>Ik heb geen fiets.\u003c/strong> Questa è la negazione neutra. \u003cs>Het boek is geen duur.\u003c/s> → \u003cstrong>Het boek is niet duur.\u003c/strong> Un aggettivo prende \u003ci>niet\u003c/i>.\u003c/p>","keywords":[{"nl":"niet","it":"non"},{"nl":"geen","it":"nessun, non un"}],"words":[{"nl":"nieuw","it":"nuovo"},{"nl":"oud","it":"vecchio"},{"nl":"klein","it":"piccolo"},{"nl":"groot","it":"grande"},{"nl":"het geld","it":"il denaro"},{"nl":"de tijd","it":"il tempo"},{"nl":"de melk","it":"il latte"},{"nl":"de suiker","it":"lo zucchero"}],"vlaanderen":{"text":"Goesting è una parola informale del neerlandese belga per voglia o desiderio. Puoi incontrare geen goesting nel parlato; qui alleniamo la negazione con lessico già presentato.","source":{"label":"Canon van Vlaanderen · goesting","url":"https://www.canonvanvlaanderen.be/events/goesting/"}},"source":"goesting","practiceNote":"Geen nega un nome indefinito; niet nega qualità, azioni o riferimenti definiti.","grammar":[{"id":"12-g1","type":"fill","prompt":"Completa la frase.","sentence":"Ik heb ___ fiets.","answer":"geen","answers":["geen"],"it":"Non ho una bici.","hint":"Negazione neutra di un nome indefinito.","note":"Geen nega un nome indefinito; niet nega qualità, azioni o riferimenti definiti."},{"id":"12-g2","type":"mc","prompt":"Completa la frase.","sentence":"Het huis is ___ groot.","answer":"niet","answers":["niet"],"it":"La casa non è grande.","hint":"Nega una qualità.","note":"Geen nega un nome indefinito; niet nega qualità, azioni o riferimenti definiti.","options":[{"text":"niet","it":"Nella frase: La casa non è grande.","speak":true},{"text":"geen","it":"Si usa con un nome i dat","it":"I dimostrativi","group":2,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>«Questo» e «quello» indicano qualcosa vicino o lontano, nello spazio oppure nel discorso. Il neerlandese distingue anche il tipo del nome: \u003ci>deze fiets\u003c/i>, «questa bici», ma \u003ci>dit huis\u003c/i>, «questa casa». Il genere italiano non decide la forma. Ti serve conoscere l'articolo neerlandese, anche se nella frase non lo scrivi. È lo stesso lavoro di riconoscimento già fatto con \u003ci>ons\u003c/i> e \u003ci>onze\u003c/i>.\u003c/p>\n\u003ch3>1 · Usa una matrice semplice\u003c/h3>\u003cp>Per un nome singolare con \u003ci>de\u003c/i> scegli \u003ci>deze\u003c/i> se è vicino e \u003ci>die\u003c/i> se è lontano. Per un singolare con \u003ci>het\u003c/i> scegli \u003ci>dit\u003c/i> e \u003ci>dat\u003c/i>. Al plurale usa sempre \u003ci>deze\u003c/i> o \u003ci>die\u003c/i>. Non aggiungere l'articolo dopo il dimostrativo: esso occupa già quella posizione davanti al nome.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Nome\u003c/th>\u003cth>Vicino\u003c/th>\u003cth>Lontano\u003c/th>\u003c/tr>\u003ctr>\u003ctd>de fiets\u003c/td>\u003ctd>deze fiets\u003c/td>\u003ctd>die fiets\u003c/td>\u003c/tr>\u003ctr>\u003ctd>het huis\u003c/td>\u003ctd>dit huis\u003c/td>\u003ctd>dat huis\u003c/td>\u003c/tr>\u003ctr>\u003ctd>de boeken\u003c/td>\u003ctd>deze boeken\u003c/td>\u003ctd>die boeken\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Riprendi un nome già noto\u003c/h3>\u003cp>Il dimostrativo può anche comparire senza nome se il riferimento è chiaro. Parlando di una bici puoi dire \u003ci>die is duur\u003c/i>, «quella è cara». Parlando di un libro, \u003ci>dat is duur\u003c/i> può riferirsi a quel libro oppure a una situazione, secondo il contesto. Nelle prime risposte è più facile conservare il nome: così puoi controllare articolo, numero e forma del dimostrativo insieme.\u003c/p>\n\u003ch3>3 · Presenta qualcuno o qualcosa\u003c/h3>\u003cp>Per presentare una persona dici anche \u003ci>dit is mijn collega\u003c/i>, «questo è il mio collega», indipendentemente da \u003ci>de collega\u003c/i>. Non è la stessa struttura di \u003ci>deze collega\u003c/i>: nella presentazione \u003ci>dit\u003c/i> funziona da soggetto e non accompagna direttamente il nome. Davanti a un plurale puoi trovare \u003ci>dit zijn mijn boeken\u003c/i>. La forma iniziale resta \u003ci>dit\u003c/i>, mentre il verbo concorda con ciò che viene identificato.\u003c/p>\n\u003cp>Vicino e lontano non sono misure rigide in metri: possono indicare anche una frase appena detta o una scelta fra due oggetti. Negli esercizi il suggerimento specifica quale distanza è richiesta, così la selezione resta univoca senza obbligarti a immaginare una scena nascosta.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Deze huis\u003c/s> → \u003cstrong>dit huis\u003c/strong>. \u003cs>Dit boeken\u003c/s> → \u003cstrong>deze boeken\u003c/strong>. \u003cs>Deze de fiets\u003c/s> → \u003cstrong>deze fiets\u003c/strong>. Il dimostrativo sostituisce l'articolo, non si aggiunge davanti a esso.\u003c/p>","keywords":[{"nl":"deze","it":"questo, de o plurale"},{"nl":"die","it":"quello, de o plurale"},{"nl":"dit","it":"questo, het singolare"},{"nl":"dat","it":"quello, het singolare"}],"words":[{"nl":"de kaart","it":"la carta, mappa"},{"nl":"het formulier","it":"il modulo"},{"nl":"de pen","it":"la penna"},{"nl":"het scherm","it":"lo schermo"},{"nl":"de computer","it":"il computer"},{"nl":"het pakket","it":"il pacco"},{"nl":"de doos","it":"la scatola"},{"nl":"het document","it":"il documento"}],"vlaanderen":{"text":"Deze middag è standard ed è più frequente in Belgio che nei Paesi Bassi. Può significare oggi a mezzogiorno o oggi pomeriggio secondo l’uso e il contesto: per un appuntamento preciso aggiungi l’ora.","source":{"label":"Team Taaladvies · vanmiddag","url":"https://www.vlaanderen.be/team-taaladvies/taaladviezen/deze-middag-vanmiddag-vannamiddag"}},"source":"afternoon","practiceNo k":true,"distractor":true}],"note":"De singolare e ogni plurale: deze/die. Het singolare: dit/dat."},{"id":"13-m7","type":"order","prompt":"Ricomponi la frase.","it":"Questa scatola è piccola.","answer":"Deze doos is klein.","answers":["Deze doos is klein.","Klein is deze doos."],"tiles":[{"text":"Deze","speak":true},{"text":"doos","speak":true},{"text":"is","speak":true},{"text":"klein","speak":true},{"text":"dezee","speak":false,"distractor":true}],"note":"De singolare e ogni plurale: deze/die. Het singolare: dit/dat."},{"id":"13-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Quel documento è vecchio.","answer":"Dat document is oud.","answers":["Dat document is oud.","Oud is dat document."],"tiles":[{"text":"Dat","speak":true},{"text":"document","speak":true},{"text":"is","speak":true},{"text":"oud","speak":true},{"text":"scherm","speak":true,"distractor":true}],"note":"De singolare e ogni plurale: deze/die. Het singolare: dit/dat."},{"id":"13-m9","type":"order","prompt":"Ricomponi la frase.","it":"Questi sono i miei libri.","answer":"Dit zijn mijn boeken.","answers":["Dit zijn mijn boeken.","Mijn boeken zijn dit.","Deze zijn mijn boeken.","Mijn boeken zijn deze."],"tiles":[{"text":"Dit","speak":true},{"text":"zijn","speak":true},{"text":"mijn","speak":true},{"text":"boeken","speak":true},{"text":"Deze","speak":true},{"text":"zijnt","speak":false,"distractor":true}],"note":"Dit presenta; deze può indicare libri già identificabili. Sono accettate entrambe le letture e l’ordine inverso."},{"id":"13-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Quelle scatole sono grandi.","answer":"Die dozen zijn groot.","answers":["Die dozen zijn groot.","Groot zijn die dozen."],"tiles":[{"text":"Die","speak":true},{"text":"dozen","speak":true},{"text":"zijn","speak":true},{"text":"groot","speak":true},{"text":"pakket","speak":true,"distractor":true}],"note":"De singolare e ogni plurale: deze/die. Het singolare: dit/dat."}]},{"id":14,"title":"Een mooi huis","it":"Gli aggettivi","group":2,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Un aggettivo descrive una persona o una cosa. In italiano cambia spesso per genere e numero; in neerlandese la distinzione principale è la posizione. Dopo un verbo come essere la forma di base resta normalmente invariata: \u003ci>het huis is mooi\u003c/i>, «la casa è bella». Prima del nome, invece, compare spesso una \u003ci>-e\u003c/i>: \u003ci>het mooie huis\u003c/i>. Non trasferire dunque il sistema italiano parola per parola.\u003c/p>\n\u003ch3>1 · Dopo il verbo: forma base\u003c/h3>\u003cp>\u003ci>De fiets is nieuw\u003c/i> e \u003ci>de fietsen zijn nieuw\u003c/i> usano lo stesso aggettivo. Il verbo cambia al plurale, l'aggettivo no. Anche se parli di una donna o di più donne, \u003ci>blij\u003c/i> rimane \u003ci>blij\u003c/i>. Controlla prima se l'aggettivo è collegato al nome tramite un verbo oppure si trova direttamente davanti al nome: questa domanda risolve molti errori.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Contesto\u003c/th>\u003cth>Forma\u003c/th>\u003cth>Italiano\u003c/th>\u003c/tr>\u003ctr>\u003ctd>dopo zijn\u003c/td>\u003ctd>het huis is mooi\u003c/td>\u003ctd>la casa è bella\u003c/td>\u003c/tr>\u003ctr>\u003ctd>nome de\u003c/td>\u003ctd>een mooie fiets\u003c/td>\u003ctd>una bella bici\u003c/td>\u003c/tr>\u003ctr>\u003ctd>het definito\u003c/td>\u003ctd>het mooie huis\u003c/td>\u003ctd>la bella casa\u003c/td>\u003c/tr>\u003ctr>\u003ctd>het indefinito singolare\u003c/td>\u003ctd>een mooi huis\u003c/td>\u003ctd>una bella casa\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Prima del nome: di solito e\u003c/h3>\u003cp>Davanti a un nome con \u003ci>de\u003c/i> aggiungi normalmente \u003ci>-e\u003c/i>, anche con \u003ci>een\u003c/i>. Con un nome neutro singolare definito vale la stessa regola: \u003ci>dit nieuwe boek\u003c/i>. Al plurale l'aggettivo davanti al nome prende normalmente \u003ci>-e\u003c/i>. La grafia si adatta al suono: \u003ci>groot\u003c/i> diventa \u003ci>grote\u003c/i>, mentre \u003ci>wit\u003c/i> diventa \u003ci>witte\u003c/i>. Anche \u003ci>rood\u003c/i>, «rosso», diventa \u003ci>rode\u003c/i>, e \u003ci>zwaar\u003c/i>, «pesante», diventa \u003ci>zware\u003c/i>: la vocale lunga si scrive una sola volta nella sillaba aperta. Non limitarti ad attaccare una lettera senza osservare la sillaba.\u003c/p>\n\u003ch3>3 · Ricorda l'eccezione frequente\u003c/h3>\u003cp>Con un nome neutro singolare indefinito, dopo \u003ci>een\u003c/i> o \u003ci>geen\u003c/i>, usa in genere la forma senza \u003ci>-e\u003c/i>: \u003ci>een klein huis\u003c/i>, \u003ci>geen nieuw boek\u003c/i>. Senza determinante, la stessa forma compare in molti gruppi indefiniti. Esistono espressioni fisse e altri tipi di aggettivo che richiedono attenzione ulteriore, ma per le descrizioni quotidiane questa opposizione è il punto di partenza più utile.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Het huis is mooie.\u003c/s> → \u003cstrong>Het huis is mooi.\u003c/strong> Dopo essere usa la base. \u003cs>Een mooie huis\u003c/s> → \u003cstrong>een mooi huis\u003c/strong>. \u003cs>Een nieuw fiets\u003c/s> → \u003cstrong>een nieuwe fiets\u003c/strong>: il nome è di tipo \u003ci>de\u003c/i>, anche se in frase compare \u003ci>een\u003c/i>.\u003c/p>","keywords":[],"words":[{"nl":"mooi","it":"bello"},{"nl":"wit","it":"bianco"},{"nl":"rood","it":"rosso"},{"nl":"warm","it":"caldo"},{"nl":"koud","it":"freddo"},{"nl":"lekker","it":"buono, gustoso"},{"nl":"schoon","it":"pulito"},{"nl":"zwaar","it":"pesante"}],"vlaanderen":{"text":"Le varianti belghe riconosciute appartengono allo standard in Belgio. Per le descrizioni di questa unità usiamo forme comuni allo standard, senza dedurre il genere dall’italiano.","source":{"label":"Taaladvies · lo standard in Belgio","url":"https://taaladvies.net/wat-is-standaardtaal-algemeen/"}},"source":"standard","practiceNote":"Aggettivo predicativo senza e; attributivo con e, tranne het singolare indefi
