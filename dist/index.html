senza ausiliare: werkte/werkten, was/waren. Nelle frasi con modale il verbo dell’azione resta all’infinito."},{"id":"20-m3","type":"order","prompt":"Ricomponi la frase.","it":"Lei arrivò presto.","answer":"Zij kwam vroeg.","answers":["Zij kwam vroeg.","Ze kwam vroeg.","Vroeg kwam zij.","Vroeg kwam ze."],"tiles":[{"text":"Zij","speak":true},{"text":"kwam","speak":true},{"text":"vroeg","speak":true},{"text":"Ze","speak":true},{"text":"kwamm","speak":false,"distractor":true}],"note":"Passato semplice senza ausiliare: werkte/werkten, was/waren. Nelle frasi con modale il verbo dell’azione resta all’infinito."},{"id":"20-m4","type":"tr","prompt":"Traduci con le tessere.","it":"Lui passò una buona giornata.","answer":"Hij had een goede dag.","answers":["Hij had een goede dag.","Een goede dag had hij."],"tiles":[{"text":"Hij","speak":true},{"text":"had","speak":true},{"text":"een","speak":true},{"text":"goede","speak":true},{"text":"dag","speak":true},{"text":"jaar","speak":true,"distractor":true}],"note":"Passato semplice senza ausiliare: werkte/werkten, was/waren. Nelle frasi con modale il verbo dell’azione resta all’infinito."},{"id":"20-m5","type":"order","prompt":"Ricomponi la frase.","it":"Non riuscivo a dormire.","answer":"Ik kon niet slapen.","answers":["Ik kon niet slapen.","Slapen kon ik niet."],"tiles":[{"text":"Ik","speak":true},{"text":"kon","speak":true},{"text":"niet","speak":true},{"text":"slapen","speak":true},{"text":"konn","speak":false,"distractor":true}],"note":"Passato semplice senza ausiliare: werkte/werkten, was/waren. Nelle frasi con modale il verbo dell’azione resta all’infinito."},{"id":"20-m6","type":"tr","prompt":"Traduci con le tessere.","it":"Eravamo giovani.","answer":"Wij waren jong.","answers":["Wij waren jong.","We waren jong.","Jong waren wij.","Jong waren we."],"tiles":[{"text":"Wij","speak":true},{"text":"waren","speak":true},{"text":"jong","speak":true},{"text":"We","speak":true},{"text":"ziek","speak":true,"distractor":true}],"note":"Passato semplice senza ausiliare: werkte/werkten, was/waren. Nelle frasi con modale il verbo dell’azione resta all’infinito."},{"id":"20-m7","type":"order","prompt":"Ricomponi la frase.","it":"Lui doveva lavorare.","answer":"Hij moest werken.","answers":["Hij moest werken.","Werken moest hij."],"tiles":[{"text":"Hij","speak":true},{"text":"moest","speak":true},{"text":"werken","speak":true},{"text":"moestt","speak":false,"distractor":true}],"note":"Passato semplice senza ausiliare: werkte/werkten, was/waren. Nelle frasi con modale il verbo dell’azione resta all’infinito."},{"id":"20-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Lessi quella lettera.","answer":"Ik las die brief.","answers":["Ik las die brief.","Die brief las ik."],"tiles":[{"text":"Ik","speak":true},{"text":"las","speak":true},{"text":"die","speak":true},{"text":"brief","speak":true},{"text":"week","speak":true,"distractor":true}],"note":"Passato semplice senza ausiliare: werkte/werkten, was/waren. Nelle frasi con modale il verbo dell’azione resta all’infinito."},{"id":"20-m9","type":"order","prompt":"Ricomponi la frase.","it":"Loro andarono al museo.","answer":"Zij gingen naar het museum.","answers":["Zij gingen naar het museum.","Ze gingen naar het museum.","Naar het museum gingen zij.","Naar het museum gingen ze."],"tiles":[{"text":"Zij","speak":true},{"text":"gingen","speak":true},{"text":"naar","speak":true},{"text":"het","speak":true},{"text":"museum","speak":true},{"text":"Ze","speak":true},{"text":"gingent","speak":false,"distractor":true}],"note":"Passato semplice senza ausiliare: werkte/werkten, was/waren. Nelle frasi con modale il verbo dell’azione resta all’infinito."},{"id":"20-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Abbiamo avuto un buon anno: usa il passato semplice.","answer":"Wij hadden een goed jaar.","answers":["Wij hadden een goed jaar.","We hadden een goed jaar.","Een goed jaar hadden wij.","Een goed jaar hadden we."],"tiles":[{"text":"Wij","speak":true},{"text":"hadden","speak":true},{"text":"een","speak":true},{"text":"goed","speak":true},{"text":"jaar","speak":true},{"text":"We","speak":true},{"text":"dag","speak":true,"distractor":true}],"note":"Passato semplice senza ausiliare: werkte/werkten, was/waren. Nelle frasi con modale il verbo dell’azione resta all’infinito."}]},{"id":21,"title":"Ik voel me goed","it":"I verbi riflessivi","group":4,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Un verbo riflessivo contiene un pronome che rimanda al soggetto: \u003ci>ik was me\u003c/i>, «mi lavo». Italiano e neerlandese condividono questa possibilità, ma non assegnano sempre la forma riflessiva agli stessi verbi. Non tradurre automaticamente ogni «mi» italiano con \u003ci>me\u003c/i>, né eliminare il pronome solo perché il verbo italiano non lo richiede. Impara il verbo insieme alla sua costruzione.\u003c/p>\n\u003ch3>1 · Abbina il pronome alla persona\u003c/h3>\u003cp>Con \u003ci>ik\u003c/i> usa normalmente \u003ci>me\u003c/i>, oppure \u003ci>mij\u003c/i>; con \u003ci>jij\u003c/i>, \u003ci>je\u003c/i> o \u003ci>jou\u003c/i>; con \u003ci>hij\u003c/i> e \u003ci>zij\u003c/i> singolare, \u003ci>zich\u003c/i>. Al plurale trovi \u003ci>ons\u003c/i> con «noi», normalmente \u003ci>je\u003c/i> con \u003ci>jullie\u003c/i>, e \u003ci>zich\u003c/i> con «loro». Anche \u003ci>jullie\u003c/i> può essere riflessivo, ma la ripetizione è meno comune. La forma di cortesia permette \u003ci>u\u003c/i> oppure \u003ci>zich\u003c/i> in molte costruzioni.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Soggetto\u003c/th>\u003cth>Riflessivo\u003c/th>\u003cth>Frase\u003c/th>\u003c/tr>\u003ctr>\u003ctd>ik\u003c/td>\u003ctd>me\u003c/td>\u003ctd>ik was me\u003c/td>\u003c/tr>\u003ctr>\u003ctd>jij\u003c/td>\u003ctd>je\u003c/td>\u003ctd>jij wast je\u003c/td>\u003c/tr>\u003ctr>\u003ctd>hij / zij\u003c/td>\u003ctd>zich\u003c/td>\u003ctd>hij wast zich\u003c/td>\u003c/tr>\u003ctr>\u003ctd>wij\u003c/td>\u003ctd>ons\u003c/td>\u003ctd>wij wassen ons\u003c/td>\u003c/tr>\u003ctr>\u003ctd>jullie / zij plurale\u003c/td>\u003ctd>je / zich\u003c/td>\u003ctd>jullie wassen je\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Distingui se stessi da un'altra persona\u003c/h3>\u003cp>\u003ci>Hij wast zich\u003c/i> significa che lui lava se stesso; \u003ci>hij wast hem\u003c/i> significa normalmente che lava un'altra persona maschile. Il riflessivo non è dunque intercambiabile con qualsiasi pronome oggetto. Con alcuni verbi il pronome è parte della costruzione: \u003ci>zich vergissen\u003c/i>, «sbagliarsi», e \u003ci>zich herinneren\u003c/i>, «ricordarsi».\u003c/p>\n\u003cp>Con \u003ci>wassen\u003c/i> o \u003ci>aankleden\u003c/i> puoi sottolineare «se stesso» con \u003ci>zichzelf\u003c/i>. Le altre forme comprendono \u003ci>mezelf/mijzelf\u003c/i>, \u003ci>jezelf\u003c/i>, \u003ci>onszelf\u003c/i> e, con la cortesia, \u003ci>uzelf/zichzelf\u003c/i>. Per anticipare il riflessivo usa una forma forte: \u003ci>zichzelf wast hij\u003c/i>. Non applicare automaticamente questa sostituzione a verbi obbligatoriamente riflessivi come \u003ci>zich vergissen\u003c/i>.\u003c/p>\n\u003ch3>3 · Conserva la cornice verbale\u003c/h3>\u003cp>Con un modale il riflessivo si trova prima dell'infinito: \u003ci>ik wil me wassen\u003c/i>. Il soggetto resta \u003ci>ik\u003c/i>, quindi il pronome è \u003ci>me\u003c/i> anche se l'infinito è lontano. Con un verbo separabile come \u003ci>zich aankleden\u003c/i>, «vestirsi», la principale diventa \u003ci>ik kleed me aan\u003c/i>. Nel passato prossimo molti riflessivi usano \u003ci>hebben\u003c/i>, anche quando l'italiano sceglie essere: \u003ci>ik heb me gewassen\u003c/i>.\u003c/p>\n\u003cp>Non tutte queste costruzioni descrivono letteralmente un'azione su se stessi: \u003ci>zich voelen\u003c/i> significa «sentirsi» e descrive uno stato. Prima individua la persona, poi scegli il pronome richiesto dalla costruzione, infine controlla la coniugazione del verbo. Con parti del corpo è comune il possessivo: \u003ci>ik was mijn handen\u003c/i>, «mi lavo le mani».\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Hij wast hem\u003c/s> → \u003cstrong>hij wast zich\u003c/strong> se intendi «si lava». \u003cs>Wij voelen zich goed.\u003c/s> → \u003cstrong>Wij voelen ons goed.\u003c/strong> \u003cs>Ik ben me gewassen.\u003c/s> → \u003cstrong>Ik heb me gewassen.\u003c/strong>\u003c/p>","keywords":[{"nl":"me","it":"mi, riflessivo"},{"nl":"je","it":"ti o vi, riflessivo"},{"nl":"zich","it":"si, riflessivo"},{"nl":"ons","it":"ci, riflessivo"}],"words":[{"nl":"wassen","it":"lavare"},{"nl":"zich voelen","it":"sentirsi"},{"nl":"zich vergissen","it":"sbagliarsi"},{"nl":"zich herinneren","it":"ricordarsi"},{"nl":"zich aankleden","it":"vestirsi"},{"nl":"zich haasten","it":"affrettarsi"},{"nl":"het gezicht","it":"il viso"},{"nl":"de hand","it":"la mano"}],"vlaanderen":{"text":"Goesting è un termine informale belga per “voglia”. Nei contesti formali è utile distinguere il registro del vocabolo dalla correttezza della costruzione grammaticale.","source":{"label":"Canon van Vlaanderen · goesting","url":"https://www.canonvanvlaanderen.be/events/goesting/"}},"source":"goesting","practiceNote":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich.","grammar":[{"id":"21-g1","type":"fill","prompt":"Completa la frase.","sentence":"Ik was ___.","answer":"me","answers":["me","mij","mezelf","mijzelf"],"it":"Mi lavo.","hint":"Prima persona riflessiva.","note":"Me o mij rinvia a ik; mezelf e mijzelf sottolineano che lavo me stesso."},{"id":"21-g2","type":"mc","prompt":"Completa la frase.","sentence":"Hij wast ___.","answer":"zich","answers":["zich"],"it":"Lui si lava.","hint":"Lava se stesso.","note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich.","options":[{"text":"zich","it":"Nella frase: Lui si lava.","speak":true},{"text":"hem","it":"Un altro uomo.","speak":true},{"text":"me","it":"Me, non lui stesso.","speak":true}],"correct":0},{"id":"21-g3","type":"fill","prompt":"Completa la frase.","sentence":"Wij wassen ___.","answer":"ons","answers":["ons","onszelf"],"it":"Ci laviamo.","hint":"Prima persona plurale.","note":"Ons è la forma neutra; onszelf aggiunge enfasi."},{"id":"21-g4","type":"mc","prompt":"Completa la frase.","sentence":"Jij wast ___.","answer":"je","answers":["je"],"it":"Ti lavi.","hint":"Seconda persona riflessiva.","note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich.","options":[{"text":"je","it":"Nella frase: Ti lavi.","speak":true},{"text":"me","it":"Mi.","speak":true},{"text":"zich","it":"Terza persona.","speak":true}],"correct":0},{"id":"21-g5","type":"fill","prompt":"Completa la frase.","sentence":"Zij voelen ___ goed.","answer":"zich","answers":["zich"],"it":"Loro si sentono bene.","hint":"Soggetto terza persona plurale.","note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich."},{"id":"21-g6","type":"mc","prompt":"Completa la frase.","sentence":"Jullie wassen ___.","answer":"je","answers":["je"],"it":"Vi lavate.","hint":"Seconda persona plurale.","note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich.","options":[{"text":"je","it":"Nella frase: Vi lavate.","speak":true},{"text":"zich","it":"Terza persona.","speak":true},{"text":"ons","it":"Noi.","speak":true}],"correct":0},{"id":"21-g7","type":"fill","prompt":"Completa la frase.","sentence":"Ik wil ___ wassen.","answer":"me","answers":["me","mij","mezelf","mijzelf"],"it":"Voglio lavarmi.","hint":"Il riflessivo dipende da ik.","note":"Con ik: me o mij; con enfasi, mezelf o mijzelf."},{"id":"21-g8","type":"mc","prompt":"Completa la frase.","sentence":"Hij heeft ___ gewassen.","answer":"zich","answers":["zich"],"it":"Lui si è lavato.","hint":"Riflessivo con il soggetto hij.","note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich.","options":[{"text":"zich","it":"Nella frase: Lui si è lavato.","speak":true},{"text":"hem","it":"Un altro uomo.","speak":true},{"text":"ons","it":"Noi.","speak":true}],"correct":0},{"id":"21-g9","type":"fill","prompt":"Completa la frase.","sentence":"U wast ___.","answer":"u","answers":["u","zich","uzelf","zichzelf"],"it":"Lei si lava.","hint":"Riflessivo di cortesia.","note":"Con u sono possibili u e zich; per sottolineare se stesso, uzelf o zichzelf."},{"id":"21-g10","type":"mc","prompt":"Completa la frase.","sentence":"Ik ___ me gewassen.","answer":"heb","answers":["heb"],"it":"Mi sono lavato.","hint":"Ausiliare neerlandese.","note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich.","options":[{"text":"heb","it":"Nella frase: Mi sono lavato.","speak":true},{"text":"ben","it":"L’italiano non determina l’ausiliare.","speak":true},{"text":"heeft","it":"Terza persona.","speak":true}],"correct":0}],"mixed":[{"id":"21-m1","type":"order","prompt":"Ricomponi la frase.","it":"Mi sento bene.","answer":"Ik voel me goed.","answers":["Ik voel me goed.","Ik voel mij goed.","Goed voel ik me.","Goed voel ik mij."],"tiles":[{"text":"Ik","speak":true},{"text":"voel","speak":true},{"text":"me","speak":true},{"text":"goed","speak":true},{"text":"mij","speak":true},{"text":"zichh","speak":false,"distractor":true}],"note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich."},{"id":"21-m2","type":"tr","prompt":"Traduci con le tessere.","it":"Lui si lava.","answer":"Hij wast zich.","answers":["Hij wast zich.","Hij wast zichzelf.","Zichzelf wast hij."],"tiles":[{"text":"Hij","speak":true},{"text":"wast","speak":true},{"text":"zich","speak":true},{"text":"zichzelf","speak":true},{"text":"haasten","speak":true,"distractor":true}],"note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich."},{"id":"21-m3","type":"order","prompt":"Ricomponi la frase.","it":"Ci sbagliamo.","answer":"Wij vergissen ons.","answers":["Wij vergissen ons.","We vergissen ons."],"tiles":[{"text":"Wij","speak":true},{"text":"vergissen","speak":true},{"text":"ons","speak":true},{"text":"We","speak":true},{"text":"onss","speak":false,"distractor":true}],"note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich."},{"id":"21-m4","type":"tr","prompt":"Traduci con le tessere.","it":"Lei si veste.","answer":"Zij kleedt zich aan.","answers":["Zij kleedt zich aan.","Ze kleedt zich aan.","Zij kleedt zichzelf aan.","Ze kleedt zichzelf aan.","Zichzelf kleedt zij aan.","Zichzelf kleedt ze aan."],"tiles":[{"text":"Zij","speak":true},{"text":"kleedt","speak":true},{"text":"zich","speak":true},{"text":"aan","speak":true},{"text":"Ze","speak":true},{"text":"zichzelf","speak":true},{"text":"wassen","speak":true,"distractor":true}],"note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich."},{"id":"21-m5","type":"order","prompt":"Ricomponi la frase.","it":"Mi ricordo quel giorno.","answer":"Ik herinner me die dag.","answers":["Ik herinner me die dag.","Ik herinner mij die dag.","Die dag herinner ik me.","Die dag herinner ik mij."],"tiles":[{"text":"Ik","speak":true},{"text":"herinner","speak":true},{"text":"me","speak":true},{"text":"die","speak":true},{"text":"dag","speak":true},{"text":"mij","speak":true},{"text":"herinnerr","speak":false,"distractor":true}],"note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich."},{"id":"21-m6","type":"tr","prompt":"Traduci con le tessere.","it":"Vi affrettate.","answer":"Jullie haasten je.","answers":["Jullie haasten je.","Jullie haasten jullie."],"tiles":[{"text":"Jullie","speak":true},{"text":"haasten","speak":true},{"text":"je","speak":true},{"text":"jullie","speak":true},{"text":"voelen","speak":true,"distractor":true}],"note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich."},{"id":"21-m7","type":"order","prompt":"Ricomponi la frase.","it":"Ci sentiamo stanchi.","answer":"Wij voelen ons moe.","answers":["Wij voelen ons moe.","We voelen ons moe.","Moe voelen wij ons.","Moe voelen we ons."],"tiles":[{"text":"Wij","speak":true},{"text":"voelen","speak":true},{"text":"ons","speak":true},{"text":"moe","speak":true},{"text":"We","speak":true},{"text":"onss","speak":false,"distractor":true}],"note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich."},{"id":"21-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Mi lavo le mani.","answer":"Ik was mijn handen.","answers":["Ik was mijn handen.","Mijn handen was ik."],"tiles":[{"text":"Ik","speak":true},{"text":"was","speak":true},{"text":"mijn","speak":true},{"text":"handen","speak":true},{"text":"gezicht","speak":true,"distractor":true}],"note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich."},{"id":"21-m9","type":"order","prompt":"Ricomponi la frase.","it":"Lui si è lavato.","answer":"Hij heeft zich gewassen.","answers":["Hij heeft zich gewassen.","Hij heeft zichzelf gewassen.","Zichzelf heeft hij gewassen.","Gewassen heeft hij zich.","Gewassen heeft hij zichzelf."],"tiles":[{"text":"Hij","speak":true},{"text":"heeft","speak":true},{"text":"zich","speak":true},{"text":"gewassen","speak":true},{"text":"zichzelf","speak":true},{"text":"gewassent","speak":false,"distractor":true}],"note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich."},{"id":"21-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Voglio vestirmi.","answer":"Ik wil me aankleden.","answers":["Ik wil me aankleden.","Ik wil mij aankleden.","Ik wil mezelf aankleden.","Ik wil mijzelf aankleden.","Aankleden wil ik me.","Aankleden wil ik mij.","Aankleden wil ik mezelf.","Aankleden wil ik mijzelf.","Mezelf wil ik aankleden.","Mijzelf wil ik aankleden."],"tiles":[{"text":"Ik","speak":true},{"text":"wil","speak":true},{"text":"me","speak":true},{"text":"aankleden","speak":true},{"text":"mij","speak":true},{"text":"mezelf","speak":true},{"text":"mijzelf","speak":true},{"text":"vergissen","speak":true,"distractor":true}],"note":"Il riflessivo concorda con il soggetto: me, je, zich, ons, je, zich."}]},{"id":22,"title":"Een kopje koffie","it":"I diminutivi","group":4,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Un diminutivo può indicare una cosa piccola, ma anche familiarità, attenuazione o una porzione. L'italiano usa suffissi diversi, come «-ino» e «-etto»; il neerlandese ha una famiglia di terminazioni basate su \u003ci>-je\u003c/i>. \u003ci>Een kopje koffie\u003c/i> significa normalmente «una tazzina di caffè», senza dover insistere che sia minuscola. Non leggere quindi ogni diminutivo come un vezzeggiativo infantile.\u003c/p>\n\u003ch3>1 · Cambia l'articolo\u003c/h3>\u003cp>Il diminutivo singolare è neutro e prende \u003ci>het\u003c/i>, anche se il nome di base usa \u003ci>de\u003c/i>. \u003ci>De tafel\u003c/i> diventa \u003ci>het tafeltje\u003c/i>. Al plurale ritorna \u003ci>de\u003c/i>: \u003ci>de tafeltjes\u003c/i>. Questa regola influenza anche dimostrativi e aggettivi: \u003ci>dit kleine tafeltje\u003c/i>, ma \u003ci>een klein tafeltje\u003c/i>. Una nuova terminazione porta quindi con sé una nuova scelta grammaticale.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Base\u003c/th>\u003cth>Diminutivo\u003c/th>\u003cth>Italiano\u003c/th>\u003c/tr>\u003ctr>\u003ctd>het boek\u003c/td>\u003ctd>het boekje\u003c/td>\u003ctd>libretto\u003c/td>\u003c/tr>\u003ctr>\u003ctd>de tafel\u003c/td>\u003ctd>het tafeltje\u003c/td>\u003ctd>tavolino\u003c/td>\u003c/tr>\u003ctr>\u003ctd>de boom\u003c/td>\u003ctd>het boompje\u003c/td>\u003ctd>alberello\u003c/td>\u003c/tr>\u003ctr>\u003ctd>de ring\u003c/td>\u003ctd>het ringetje\u003c/td>\u003ctd>anellino\u003c/td>\u003c/tr>\u003ctr>\u003ctd>de koning\u003c/td>\u003ctd>het koninkje\u003c/td>\u003ctd>piccolo re\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Riconosci le varianti del suffisso\u003c/h3>\u003cp>La terminazione dipende dal suono finale e dall'accento della parola. Trovi \u003ci>-je\u003c/i>, \u003ci>-tje\u003c/i>, \u003ci>-pje\u003c/i>, \u003ci>-etje\u003c/i> e \u003ci>-kje\u003c/i>. Non basta guardare soltanto l'ultima lettera: confronta \u003ci>ringetje\u003c/i> e \u003ci>koninkje\u003c/i>, che hanno una diversa struttura accentuale. Per un principiante è efficace imparare una serie di parole frequenti e riconoscere il modello, consultando la forma quando non sei sicuro.\u003c/p>\n\u003ch3>3 · Usa il plurale e il contesto\u003c/h3>\u003cp>Il plurale del diminutivo prende normalmente \u003ci>-s\u003c/i>: \u003ci>boekjes\u003c/i>, \u003ci>kopjes\u003c/i>. La scelta del diminutivo può rendere una richiesta più familiare, ma non è obbligatoria: una tazza resta una tazza anche senza suffisso. Alcune parole hanno un significato stabilizzato nella forma diminutiva, perciò la traduzione più naturale non contiene sempre «piccolo». \u003ci>Het meisje\u003c/i> significa «la bambina» o «la ragazza»: imparalo come parola intera, con il suo articolo neutro, anche se indica una persona femminile.\u003c/p>\n\u003cp>Negli esercizi viene specificato quando trasformare un nome in diminutivo. Non aggiungerlo a una traduzione libera senza motivo, perché potrebbe cambiare il tono. Per controllare una frase, verifica nell'ordine la forma della parola, l'articolo e l'eventuale aggettivo che la precede.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>De boekje\u003c/s> → \u003cstrong>het boekje\u003c/strong>. \u003cs>Het boekjes\u003c/s> → \u003cstrong>de boekjes\u003c/strong>. \u003cs>Een kleine tafeltje\u003c/s> → \u003cstrong>een klein tafeltje\u003c/strong>, perché è neutro singolare indefinito.\u003c/p>","keywords":[{"nl":"-je","it":"suffisso diminutivo"},{"nl":"-tje","it":"suffisso diminutivo"},{"nl":"-pje","it":"suffisso diminutivo"},{"nl":"-etje","it":"suffisso diminutivo"},{"nl":"-kje","it":"suffisso diminutivo"}],"words":[{"nl":"het kopje","it":"la tazzina"},{"nl":"het boekje","it":"il libretto"},{"nl":"het tafeltje","it":"il tavolino"},{"nl":"het boompje","it":"l’alberello"},{"nl":"het ringetje","it":"l’anellino"},{"nl":"het koninkje","it":"il piccolo re"},{"nl":"het broodje","it":"il panino"},{"nl":"het huisje","it":"la casetta"},{"nl":"groen","it":"verde"},{"nl":"de kop","it":"la tazza"},{"nl":"de boom","it":"l’albero"},{"nl":"de ring","it":"l’anello"},{"nl":"de koning","it":"il re"},{"nl":"het meisje","it":"la bambina, la ragazza"}],"vlaanderen":{"text":"Un vocabolo regionale può appartenere allo standard belga oppure al parlato informale. Qui impariamo i diminutivi dello standard, utilizzabili anche nelle Fiandre.","source":{"label":"Taaladvies · lo standard in Belgio","url":"https://taaladvies.net/wat-is-standaardtaal-algemeen/"}},"source":"standard","practiceNote":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo.","grammar":[{"id":"22-g1","type":"fill","prompt":"Completa la frase.","sentence":"boek → ___","answer":"boekje","answers":["boekje"],"it":"Libro → libretto.","hint":"Diminutivo con je.","note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo."},{"id":"22-g2","type":"mc","prompt":"Completa la frase.","sentence":"___ boekje","answer":"het","answers":["het"],"it":"Il libretto.","hint":"Articolo del diminutivo singolare.","note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo.","options":[{"text":"het","it":"Nella frase: Il libretto.","speak":true},{"text":"de","it":"Non per il singolare diminutivo.","speak":true},{"text":"een","it":"Un, non il.","speak":true}],"correct":0},{"id":"22-g3","type":"fill","prompt":"Completa la frase.","sentence":"tafel → ___","answer":"tafeltje","answers":["tafeltje"],"it":"Tavolo → tavolino.","hint":"Diminutivo con tje.","note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo."},{"id":"22-g4","type":"mc","prompt":"Completa la frase.","sentence":"___ boekjes","answer":"de","answers":["de"],"it":"I libretti.","hint":"Articolo definito plurale.","note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo.","options":[{"text":"de","it" d":"22-g10","type":"mc","prompt":"Completa la frase.","sentence":"___ huisje","answer":"dit","answers":["dit"],"it":"Questa casetta.","hint":"Dimostrativo vicino, neutro singolare.","note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo.","options":[{"text":"dit","it":"Nella frase: Questa casetta.","speak":true},{"text":"deze","it":"Per de o plurale.","speak":true},{"text":"die","it":"Per de o plurale lontano.","speak":true}],"correct":0}],"mixed":[{"id":"22-m1","type":"order","prompt":"Ricomponi la frase.","it":"Voglio una tazzina di caffè.","answer":"Ik wil een kopje koffie.","answers":["Ik wil een kopje koffie.","Een kopje koffie wil ik."],"tiles":[{"text":"Ik","speak":true},{"text":"wil","speak":true},{"text":"een","speak":true},{"text":"kopje","speak":true},{"text":"koffie","speak":true},{"text":"kopjent","speak":false,"distractor":true}],"note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo."},{"id":"22-m2","type":"tr","prompt":"Traduci con le tessere.","it":"Questo libretto è nuovo.","answer":"Dit boekje is nieuw.","answers":["Dit boekje is nieuw.","Nieuw is dit boekje."],"tiles":[{"text":"Dit","speak":true},{"text":"boekje","speak":true},{"text":"is","speak":true},{"text":"nieuw","speak":true},{"text":"broodje","speak":true,"distractor":true}],"note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo."},{"id":"22-m3","type":"order","prompt":"Ricomponi la frase.","it":"Il tavolino è piccolo.","answer":"Het tafeltje is klein.","answers":["Het tafeltje is klein.","Klein is het tafeltje."],"tiles":[{"text":"Het","speak":true},{"text":"tafeltje","speak":true},{"text":"is","speak":true},{"text":"klein","speak":true},{"text":"tafeltjje","speak":false,"distractor":true}],"note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo."},{"id":"22-m4","type":"tr","prompt":"Traduci con le tessere.","it":"Compriamo un panino.","answer":"Wij kopen een broodje.","answers":["Wij kopen een broodje.","We kopen een broodje.","Een broodje kopen wij.","Een broodje kopen we."],"tiles":[{"text":"Wij","speak":true},{"text":"kopen","speak":true},{"text":"een","speak":true},{"text":"broodje","speak":true},{"text":"We","speak":true},{"text":"huisje","speak":true,"distractor":true}],"note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo."},{"id":"22-m5","type":"order","prompt":"Ricomponi la frase.","it":"I libretti sono economici.","answer":"De boekjes zijn goedkoop.","answers":["De boekjes zijn goedkoop.","Goedkoop zijn de boekjes."],"tiles":[{"text":"De","speak":true},{"text":"boekjes","speak":true},{"text":"zijn","speak":true},{"text":"goedkoop","speak":true},{"text":"boekjens","speak":false,"distractor":true}],"note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo."},{"id":"22-m6","type":"tr","prompt":"Traduci con le tessere.","it":"Quella casetta è bella.","answer":"Dat huisje is mooi.","answers":["Dat huisje is mooi.","Mooi is dat huisje."],"tiles":[{"text":"Dat","speak":true},{"text":"huisje","speak":true},{"text":"is","speak":true},{"text":"mooi","speak":true},{"text":"boompje","speak":true,"distractor":true}],"note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo."},{"id":"22-m7","type":"order","prompt":"Ricomponi la frase.","it":"Ho un anellino piccolo.","answer":"Ik heb een klein ringetje.","answers":["Ik heb een klein ringetje.","Een klein ringetje heb ik."],"tiles":[{"text":"Ik","speak":true},{"text":"heb","speak":true},{"text":"een","speak":true},{"text":"klein","speak":true},{"text":"ringetje","speak":true},{"text":"ringetjje","speak":false,"distractor":true}],"note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo."},{"id":"22-m8","type":"tr","prompt":"Traduci con le tessere.","it":"L’alberello è verde.","answer":"Het boompje is groen.","answers":["Het boompje is groen.","Groen is het boompje."],"tiles":[{"text":"Het","speak":true},{"text":"boompje","speak":true},{"text":"is","speak":true},{"text":"groen","speak":true},{"text":"koninkje","speak":true,"distractor":true}],"note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo."},{"id":"22-m9","type":"order","prompt":"Ricomponi la frase.","it":"Questo è un bel tavolino.","answer":"Dit is een mooi tafeltje.","answers":["Dit is een mooi tafeltje.","Een mooi tafeltje is dit."],"tiles":[{"text":"Dit","speak":true},{"text":"is","speak":true},{"text":"een","speak":true},{"text":"mooi","speak":true},{"text":"tafeltje","speak":true},{"text":"tafeltjess","speak":false,"distractor":true}],"note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo."},{"id":"22-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Lui legge il libretto.","answer":"Hij leest het boekje.","answers":["Hij leest het boekje.","Het boekje leest hij."],"tiles":[{"text":"Hij","speak":true},{"text":"leest","speak":true},{"text":"het","speak":true},{"text":"boekje","speak":true},{"text":"kopje","speak":true,"distractor":true}],"note":"Diminutivo singolare: het. Plurale in s: de. Controlla la flessione dell’aggettivo."}]},{"id":23,"title":"Er is nog koffie","it":"La parola er","group":4,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>\u003ci>Er\u003c/i> è una parola breve con più funzioni. Non ha una traduzione italiana unica: può corrispondere a «ci», «ne», «lì» oppure non avere un equivalente separato. Cercare una sola definizione porta fuori strada. È meglio imparare alcune costruzioni frequenti e chiedersi quale ruolo svolge nella frase: presentare qualcosa, riprendere una quantità, richiamare un luogo o sostituire un gruppo con preposizione.\u003c/p>\n\u003ch3>1 · Presenta qualcosa che c'è\u003c/h3>\u003cp>\u003ci>Er is een probleem\u003c/i> significa «c'è un problema». Il nome introdotto è spesso indefinito: stai presentando una nuova informazione. Al plurale usa \u003ci>zijn\u003c/i>: \u003ci>er zijn twee stoelen\u003c/i>. \u003ci>Er\u003c/i> non decide da solo il numero del verbo; guarda il nome. Se un altro gruppo occupa l'inizio, puoi trovare \u003ci>hier is er een probleem\u003c/i>, benché la presenza di \u003ci>er\u003c/i> dipenda anche dal contesto.\u003c/p>\n\u003cp>Per la posizione usa anche \u003ci>liggen\u003c/i>, «essere disteso o posato in orizzontale», e \u003ci>staan\u003c/i>, «stare in piedi o in posizione verticale»: \u003ci>er ligt een boek\u003c/i>, \u003ci>er staan drie fietsen\u003c/i>. Conta anche la posizione normale dell'oggetto: per una bici sulle ruote si usa \u003ci>staan\u003c/i>. Impara \u003ci>ik lig, het boek ligt\u003c/i> e \u003ci>ik sta, de fiets staat\u003c/i>. Nel titolo \u003ci>nog\u003c/i> significa «ancora»: c'è ancora caffè.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Funzione\u003c/th>\u003cth>Struttura\u003c/th>\u003cth>Italiano\u003c/th>\u003c/tr>\u003ctr>\u003ctd>esistenza\u003c/td>\u003ctd>er is koffie\u003c/td>\u003ctd>c'è caffè\u003c/td>\u003c/tr>\u003ctr>\u003ctd>quantità\u003c/td>\u003ctd>ik heb er twee\u003c/td>\u003ctd>ne ho due\u003c/td>\u003c/tr>\u003ctr>\u003ctd>luogo\u003c/td>\u003ctd>ik woon er\u003c/td>\u003ctd>ci abito\u003c/td>\u003c/tr>\u003ctr>\u003ctd>preposizione\u003c/td>\u003ctd>ik wacht erop\u003c/td>\u003ctd>lo aspetto\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Riprendi un nome contato\u003c/h3>\u003cp>Se sai già di cosa parli, puoi evitare di ripetere il nome: alla domanda sui libri rispondi \u003ci>ik heb er drie\u003c/i>, «ne ho tre». Il numero o un'altra espressione di quantità resta presente. Non trattare \u003ci>er\u003c/i> come un sostituto universale di ogni oggetto: \u003ci>ik lees het\u003c/i> e \u003ci>ik heb er drie\u003c/i> hanno strutture diverse.\u003c/p>\n\u003ch3>3 · Riconosci luogo e preposizione\u003c/h3>\u003cp>\u003ci>Er\u003c/i> può richiamare un luogo già noto, con meno enfasi di \u003ci>daar\u003c/i>. In combinazione con una preposizione può riprendere una cosa: \u003ci>erop\u003c/i>, \u003ci>eraan\u003c/i>, \u003ci>ermee\u003c/i>. Impara \u003ci>wachten op\u003c/i>, «aspettare», \u003ci>denken aan\u003c/i>, «pensare a», e \u003ci>rekenen op\u003c/i>, «contare su». \u003ci>Met\u003c/i> diventa \u003ci>mee\u003c/i> in questa costruzione. Se le parti sono vicine si scrivono unite: \u003ci>ik wacht erop\u003c/i>. Si separano quando intervengono altre parole: \u003ci>ik wacht er morgen op\u003c/i>. Per persone, molte costruzioni preferiscono la preposizione con un pronome personale.\u003c/p>\n\u003cp>Questa unità allena soprattutto esistenza e quantità, poi mostra alcuni gruppi preposizionali frequenti. Quando incontri \u003ci>er\u003c/i> all'ascolto, non fermarti a tradurlo isolatamente: aspetta il nome, il numero o la preposizione che completa la struttura.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Er is twee stoelen.\u003c/s> → \u003cstrong>Er zijn twee stoelen.\u003c/strong> \u003cs>Ik heb twee\u003c/s> → \u003cstrong>ik heb er twee\u003c/strong> per «ne ho due». \u003cs>Ermet\u003c/s> → \u003cstrong>ermee\u003c/strong>: la forma della preposizione cambia.\u003c/p>","keywords":[{"nl":"er","it":"ci, ne, lì secondo il contesto"},{"nl":"erop","it":"su ciò, in attesa di ciò"},{"nl":"eraan","it":"a ciò"},{"nl":"ermee","it":"con ciò"},{"nl":"nog","it":"ancora"}],"words":[{"nl":"het probleem","it":"il problema"},{"nl":"de vraag","it":"la domanda"},{"nl":"de plaats","it":"il posto"},{"nl":"de oplossing","it":"la soluzione"},{"nl":"het plan","it":"il piano"},{"nl":"denken","it":"pensare"},{"nl":"rekenen","it":"contare, fare affidamento"},{"nl":"genoeg","it":"abbastanza, sufficiente"},{"nl":"liggen","it":"essere disteso o posato in orizzontale"},{"nl":"staan","it":"stare in piedi, in posizione verticale"}],"vlaanderen":{"text":"Le parole belghe riconosciute come standard sono adatte anche alla comunicazione pubblica in Belgio. :"eraan","speak":true},{"text":"rekenen","speak":true,"distractor":true}],"note":"Er is con singolare; er zijn con plurale. Er riprende il nome quando rimane una quantità. Er + preposizione si scrive unito se non intervengono altre parole."},{"id":"23-m7","type":"order","prompt":"Ricomponi la frase.","it":"Lo aspetto, quel pacco.","answer":"Ik wacht erop.","answers":["Ik wacht erop."],"tiles":[{"text":"Ik","speak":true},{"text":"wacht","speak":true},{"text":"erop","speak":true},{"text":"eropp","speak":false,"distractor":true}],"note":"Er is con singolare; er zijn con plurale. Er riprende il nome quando rimane una quantità. Er + preposizione si scrive unito se non intervengono altre parole."},{"id":"23-m8","type":"tr","prompt":"Traduci con le tessere.","it":"C’è un buon piano.","answer":"Er is een goed plan.","answers":["Er is een goed plan.","Een goed plan is er."],"tiles":[{"text":"Er","speak":true},{"text":"is","speak":true},{"text":"een","speak":true},{"text":"goed","speak":true},{"text":"plan","speak":true},{"text":"probleem","speak":true,"distractor":true}],"note":"Er is con singolare; er zijn con plurale. Er riprende il nome quando rimane una quantità. Er + preposizione si scrive unito se non intervengono altre parole."},{"id":"23-m9","type":"order","prompt":"Ricomponi la frase.","it":"Ci conto.","answer":"Ik reken erop.","answers":["Ik reken erop."],"tiles":[{"text":"Ik","speak":true},{"text":"reken","speak":true},{"text":"erop","speak":true},{"text":"eropp","speak":false,"distractor":true}],"note":"Er is con singolare; er zijn con plurale. Er riprende il nome quando rimane una quantità. Er + preposizione si scrive unito se non intervengono altre parole."},{"id":"23-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Ne abbiamo abbastanza.","answer":"Wij hebben er genoeg.","answers":["Wij hebben er genoeg.","We hebben er genoeg.","Genoeg hebben wij er.","Genoeg hebben we er."],"tiles":[{"text":"Wij","speak":true},{"text":"hebben","speak":true},{"text":"er","speak":true},{"text":"genoeg","speak":true},{"text":"We","speak":true},{"text":"denken","speak":true,"distractor":true}],"note":"Er is con singolare; er zijn con plurale. Er riprende il nome quando rimane una quantità. Er + preposizione si scrive unito se non intervengono altre parole."}]},{"id":24,"title":"In, op, naast","it":"Le preposizioni","group":4,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Le preposizioni collegano persone, cose, luoghi e tempi. Una stessa preposizione italiana può corrispondere a più parole neerlandesi: «a» non si traduce sempre con \u003ci>aan\u003c/i>, né «in» sempre con \u003ci>in\u003c/i>. Parti dalla relazione concreta: sei dentro un luogo, vai verso una destinazione, appoggi qualcosa su una superficie, oppure specifichi un momento? Poi impara le combinazioni fisse con i verbi.\u003c/p>\n\u003ch3>1 · Descrivi lo spazio\u003c/h3>\u003cp>\u003ci>In\u003c/i> indica l'interno, \u003ci>op\u003c/i> il contatto con una superficie, \u003ci>onder\u003c/i> una posizione inferiore, \u003ci>naast\u003c/i> la vicinanza laterale. \u003ci>Tussen\u003c/i> mette qualcosa fra due riferimenti e \u003ci>achter\u003c/i> dietro. Non sono equivalenze assolute con l'italiano, ma immagini utili. Un libro \u003ci>op de tafel\u003c/i> è sul tavolo; un oggetto \u003ci>in de doos\u003c/i> è nella scatola.\u003c/p>\n\u003cp>Con un movimento, \u003ci>over\u003c/i> può indicare l'attraversamento: \u003ci>de bus rijdt over de brug\u003c/i>, «l'autobus attraversa il ponte». Qui \u003ci>over\u003c/i> ha un significato spaziale diverso da quello già incontrato nelle ore. \u003ci>Met\u003c/i> significa «con», mentre \u003ci>zonder\u003c/i> significa «senza»: \u003ci>zonder mijn collega\u003c/i> è «senza il mio collega».\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Relazione\u003c/th>\u003cth>Gruppo\u003c/th>\u003cth>Italiano\u003c/th>\u003c/tr>\u003ctr>\u003ctd>interno\u003c/td>\u003ctd>in de kamer\u003c/td>\u003ctd>nella stanza\u003c/td>\u003c/tr>\u003ctr>\u003ctd>superficie\u003c/td>\u003ctd>op de tafel\u003c/td>\u003ctd>sul tavolo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>destinazione\u003c/td>\u003ctd>naar de school\u003c/td>\u003ctd>verso la scuola\u003c/td>\u003c/tr>\u003ctr>\u003ctd>compagnia\u003c/td>\u003ctd>met de buur\u003c/td>\u003ctd>con il vicino\u003c/td>\u003c/tr>\u003ctr>\u003ctd>provenienza\u003c/td>\u003ctd>uit de stad\u003c/td>\u003ctd>dalla città, originario\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Distingui posizione e movimento\u003c/h3>\u003cp>Per andare verso una destinazione usa spesso \u003ci>naar\u003c/i>; per dire dove ti trovi usa una preposizione di posizione. \u003ci>Ik ga naar huis\u003c/i> significa «vado a casa», mentre \u003ci>ik ben thuis\u003c/i> significa «sono a casa». \u003ci>Bij\u003c/i> può indicare vicinanza o la presenza presso qualcuno: \u003ci>bij de bakker\u003c/i>, «dal panettiere». Non tentare di ricavare queste espressioni dalla sola traduzione delle parole.\u003c/p>\n\u003ch3>3 · Impara tempo e combinazioni\u003c/h3>\u003cp>\u003ci>Om\u003c/i> introduce un orario, \u003ci>op\u003c/i> un giorno, \u003ci>in\u003c/i> un mese o un anno. \u003ci>Voor\u003c/i> e \u003ci>na\u003c/i> collocano prima e dopo. Alcuni verbi richiedono una preposizione specifica: \u003ci>wachten op\u003c/i>, «aspettare», e \u003ci>denken aan\u003c/i>, «pensare a». \u003ci>Denken aan\u003c/i> può richiamare qualcosa alla mente; \u003ci>denken over\u003c/i> può indicare una riflessione attiva su qualcosa. Guarda quindi anche il significato, non soltanto il verbo. L'italiano può non avere una preposizione nello stesso punto, ma in neerlandese resta necessaria.\u003c/p>\n\u003cp>Negli esercizi il significato italiano precisa la relazione, perché più preposizioni potrebbero formare frasi grammaticali con sensi diversi. Una scelta non è sbagliata perché non esiste, ma perché descrive una posizione o un rapporto differente da quello richiesto.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Ik wacht de trein.\u003c/s> → \u003cstrong>Ik wacht op de trein.\u003c/strong> \u003cs>Ik ga in de winkel.\u003c/s> → \u003cstrong>Ik ga naar de winkel.\u003c/strong> per «vado al negozio». \u003cs>Om maandag\u003c/s> → \u003cstrong>op maandag\u003c/strong>.\u003c/p>","keywords":[{"nl":"op","it":"su"},{"nl":"onder","it":"sotto"},{"nl":"naast","it":"accanto"},{"nl":"achter","it":"dietro"},{"nl":"tussen","it":"fra"},{"nl":"bij","it":"presso"},{"nl":"over","it":"attraverso, sopra nel movimento"},{"nl":"zonder","it":"senza"}],"words":[{"nl":"de bus","it":"l’autobus"},{"nl":"de halte","it":"la fermata"},{"nl":"de brug","it":"il ponte"},{"nl":"de bank","it":"la panchina, la banca"},{"nl":"de muur","it":"il muro"},{"nl":"de maandag","it":"il lunedì"},{"nl":"de tuin","it":"il giardino"},{"nl":"de ingang","it":"l’ingresso"}],"vlaanderen":{"text":"Om hoe laat è una domanda standard in Belgio. L’uso di om nella domanda si collega all’orario di un evento, non alla sua durata.","source":{"label":"Team Taaladvies · hoe laat","url":"https://www.vlaanderen.be/team-taaladvies/taaladviezen/hoe-laat-om-hoe-laat-om-welk-uur"}},"source":"hour","practiceNote":"Scegli la preposizione in base alla relazione e alle combinazioni del verbo: wachten op, denken aan.","grammar":[{"id":"24-g1","type":"fill","prompt":"Completa la frase.","sentence":"Het boek ligt ___ de tafel.","answer":"op","answers":["op"],"it":"Il libro è appoggiato sul tavolo.","hint":"Contatto con la superficie.","note":"Scegli la preposizione in base alla relazione e alle combinazioni del verbo: wachten op, denken aan."},{"id":"24-g2","type":"mc","prompt":"Completa la frase.","sentence":"De pen ligt ___ de doos.","answer":"in","answers":["in"],"it":"La penna è nella scatola.","hint":"All’interno.","note":"Scegli la preposizione in base alla relazione e alle combinazioni del verbo: wachten op, denken aan.","options":[{"text":"in","it":"Nella frase: La penna è nella scatola.","speak":true},{"text":"op","i "distractor":true}],"note":"Scegli la preposizione in base alla relazione e alle combinazioni del verbo: wachten op, denken aan."},{"id":"24-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Passeggiamo verso il ponte.","answer":"Wij wandelen naar de brug.","answers":["Wij wandelen naar de brug.","We wandelen naar de brug.","Naar de brug wandelen wij.","Naar de brug wandelen we."],"tiles":[{"text":"Wij","speak":true},{"text":"wandelen","speak":true},{"text":"naar","speak":true},{"text":"de","speak":true},{"text":"brug","speak":true},{"text":"We","speak":true},{"text":"bank","speak":true,"distractor":true}],"note":"Scegli la preposizione in base alla relazione e alle combinazioni del verbo: wachten op, denken aan."}]},{"id":25,"title":"Om te leren","it":"L’infinito con te","group":4,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>In italiano dici «provo a leggere», «decido di partire» e «posso venire». Il neerlandese non riproduce ogni preposizione italiana: alcuni verbi richiedono \u003ci>te\u003c/i> prima dell'infinito, altri no. \u003ci>Ik probeer te lezen\u003c/i> contiene \u003ci>te\u003c/i>, mentre \u003ci>ik kan lezen\u003c/i> non lo contiene. Conviene imparare la costruzione insieme al verbo principale, anziché tradurre «a» o «di» in modo automatico.\u003c/p>\n\u003ch3>1 · Riconosci i verbi che prendono te\u003c/h3>\u003cp>\u003ci>Proberen\u003c/i>, «provare», \u003ci>besluiten\u003c/i>, «decidere», e \u003ci>vergeten\u003c/i>, «dimenticare», possono introdurre un infinito con \u003ci>te\u003c/i>. Nella frase semplice la struttura è \u003ci>ik probeer het boek te lezen\u003c/i>. Il verbo principale si coniuga, mentre \u003ci>te\u003c/i> sta immediatamente prima dell'infinito, salvo il caso particolare dei separabili.\u003c/p>\n\u003cp>Con verbi come \u003ci>proberen\u003c/i> e \u003ci>beloven\u003c/i> puoi anche introdurre il gruppo con \u003ci>om\u003c/i>: \u003ci>ik probeer om te lezen\u003c/i> resta «provo a leggere». Qui \u003ci>om\u003c/i> non esprime uno scopo separato. Non estendere questa possibilità a tutti i verbi: impara per esempio \u003ci>beginnen te lezen\u003c/i>, senza aggiungere \u003ci>om\u003c/i>.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Costruzione\u003c/th>\u003cth>Frase\u003c/th>\u003cth>Italiano\u003c/th>\u003c/tr>\u003ctr>\u003ctd>proberen + te\u003c/td>\u003ctd>ik probeer te leren\u003c/td>\u003ctd>provo a imparare\u003c/td>\u003c/tr>\u003ctr>\u003ctd>modale senza te\u003c/td>\u003ctd>ik wil leren\u003c/td>\u003ctd>voglio imparare\u003c/td>\u003c/tr>\u003ctr>\u003ctd>scopo\u003c/td>\u003ctd>om te leren\u003c/td>\u003ctd>per imparare\u003c/td>\u003c/tr>\u003ctr>\u003ctd>separabile\u003c/td>\u003ctd>om op te staan\u003c/td>\u003ctd>per alzarsi\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Esprimi uno scopo\u003c/h3>\u003cp>\u003ci>Om … te\u003c/i> può introdurre il fine di un'azione: \u003ci>ik kom om te helpen\u003c/i>, «vengo per aiutare». L'oggetto e altre informazioni si inseriscono prima di \u003ci>te\u003c/i>: \u003ci>om het boek te lezen\u003c/i>. In altre costruzioni, come \u003ci>het is moeilijk om te slapen\u003c/i>, \u003ci>om\u003c/i> può essere facoltativo. Le risposte ammesse tengono conto di questa possibilità quando il significato resta uguale.\u003c/p>\n\u003cp>Puoi anticipare tutto lo scopo: \u003ci>om te helpen kom ik\u003c/i>. Con \u003ci>komen\u003c/i> che indica un movimento volontario esiste anche \u003ci>ik kom helpen\u003c/i>, «vengo ad aiutare», senza \u003ci>om te\u003c/i>. Non è una regola per eliminare \u003ci>te\u003c/i> dopo ogni verbo.\u003c/p>\n\u003ch3>3 · Apri il verbo separabile\u003c/h3>\u003cp>Con un separabile, \u003ci>te\u003c/i> si colloca fra particella e verbo: \u003ci>op te staan\u003c/i>, \u003ci>mee te nemen\u003c/i>. Le parti si scrivono separate. Non usare \u003ci>te opstaan\u003c/i>, e non confondere questa costruzione con l'infinito unito dopo un modale. Il riflessivo, se presente, continua a dipendere dal soggetto: \u003ci>ik probeer me die dag te herinneren\u003c/i>, «provo a ricordarmi quel giorno».\u003c/p>\n\u003cp>La distinzione più utile è quindi triplice: modale con infinito senza \u003ci>te\u003c/i>, verbo che richiede \u003ci>te\u003c/i>, e gruppo di scopo con \u003ci>om\u003c/i>. Quando leggi un testo, sottolinea il verbo principale e osserva quali parole introduce. Imparare piccoli gruppi completi è più affidabile di una lista di traduzioni isolate.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Ik probeer lezen.\u003c/s> → \u003cstrong>Ik probeer te lezen.\u003c/strong> \u003cs>Ik kan te komen.\u003c/s> → \u003cstrong>Ik kan komen.\u003c/strong> \u003cs>Om te opstaan\u003c/s> → \u003cstrong>om op te staan\u003c/strong>: la particella precede \u003ci>te\u003c/i>.\u003c/p>","keywords":[{"nl":"te","it":"particella prima dell’infinito"},{"nl":"om","it":"per, introduzione dello scopo"}],"words":[{"nl":"besluiten","it":"decidere"},{"nl":"vergeten","it":"dimenticare"},{"nl":"beloven","it":"promettere"},{"nl":"beginnen","it":"cominciare"},{"nl":"hopen","it":"sperare"},{"nl":"het doel","it":"l’obiettivo"},{"nl":"de cursus","it":"il corso"},{"nl":"de taal","it":"la lingua"},{"nl":"volgen","it":"seguire"}],"vlaanderen":{"text":"Goesting è una parola informale belga legata a voglia e desiderio. Negli esercizi manteniamo costruzioni standard con verbi come hopen e proberen.","source":{"label":"Canon van Vlaanderen · goesting","url":"https://www.canonvanvlaanderen.be/events/goesting/"}},"source":"goesting","practiceNote":"Te precede l’infinito; nei separabili entra fra particella e verbo. Om può introdurre lo scopo.","grammar":[{"id":"25-g1","type":"fill","prompt":"Completa la frase.","sentence":"Ik probeer om ___ lezen.","answer":"te","answers":["te"],"it":"Provo a leggere.","hint":"Completa il gruppo infinitivo dopo om con una parola.","note":"Te precede l’infinito; nei separabili entra fra particella e verbo. Om può introdurre lo scopo."},{"id":"25-g2","t
