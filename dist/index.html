  <script>
  'use strict';
  const UNITS=[{"id":1,"title":"Ik, jij, wij","it":"I pronomi soggetto","group":0,"explanation":"\u003ch2>L'idea\u003c/h2>\n\u003cp>In italiano possiamo dire «sono pronto» senza nominare chi parla. In neerlandese una frase dichiarativa completa ha normalmente un soggetto espresso: \u003cb>ik ben klaar\u003c/b>. Il pronome non è un'aggiunta enfatica, ma una parte della struttura. Pensa alla coppia soggetto e verbo come al nucleo della frase: prima individua la persona, poi scegli la forma verbale. In questa unità usiamo soprattutto \u003ci>zijn\u003c/i>, essere, per presentarsi e descrivere uno stato.\u003c/p>\n\u003ch3>1 · Scegli la persona\u003c/h3>\n\u003cp>\u003ci>Ik\u003c/i> indica chi parla; \u003ci>jij\u003c/i> chi ascolta; \u003ci>hij\u003c/i> un uomo e \u003ci>zij\u003c/i> una donna. \u003ci>Het\u003c/i> può riprendere un nome neutro oppure introdurre un'espressione impersonale. Per più persone trovi \u003ci>wij\u003c/i>, \u003ci>jullie\u003c/i> e \u003ci>zij\u003c/i>. La stessa parola \u003ci>zij\u003c/i> significa dunque «lei» o «loro»: la forma del verbo e il contesto chiariscono il numero.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Persona\u003c/th>\u003cth>Con zijn\u003c/th>\u003cth>Italiano\u003c/th>\u003c/tr>\u003ctr>\u003ctd>ik\u003c/td>\u003ctd>ik ben\u003c/td>\u003ctd>io sono\u003c/td>\u003c/tr>\u003ctr>\u003ctd>jij / je, u\u003c/td>\u003ctd>jij bent, u bent\u003c/td>\u003ctd>tu sei, Lei è\u003c/td>\u003c/tr>\u003ctr>\u003ctd>hij, zij / ze, het\u003c/td>\u003ctd>hij is\u003c/td>\u003ctd>lui è\u003c/td>\u003c/tr>\u003ctr>\u003ctd>wij / we, jullie, zij / ze\u003c/td>\u003ctd>wij zijn\u003c/td>\u003ctd>noi siamo\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Riconosci le forme brevi\u003c/h3>\n\u003cp>\u003ci>Je, ze\u003c/i> e \u003ci>we\u003c/i> sono forme non accentate, frequentissime nel parlato. Non sono abbreviazioni scorrette. \u003ci>Wij\u003c/i> mette più facilmente in contrasto «noi» con altre persone, mentre \u003ci>we\u003c/i> è naturale quando il soggetto non porta un accento particolare. Quando l'esercizio non impone un contrasto, entrambe le forme sono accettate. Nella scrittura informale puoi incontrare anche \u003ci>’k\u003c/i> per \u003ci>ik\u003c/i>; qui usiamo \u003ci>ik\u003c/i> come modello. Non confondere però una forma breve con l'assenza del soggetto: il pronome resta presente.\u003c/p>\n\u003ch3>3 · Rivolgiti a qualcuno\u003c/h3>\n\u003cp>La forma di cortesia è \u003ci>u\u003c/i>, anche quando parli a un uomo: non tradurre il «Lei» italiano con \u003ci>zij\u003c/i>. Nel neerlandese attuale usa \u003ci>u bent\u003c/i>; \u003ci>u is\u003c/i> è antiquato. \u003ci>Jullie\u003c/i> è il plurale informale, corrispondente a «voi». I nomi propri, come Nora e Milan, possono sostituire il pronome. Dire \u003ci>Nora is klaar\u003c/i> significa «Nora è pronta»; riprendendola userai \u003ci>zij\u003c/i> o \u003ci>ze\u003c/i>. L'aggettivo dopo essere non cambia con il genere della persona.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\n\u003cp>\u003cs>Ben klaar.\u003c/s> → \u003cstrong>Ik ben klaar.\u003c/strong> Nella frase completa conserva il soggetto. \u003cs>Zij bent klaar.\u003c/s> → \u003cstrong>Zij is klaar.\u003c/strong> Per «lei» singolare serve \u003ci>is\u003c/i>. Per «Lei è pronto», rivolto cortesemente all'interlocutore, scrivi \u003cstrong>U bent klaar.\u003c/strong>\u003c/p>","keywords":[{"nl":"ik","it":"io"},{"nl":"jij","it":"tu"},{"nl":"u","it":"Lei di cortesia"},{"nl":"hij","it":"lui"},{"nl":"zij","it":"lei o loro"},{"nl":"het","it":"esso, soggetto neutro"},{"nl":"wij","it":"noi"},{"nl":"jullie","it":"voi"}],"words":[{"nl":"zijn","it":"essere"},{"nl":"klaar","it":"pronto"},{"nl":"moe","it":"stanco"},{"nl":"blij","it":"contento"},{"nl":"rustig","it":"tranquillo"},{"nl":"de man","it":"l’uomo"},{"nl":"de vrouw","it":"la donna"},{"nl":"de collega","it":"il collega, la collega"}],"vlaanderen":{"text":"In molte zone del Belgio sentirai ge/gij come forma informale di “tu”. Qui esercitiamo je/jij e u, le forme usuali dello standard.","source":{"label":"Team Taaladvies · gij/ge","url":"https://www.vlaanderen.be/team-taaladvies/taaladviezen/gij-ge-gebruik"}},"source":"gij","practiceNote":"Il soggetto va espresso; scegli ben, bent, is o zijn in base alla persona.","grammar":[{"id":"1-g1","type":"fill","prompt":"Completa la frase.","sentence":"___ ben klaar.","answer":"Ik","answers":["Ik","'k"],"it":"Sono pronto.","hint":"Chi parla in prima persona?","note":"Con ben il soggetto è ik; nella scrittura informale puoi incontrare anche ’k."},{"id":"1-g2","type":"mc","prompt":"Completa la frase.","sentence":"___ bent moe.","answer":"Jij","answers":["Jij","Je"],"it":"Sei stanco.","hint":"Forma informale singolare.","note":"Jij e je sono forme del soggetto informale singolare.","options":[{"text":"Jij","it":"Nella frase: Sei stanco.","speak":true},{"text":"Ik","it":"Io: richiederebbe ben.","speak":true},{"text":"Hij","it":"Lui: richiederebbe is.","speak":true}],"correct":0},{"id":"1-g3","type":"fill","prompt":"Completa la frase.","sentence":"___ zijn blij.","answer":"Wij","answers":["Wij","We"],"it":"Siamo contenti.","hint":"Prima persona plurale.","note":"Wij e we indicano noi."},{"id":"1-g4","type":"mc","prompt":"Completa la frase.","sentence":"___ is rustig.","answer":"Hij","answers":["Hij"],"it":"Lui è tranquillo.","hint":"Uomo di cui parli.","note":"Hij indica lui.","options":[{"text":"Hij","it":"Nella frase: Lui è tranquillo.","speak":true},{"text":"Jij","it":"Tu: richiederebbe bent.","speak":true},{"text":"Wij","it":"Noi: richiederebbe zijn.","speak":true}],"correct":0},{"id":"1-g5","type":"fill","prompt":"Completa la frase.","sentence":"___ bent klaar.","answer":"U","answers":["U"],"it":"Lei è pronto.","hint":"Ti rivolgi cortesemente a una persona.","note":"U è il pronome di cortesia."},{"id":"1-g6","type":"mc","prompt":"Completa la frase.","sentence":"___ zijn moe.","answer":"Jullie","answers":["Jullie"],"it":"Voi siete stanchi.","hint":"Parli a più persone informalmente.","note":"Jullie significa voi.","options":[{"text":"Jullie","it":"Nella frase: Voi siete stanchi.","speak":true},{"text":"Ik","it":"Io: è singolare.","speak":true},{"text":"Hij","it":"Lui: è singolare.","speak":true}],"correct":0},{"id":"1-g7","type":"fill","prompt":"Completa la frase.","sentence":"___ is blij.","answer":"Zij","answers":["Zij","Ze"],"it":"Lei è contenta.","hint":"Donna di cui stai parlando.","note":"Zij o ze con is indica lei."},{"id":"1-g8","type":"mc","prompt":"Completa la frase.","sentence":"Ik ___ rustig.","answer":"ben","answers":["ben"],"it":"Sono tranquillo.","hint":"Essere, prima persona singolare.","note":"Ik si combina con ben.","options":[{"text":"ben","it":"Nella frase: Sono tranquillo.","speak":true},{"text":"is","it":"È: terza persona.","speak":true},{"text":"zijn","it":"Essere o siamo/sono plurale.","speak":true}],"correct":0},{"id":"1-g9","type":"fill","prompt":"Completa la frase.","sentence":"We ___ klaar.","answer":"zijn","answers":["zijn"],"it":"Siamo pronti.","hint":"Essere, prima persona plurale.","note":"We richiede zijn."},{"id":"1-g10","type":"mc","prompt":"Completa la frase.","sentence":"De vrouw ___ moe.","answer":"is","answers":["is"],"it":"La donna è stanca.","hint":"Un soggetto singolare.","note":"Un nome singolare richiede is.","options":[{"text":"is","it":"Nella frase: La donna è stanca.","speak":true},{"text":"ben","it":"Solo con ik.","speak":true},{"text":"zijn","it":"Forma plurale.","speak":true}],"correct":0}],"mixed":[{"id":"1-m1","type":"order","prompt":"Ricomponi la frase.","it":"Sono pronto.","answer":"Ik ben klaar.","answers":["Ik ben klaar.","Klaar ben ik."],"tiles":[{"text":"Ik","speak":true},{"text":"ben","speak":true},{"text":"klaar","speak":true},{"text":"bentt","speak":false,"distractor":true}],"note":"Il soggetto va espresso; scegli ben, bent, is o zijn in base alla persona."},{"id":"1-m2","type":"tr","prompt":"Traduci con le tessere.","it":"Sei stanco.","an ben, bent, is o zijn in base alla persona."},{"id":"1-m7","type":"order","prompt":"Ricomponi la frase.","it":"Loro sono stanchi.","answer":"Zij zijn moe.","answers":["Zij zijn moe.","Ze zijn moe.","Moe zijn zij.","Moe zijn ze."],"tiles":[{"text":"Zij","speak":true},{"text":"zijn","speak":true},{"text":"moe","speak":true},{"text":"Ze","speak":true},{"text":"benn","speak":false,"distractor":true}],"note":"Il soggetto va espresso; scegli ben, bent, is o zijn in base alla persona."},{"id":"1-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Lei è contento.","answer":"U bent blij.","answers":["U bent blij.","Blij bent u."],"tiles":[{"text":"U","speak":true},{"text":"bent","speak":true},{"text":"blij","speak":true},{"text":"rustig","speak":true,"distractor":true}],"note":"Il soggetto va espresso; scegli ben, bent, is o zijn in base alla persona."},{"id":"1-m9","type":"order","prompt":"Ricomponi la frase.","it":"L’uomo è stanco.","answer":"De man is moe.","answers":["De man is moe.","Moe is de man."],"tiles":[{"text":"De","speak":true},{"text":"man","speak":true},{"text":"is","speak":true},{"text":"moe","speak":true},{"text":"zijnt","speak":false,"distractor":true}],"note":"Il soggetto va espresso; scegli ben, bent, is o zijn in base alla persona."},{"id":"1-m10","type":"tr","prompt":"Traduci con le tessere.","it":"La donna è pronta.","answer":"De vrouw is klaar.","answers":["De vrouw is klaar.","Klaar is de vrouw."],"tiles":[{"text":"De","speak":true},{"text":"vrouw","speak":true},{"text":"is","speak":true},{"text":"klaar","speak":true},{"text":"blij","speak":true,"distractor":true}],"note":"Il soggetto va espresso; scegli ben, bent, is o zijn in base alla persona."}]},{"id":2,"title":"Ik werk, jij werkt","it":"Il presente","group":0,"explanation":"\u003ch2>L'idea\u003c/h2>\n\u003cp>Il presente neerlandese serve per abitudini, fatti attuali e, con un'indicazione temporale, programmi futuri. Non corrisponde soltanto a ciò che succede proprio adesso. Rispetto all'italiano le desinenze sono poche, ma il soggetto deve restare visibile. Per costruire una frase come \u003ci>ik werk\u003c/i>, «lavoro», parti dall'infinito \u003ci>werken\u003c/i> e individua la radice. Il presente non richiede un verbo ausiliare aggiuntivo.\u003c/p>\n\u003ch3>1 · Trova la radice\u003c/h3>\n\u003cp>In molti verbi togli \u003ci>-en\u003c/i>: \u003ci>werken\u003c/i> diventa \u003ci>werk\u003c/i>. La grafia della radice può però cambiare per conservare il suono. Da \u003ci>wonen\u003c/i> ottieni \u003ci>woon\u003c/i>, con due vocali nella sillaba chiusa; da \u003ci>maken\u003c/i> ottieni \u003ci>maak\u003c/i>. Da \u003ci>zitten\u003c/i> ricavi \u003ci>zit\u003c/i>, senza raddoppiare la consonante finale. Impara quindi insieme infinito e forma con \u003ci>ik\u003c/i>, senza applicare un semplice taglio meccanico.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Soggetto\u003c/th>\u003cth>Regola regolare\u003c/th>\u003cth>Forma\u003c/th>\u003c/tr>\u003ctr>\u003ctd>ik\u003c/td>\u003ctd>radice\u003c/td>\u003ctd>werk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>jij, hij, zij, u\u003c/td>\u003ctd>radice + t\u003c/td>\u003ctd>werkt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>wij, jullie, zij plurale\u003c/td>\u003ctd>infinito\u003c/td>\u003ctd>werken\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Controlla persona e numero\u003c/h3>\n\u003cp>\u003ci>Hij woont hier\u003c/i> significa «lui abita qui», mentre \u003ci>wij wonen hier\u003c/i> significa «noi abitiamo qui». Con \u003ci>wonen\u003c/i> indica il luogo: \u003ci>hier\u003c/i> significa «qui». Un nome singolare usa normalmente la stessa forma di \u003ci>hij\u003c/i>: \u003ci>Nora werkt\u003c/i>. Se la radice termina già in \u003ci>t\u003c/i>, non aggiungere una seconda lettera: \u003ci>zitten\u003c/i> dà \u003ci>hij zit\u003c/i>. La forma verbale va scelta dopo aver capito il soggetto, anche quando la frase contiene un altro nome.\u003c/p>\n\u003ch3>3 · Impara le forme frequenti\u003c/h3>\n\u003cp>\u003ci>Zijn\u003c/i>, essere, è irregolare e l'hai già incontrato. Anche \u003ci>hebben\u003c/i>, avere, va imparato: \u003ci>ik heb\u003c/i>, \u003ci>jij hebt\u003c/i>, \u003ci>hij heeft\u003c/i>, \u003ci>wij hebben\u003c/i>. Con \u003ci>u\u003c/i> sono corrette sia \u003ci>hebt\u003c/i> sia \u003ci>heeft\u003c/i>. Come modello usiamo il soggetto prima del verbo. Nelle domande o dopo un elemento anticipato il soggetto può seguire il verbo: \u003ci>hier woon je\u003c/i>, «qui abiti tu». Con \u003ci>jij/je\u003c/i> dopo il verbo cade la \u003ci>t\u003c/i> aggiunta alla radice, ma resta quella che appartiene alla radice stessa.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\n\u003cp>\u003cs>Ik werken.\u003c/s> → \u003cstrong>Ik werk.\u003c/strong> Non usare l'infinito con \u003ci>ik\u003c/i>. \u003cs>Hij woon.\u003c/s> → \u003cstrong>Hij woont.\u003c/strong> Alla terza persona serve la terminazione. \u003cs>Wij werkt.\u003c/s> → \u003cstrong>Wij werken.\u003c/strong> La forma plurale coincide con l'infinito.\u003c/p>","keywords":[{"nl":"ben","it":"sono, con ik"},{"nl":"bent","it":"sei, è con u"},{"nl":"is","it":"è"},{"nl":"zijn","it":"essere; siamo, siete, sono"},{"nl":"heb","it":"ho"},{"nl":"hebt","it":"hai, ha con u"},{"nl":"heeft","it":"ha"},{"nl":"hebben","it":"avere; abbiamo, avete, hanno"}],"words":[{"nl":"werken","it":"lavorare"},{"nl":"wonen","it":"abitare"},{"nl":"leren","it":"imparare"},{"nl":"maken","it":"fare, creare"},{"nl":"koken","it":"cucinare"},{"nl":"drinken","it":"bere"},{"nl":"de koffie","it":"il caffè"},{"nl":"het water","it":"l’acqua"},{"nl":"hier","it":"qui"}],"vlaanderen":{"text":"Ge/gij appartiene al parlato informale di molte zone belghe e ha proprie forme verbali. Qui usa le persone dello standard indicate nella frase.","source":{"label":"Team Taaladvies · gij/ge","url":"https://www.vlaanderen.be/team-taaladvies/taaladviezen/gij-ge-gebruik"}},"source":"gij","practiceNote":"Nel presente regolare: ik + radice, singolare + t, plurale + infinito. eert.","answers":["Hij leert."],"tiles":[{"text":"Hij","speak":true},{"text":"leert","speak":true},{"text":"leerent","speak":false,"distractor":true}],"note":"Nel presente regolare: ik + radice, singolare + t, plurale + infinito."},{"id":"2-m4","type":"tr","prompt":"Traduci con le tessere.","it":"Cuciniamo.","answer":"Wij koken.","answers":["Wij koken.","We koken."],"tiles":[{"text":"Wij","speak":true},{"text":"koken","speak":true},{"text":"We","speak":true},{"text":"werken","speak":true,"distractor":true}],"note":"Nel presente regolare: ik + radice, singolare + t, plurale + infinito."},{"id":"2-m5","type":"order","prompt":"Ricomponi la frase.","it":"Bevo acqua.","answer":"Ik drink water.","answers":["Ik drink water.","Water drink ik."],"tiles":[{"text":"Ik","speak":true},{"text":"drink","speak":true},{"text":"water","speak":true},{"text":"drinktt","speak":false,"distractor":true}],"note":"Nel presente regolare: ik + radice, singolare + t, plurale + infinito."},{"id":"2-m6","type":"tr","prompt":"Traduci con le tessere.","it":"Lei beve caffè.","answer":"Zij drinkt koffie.","answers":["Zij drinkt koffie.","Ze drinkt koffie.","Koffie drinkt zij.","Koffie drinkt ze."],"tiles":[{"text":"Zij","speak":true},{"text":"drinkt","speak":true},{"text":"koffie","speak":true},{"text":"Ze","speak":true},{"text":"water","speak":true,"distractor":true}],"note":"Nel presente regolare: ik + radice, singolare + t, plurale + infinito."},{"id":"2-m7","type":"order","prompt":"Ricomponi la frase.","it":"Voi fate il caffè.","answer":"Jullie maken koffie.","answers":["Jullie maken koffie.","Koffie maken jullie."],"tiles":[{"text":"Jullie","speak":true},{"text":"maken","speak":true},{"text":"koffie","speak":true},{"text":"makent","speak":false,"distractor":true}],"note":"Nel presente regolare: ik + radice, singolare + t, plurale + infinito."},{"id":"2-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Ho acqua.","answer":"Ik heb water.","answers":["Ik heb water.","Water heb ik."],"tiles":[{"text":"Ik","speak":true},{"text":"heb","speak":true},{"text":"water","speak":true},{"text":"koffie","speak":true,"distractor":true}],"note":"Nel presente regolare: ik + radice, singolare + t, plurale + infinito."},{"id":"2-m9","type":"order","prompt":"Ricomponi la frase.","it":"Lui ha caffè.","answer":"Hij heeft koffie.","answers":["Hij heeft koffie.","Koffie heeft hij."],"tiles":[{"text":"Hij","speak":true},{"text":"heeft","speak":true},{"text":"koffie","speak":true},{"text":"hebbt","speak":false,"distractor":true}],"note":"Nel presente regolare: ik + radice, singolare + t, plurale + infinito."},{"id":"2-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Abbiamo acqua.","answer":"Wij hebben water.","answers":["Wij hebben water.","We hebben water.","Water hebben wij.","Water hebben we."],"tiles":[{"text":"Wij","speak":true},{"text":"hebben","speak":true},{"text":"water","speak":true},{"text":"We","speak":true},{"text":"koffie","speak":true,"distractor":true}],"note":"Nel presente regolare: ik + radice, singolare + t, plurale + infinito."}]},{"id":3,"title":"De, het, een","it":"Gli articoli","group":0,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>L'italiano distingue il, lo, la e altre forme; il neerlandese usa soprattutto \u003ci>de\u003c/i> e \u003ci>het\u003c/i>. Non puoi prevedere l'articolo traducendo il genere italiano: «la casa» è \u003ci>het huis\u003c/i>, mentre «il libro» è \u003ci>het boek\u003c/i>. Imparare un nome senza articolo significa lasciare incompleta una parte utile della parola. Nelle schede, pronuncia sempre insieme articolo e nome, anche quando una traduzione italiana sembra suggerire il contrario.\u003c/p>\n\u003ch3>1 · Distingui definito e indefinito\u003c/h3>\u003cp>\u003ci>De\u003c/i> e \u003ci>het\u003c/i> indicano qualcosa di identificabile: la bici di cui stiamo parlando, il libro sul tavolo. \u003ci>Een\u003c/i> introduce invece un esemplare non ancora identificato, come «un» o «una». La sua forma è identica davanti a tutti i nomi singolari numerabili. Non aggiungere apostrofi davanti alle vocali: \u003ci>een appel\u003c/i> resta scritto con due parole intere.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Tipo\u003c/th>\u003cth>Definito\u003c/th>\u003cth>Indefinito\u003c/th>\u003c/tr>\u003ctr>\u003ctd>nome de\u003c/td>\u003ctd>de fiets, la bici\u003c/td>\u003ctd>een fiets, una bici\u003c/td>\u003c/tr>\u003ctr>\u003ctd>nome het\u003c/td>\u003ctd>het huis, la casa\u003c/td>\u003ctd>een huis, una casa\u003c/td>\u003c/tr>\u003ctr>\u003ctd>plurale\u003c/td>\u003ctd>de boeken, i libri\u003c/td>\u003ctd>boeken, dei libri\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Conserva l'articolo nel vocabolario\u003c/h3>\u003cp>Esistono regolarità, ma non una formula universale capace di assegnare l'articolo a ogni nome. I diminutivi singolari usano \u003ci>het\u003c/i>; i plurali definiti usano \u003ci>de\u003c/i>. Vedrai queste forme nelle unità successive. Per ora associa \u003ci>de fiets\u003c/i> a un'unica scheda mentale. Quando incontri \u003ci>een fiets\u003c/i>, il nome resta un nome di tipo \u003ci>de\u003c/i>: l'articolo indefinito non cancella la sua categoria grammaticale.\u003c/p>\n\u003ch3>3 · Non mettere un articolo dappertutto\u003c/h3>\u003cp>Un nome di sostanza può comparire senza articolo quando indica una quantità generica: \u003ci>ik drink water\u003c/i>, «bevo acqua». Con un riferimento specifico puoi dire \u003ci>het water\u003c/i>, «l'acqua». Non esiste una traduzione automatica di «del» o «dei»: spesso il neerlandese non aggiunge niente. La scelta dipende da cosa stai indicando, non soltanto dal nome. Negli esercizi leggi se viene chiesto l'articolo definito: questo evita di confondere una risposta grammaticalmente possibile con il significato richiesto.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>De huis\u003c/s> → \u003cstrong>het huis\u003c/strong>. Il genere italiano non decide l'articolo. \u003cs>Het fiets\u003c/s> → \u003cstrong>de fiets\u003c/strong>. \u003cs>Een water\u003c/s> → \u003cstrong>water\u003c/strong> quando parli della sostanza in generale, senza sottintendere un bicchiere o una bottiglia.\u003c/p>","keywords":[{"nl":"de","it":"articolo definito comune e plurale"},{"nl":"het","it":"articolo definito neutro"},{"nl":"een","it":"un, una"}],"words":[{"nl":"de fiets","it":"la bici"},{"nl":"het huis","it":"la casa"},{"nl":"het boek","it":"il libro"},{"nl":"de tafel","it":"il tavolo"},{"nl":"de stoel","it":"la sedia"},{"nl":"de appel","it":"la mela"},{"nl":"het brood","it":"il pane"},{"nl":"het raam","it":"la finestra"}],"vlaanderen":{"text":"Lo standard usato in Belgio comprende anche parole regionali riconosciute. Questo non permette di ricavare de o het dalla traduzione italiana: registra sempre l’articolo con il nome.","source":{"label":"Taaladvies · lo standard in Belgio","url":"https://taaladvies.net/wat-is-standaardtaal-algemeen/"}},"source":"standard","practiceNote":"De e het dipendono dal nome; een è identico per entrambi i tipi.","grammar":[{"id":"3-g1","type":"fill","prompt":"Completa la frase.","sentence":"___ huis","answer":"het","answers":["het"],"it":"La casa.","hint":"Articolo definito del nome neutro.","note":"Huis è un nome het."},{"id":"3-g2","type":"mc","prompt":"Completa la frase.","sentence":"___ fiets","answer":"de","answers":["de"],"it":"La bici.","hint":"Articolo definito.","note":"Si impara de fiets.","options":[{"text":"de","it":"Nella frase: La bici.","speak":true},{"text":"het","it":"Non è l’articolo di fiets.","speak":true},{"text":"een","it":"Una, non la.","speak":true}],"correct":0},{"id":"3-g3","type":"fill","prompt":"Completa la frase.","sentence":"___ boek","answer":"het","answers":["het"],"it":"Il libro.","hint":"Articolo definito neutro.","note":"Boek è neutro."},{"id":"3-g4","type":"mc","prompt":"Completa la frase.","sentence":"___ tafel","answer":"de","answers":["de"],"it":"Il tavolo.","hint":"Articolo definito.","note":"Tafel usa de.","options":[{"text":"de","it":"Nella frase: Il tavolo.","speak":true},{"text":"het","it":"Tafel non è neutro.","speak":true},{"text":"een","it":"Un tavolo.","speak":true}],"correct":0},{"id":"3-g5","type":"fill","prompt":"Completa la frase.","sentence":"___ stoel","answer":"de","answers":["de"],"it":"La sedia.","hint":"Articolo definito.","note":"Stoel usa de."},{"id":"3-g6","type":"mc","prompt":"Completa la frase.","sentence":"___ appel","answer":"een","answers":["een"],"it":"Una mela.","hint":"Articolo indefinito.","note":"Een vale sia un sia una.","options":[{"text":"een","it":"Nella frase: Una mela.","speak":true},{"text":"de","it":"La mela.","speak":true},{"text":"het","it":"Articolo neutro, qui errato.","speak":true}],"correct":0},{"id":"3-g7","type":"fill","prompt":"Completa la frase.","sentence":"___ brood","answer":"het","answers":["het"],"it":"Il pane.","hint":"Articolo definito neutro.","note":"Brood usa het."},{"id":"3-g8","type":"mc","prompt":"Completa la frase.","sentence":"___ raam","answer":"het","answers":["het"],"it":"La finestra.","hint":"Articolo definito.","note":"Raam è un nome het.","options":[{"text":"het","it":"Nella frase: La finestra.","speak":true},{"text":"de","it":"Non è l’articolo di raam.","speak":true},{"text":"een","it":"Una finestra.","speak":true}],"correct":0},{"id":"3-g9","type":"fill","prompt":"Completa la frase.","sentence":"___ huis","answer":"een","answers":["een"],"it":"Una casa.","hint":"Articolo indefinito.","note":"Een non cambia davanti ai nomi neutri."},{"id":"3-g10","type":"mc","prompt":"Completa la frase.","sentence":"___ appel","answer":"de","answers":["de"],"it":"La mela.","hint":"Articolo definito.","note":"Appel usa de.","options":[{"text":"de","it":"Nella frase: La mela.","speak":true},{"text":"het","it":"Appel non è un nome het.","speak":true},{"text":"een","it":"Una mela.","speak":true}],"correct":0}],"mixed":[{"id":"3-m1","type":"order","prompt":"Ricomponi la frase.","it":"Ho una bici.","answer":"Ik heb een fiets.","answers":["Ik heb een fiets.","Een fiets heb ik."],"tiles":[{"text":"Ik","speak":true},{"text":"heb","speak":true},{"text":"een","speak":true},{"text":"fiets","speak":true},{"text":"eenn","speak":false,"distractor":true}],"note":"De e het dipendono dal nome; een è identico per entrambi i tipi."},{"id":"3-m2","type":"tr","prompt":"Traduci con le tessere.","it":"Lui ha il libro.","answer":"Hij heeft het boek.","answers":["Hij heeft het boek.","Het boek heeft hij."],"tiles":[{"text":"Hij","speak":true},{"text":"heeft","speak":true},{"text":"het","speak":true},{"text":"boek","speak":true},{"text":"huis","speak":true,"distractor":true}],"note":"De e het dipendono dal nome; een è identico per entrambi i tipi."},{"id":"3-m3","type":"order","prompt":"Ricomponi la frase.","it":"Lei ha la mela.","answer":"Zij heeft de appel.","answers":["Zij heeft de appel.","Ze heeft de appel.","De appel heeft zij.","De appel heeft ze."],"tiles":[{"text":"Zij","speak":true},{"text":"heeft","speak":true},{"text":"de","speak":true},{"text":"appel","speak":true},{"text":"Ze","speak":true},{"text":"hett","speak":false,"distractor":true}],"note":"De e het dipendono dal nome; een è identico per entrambi i tipi."},{"id":"3-m4","type":"tr","prompt":"Traduci con le tessere.","it":"Abbiamo un tavolo.","answer":"Wij hebben een tafel.","answers":["Wij hebben een tafel.","We hebben een tafel.","Een tafel hebben wij.","Een tafel hebben we."],"tiles":[{"text":"Wij","speak":true},{"text":"hebben","speak":true},{"text":"een","speak":true},{"text":"tafel","speak":true},{"text":"We","speak":true},{"text":"stoel","speak":true,"distractor":true}],"note":"De e het dipendono dal nome; een è identico per entrambi i tipi."},{"id":"3-m5","type":"order","prompt":"Ricomponi la frase.","it":"Ho il pane.","answer":"Ik heb het brood.","answers":["Ik heb het brood.","Het brood heb ik."],"tiles":[{"text":"Ik","speak":true},{"text":"heb","speak":true},{"text":"het","speak":true},{"text":"brood","speak":true},{"text":"deee","speak":false,"distractor":true}],"note":"De e het dipendono dal nome; een è identico per entrambi i tipi."},{"id":"3-m6","type":"tr","prompt":"Traduci con le tessere.","it":"Hai una sedia.","answer":"Jij hebt een stoel.","answers":["Jij hebt een stoel.","Je hebt een stoel.","Een stoel heb jij.","Een stoel heb je."],"tiles":[{"text":"Jij","speak":true},{"text":"hebt","speak":true},{"text":"een","speak":true},{"text":"stoel","speak":true},{"text":"Je","speak":true},{"text":"heb","speak":true},{"text":"fiets","speak":true,"distractor":true}],"note":"De e het dipendono dal nome; een è identico per entrambi i tipi."},{"id":"3-m7","type":"order","prompt":"Ricomponi la frase.","it":"La donna ha un libro.","answer":"De vrouw heeft een boek.","answers":["De vrouw heeft een boek.","Een boek heeft de vrouw."],"tiles":[{"text":"De","speak":true},{"text":"vrouw","speak":true},{"text":"heeft","speak":true},{"text":"een","speak":true},{"text":"boek","speak":true},{"text":"eeen","speak":false,"distractor":true}],"note":"De e het dipendono dal nome; een è identico per entrambi i tipi."},{"id":"3-m8","type":"tr","prompt":"Traduci con le tessere.","it":"L’uomo ha una bici.","answer":"De man heeft een fiets.","answers":["De man heeft een fiets.","Een fiets heeft de man."],"tiles":[{"text":"De","speak":true},{"text":"man","speak":true},{"text":"heeft","speak":true},{"text":"een","speak":true},{"text":"fiets","speak":true},{"text":"boek","speak":true,"distractor":true}],"note":"De e het dipendono dal nome; een è identico per entrambi i tipi."},{"id":"3-m9","type":"order","prompt":"Ricomponi la frase.","it":"Abbiamo la casa.","answer":"Wij hebben het huis.","answers":["Wij hebben het huis.","We hebben het huis.","Het huis hebben wij.","Het huis hebben we."],"tiles":[{"text":"Wij","speak":true},{"text":"hebben","speak":true},{"text":"het","speak":true},{"text":"huis","speak":true},{"text":"We","speak":true},{"text":"hett","speak":false,"distractor":true}],"note":"De e het dipendono dal nome; een è identico per entrambi i tipi."},{"id":"3-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Ho la mela.","answer":"Ik heb de appel.","answers":["Ik heb de appel.","De appel heb ik."],"tiles":[{"text":"Ik","speak":true},{"text":"heb","speak":true},{"text":"de","speak":true},{"text":"appel","speak":true},{"text":"stoel","speak":true,"distractor":true}],"note":"De e het dipendono dal nome; een è identico per entrambi i tipi."}]},{"id":4,"title":"Mij, jou, hem","it":"I pronomi oggetto","group":0,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>Confronta «io vedo lui» e «lui vede me». Le persone sono le stesse, ma cambia il loro ruolo. Anche il neerlandese distingue il soggetto da chi riceve l'azione: \u003ci>ik zie hem\u003c/i>, «lo vedo», e \u003ci>hij ziet mij\u003c/i>, «lui mi vede». Diversamente dall'italiano, il pronome oggetto non si mette normalmente prima del verbo coniugato. Per iniziare usa la sequenza soggetto, verbo, oggetto.\u003c/p>\n\u003ch3>1 · Cambia forma quando cambia il ruolo\u003c/h3>\u003cp>\u003ci>Ik\u003c/i> diventa \u003ci>mij\u003c/i> o \u003ci>me\u003c/i>; \u003ci>jij\u003c/i> diventa \u003ci>jou\u003c/i> o \u003ci>je\u003c/i>; \u003ci>hij\u003c/i> diventa \u003ci>hem\u003c/i>. Il femminile singolare usa \u003ci>haar\u003c/i>; in Belgio è standard anche \u003ci>ze\u003c/i> senza accento: \u003ci>ik zie ze\u003c/i> può significare «la vedo». La forma di cortesia \u003ci>u\u003c/i> e il plurale \u003ci>jullie\u003c/i> rimangono uguali. Non tradurre parola per parola il «lo» italiano senza prima capire a chi si riferisce.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Soggetto\u003c/th>\u003cth>Oggetto\u003c/th>\u003cth>Significato\u003c/th>\u003c/tr>\u003ctr>\u003ctd>ik\u003c/td>\u003ctd>mij / me\u003c/td>\u003ctd>me, mi\u003c/td>\u003c/tr>\u003ctr>\u003ctd>jij / je\u003c/td>\u003ctd>jou / je\u003c/td>\u003ctd>te, ti\u003c/td>\u003c/tr>\u003ctr>\u003ctd>hij / zij\u003c/td>\u003ctd>hem / haar\u003c/td>\u003ctd>lui / lei\u003c/td>\u003c/tr>\u003ctr>\u003ctd>wij / we\u003c/td>\u003ctd>ons\u003c/td>\u003ctd>noi, ci\u003c/td>\u003c/tr>\u003ctr>\u003ctd>zij plurale\u003c/td>\u003ctd>hen / ze\u003c/td>\u003ctd>loro, oggetto diretto\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Usa le forme leggere\u003c/h3>\u003cp>\u003ci>Me\u003c/i> e \u003ci>je\u003c/i> sono molto naturali se non vuoi contrapporre una persona a un'altra. \u003ci>De collega helpt me\u003c/i> significa «il collega mi aiuta». Con un contrasto esplicito serve la forma piena: «me, non te». Negli esercizi senza enfasi obbligatoria sono accettate entrambe. Per oggetti plurali \u003ci>ze\u003c/i> è spesso una scelta semplice nel parlato; nello scritto sorvegliato distingui \u003ci>hen\u003c/i> e \u003ci>hun\u003c/i> secondo la funzione. Le grafie \u003ci>’m\u003c/i> per \u003ci>hem\u003c/i> e \u003ci>d’r / ’r\u003c/i> per \u003ci>haar\u003c/i> rappresentano il parlato e sono soprattutto informali; queste ultime sono tipiche dei Paesi Bassi.\u003c/p>\n\u003ch3>3 · Dopo una preposizione\u003c/h3>\u003cp>Una preposizione come \u003ci>met\u003c/i>, «con», richiede una forma oggetto: \u003ci>met mij\u003c/i>, non \u003ci>met ik\u003c/i>. Per le persone al plurale puoi usare \u003ci>met hen\u003c/i> o, senza enfasi, \u003ci>met ze\u003c/i>. Questa unità esercita soprattutto oggetti diretti, per esempio la persona che senti o aiuti; non estendere automaticamente \u003ci>hun\u003c/i> a tutti i complementi. Nell'ordine neutro l'oggetto segue il verbo. Per metterlo in contrasto puoi anticiparlo: \u003ci>hem zie ik\u003c/i>. Qui serve la forma piena, non una forma ridotta.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Hij helpt ik.\u003c/s> → \u003cstrong>Hij helpt mij.\u003c/strong> La persona aiutata richiede la forma oggetto. \u003cs>Ik hem zie.\u003c/s> → \u003cstrong>Ik zie hem.\u003c/strong> Non importare la posizione italiana di «lo». \u003cs>Met wij\u003c/s> → \u003cstrong>met ons\u003c/strong>: dopo la preposizione cambia il pronome.\u003c/p>","keywords":[{"nl":"mij","it":"me, mi"},{"nl":"jou","it":"te, ti"},{"nl":"hem","it":"lui, lo"},{"nl":"haar","it":"lei, la"},{"nl":"ons","it":"noi, ci"},{"nl":"jullie","it":"voi, vi"},{"nl":"hen","it":"loro, oggetto"},{"nl":"met","it":"con"}],"words":[{"nl":"zien","it":"vedere"},{"nl":"horen","it":"sentire"},{"nl":"helpen","it":"aiutare"},{"nl":"bellen","it":"telefonare a"},{"nl":"kennen","it":"conoscere"},{"nl":"zoeken","it":"cercare"},{"nl":"de buur","it":"il vicino"},{"nl":"de vriend","it":"l’amico"}],"vlaanderen":{"text":"Nel parlato belga informale puoi incontrare ge/gij al posto di je/jij. Per riconoscere il ruolo dei pronomi, qui manteniamo il sistema dello standard.","source":{"label":"Team Taaladvies · gij/ge","url":"https://www.vlaanderen.be/team-taaladvies/taaladviezen/gij-ge-gebruik"}},"source":"gij","practiceNote":"Nell’ordine neutro il pronome oggetto segue il verbo: ik zie hem. Per anticiparlo con enfasi usa la forma piena.","grammar":[{"id":"4-g1","type":"fill","prompt":"Completa la frase.","sentence":"Hij ziet ___.","answer":"mij","answers":["mij","me"],"it":"Lui mi vede.","hint":"Prima persona, oggetto.","note":"Mij e me sono oggetti."},{"id":"4-g2","type":"mc","prompt":"Completa la frase.","sentence":"Ik help ___.","answer":"hem","answers":["hem","'m"],"it":"Lo aiuto.","hint":"Uomo di cui parli.","note":"Hem è oggetto maschile singolare; ’m è una grafia informale.","options":[{"text":"hem","it":"Nella frase: Lo aiuto.","speak":true},{"text":"hij","it":"Lui, soggetto.","speak":true},{"text":"zij","it":"Lei/loro, soggetto.","speak":true}],"correct":0},{"id":"4-g3","type":"fill","prompt":"Completa la frase.","sentence":"Zij hoort ___.","answer":"jou","answers":["jou","je"],"it":"Lei ti sente.","hint":"Seconda persona informale.","note":"Jou e je significano te."},{"id":"4-g4","type":"mc","prompt":"Completa la frase.","sentence":"De man kent ___.","answer":"ons","answers":["ons"],"it":"L’uomo ci conosce.","hin singolare.","note":"Hem è l’oggetto di kennen; ’m è una grafia informale.","options":[{"text":"hem","it":"Nella frase: Lei lo conosce.","speak":true},{"text":"hij","it":"Forma soggetto.","speak":true},{"text":"wij","it":"Forma soggetto plurale.","speak":true}],"correct":0}],"mixed":[{"id":"4-m1","type":"order","prompt":"Ricomponi la frase.","it":"Lo vedo.","answer":"Ik zie hem.","answers":["Ik zie hem.","Hem zie ik."],"tiles":[{"text":"Ik","speak":true},{"text":"zie","speak":true},{"text":"hem","speak":true},{"text":"hemm","speak":false,"distractor":true}],"note":"Nell’ordine neutro il pronome oggetto segue il verbo: ik zie hem. Per anticiparlo con enfasi usa la forma piena."},{"id":"4-m2","type":"tr","prompt":"Traduci con le tessere.","it":"Lui mi sente.","answer":"Hij hoort mij.","answers":["Hij hoort mij.","Hij hoort me.","Mij hoort hij."],"tiles":[{"text":"Hij","speak":true},{"text":"hoort","speak":true},{"text":"mij","speak":true},{"text":"me","speak":true},{"text":"zoeken","speak":true,"distractor":true}],"note":"Nell’ordine neutro il pronome oggetto segue il verbo: ik zie hem. Per anticiparlo con enfasi usa la forma piena."},{"id":"4-m3","type":"order","prompt":"Ricomponi la frase.","it":"L’aiutiamo.","answer":"Wij helpen haar.","answers":["Wij helpen haar.","We helpen haar.","Wij helpen ze.","We helpen ze.","Haar helpen wij.","Haar helpen we."],"tiles":[{"text":"Wij","speak":true},{"text":"helpen","speak":true},{"text":"haar","speak":true},{"text":"We","speak":true},{"text":"ze","speak":true},{"text":"haarr","speak":false,"distractor":true}],"note":"Nell’ordine neutro il pronome oggetto segue il verbo: ik zie hem. Per anticiparlo con enfasi usa la forma piena."},{"id":"4-m4","type":"tr","prompt":"Traduci con le tessere.","it":"Lei ti telefona.","answer":"Zij belt jou.","answers":["Zij belt jou.","Ze belt jou.","Zij belt je.","Ze belt je.","Jou belt zij.","Jou belt ze."],"tiles":[{"text":"Zij","speak":true},{"text":"belt","speak":true},{"text":"jou","speak":t ,{"id":"4-m9","type":"order","prompt":"Ricomponi la frase.","it":"Li sentiamo.","answer":"Wij horen hen.","answers":["Wij horen hen.","We horen hen.","Wij horen ze.","We horen ze.","Hen horen wij.","Hen horen we."],"tiles":[{"text":"Wij","speak":true},{"text":"horen","speak":true},{"text":"hen","speak":true},{"text":"We","speak":true},{"text":"ze","speak":true},{"text":"henn","speak":false,"distractor":true}],"note":"Nell’ordine neutro il pronome oggetto segue il verbo: ik zie hem. Per anticiparlo con enfasi usa la forma piena."},{"id":"4-m10","type":"tr","prompt":"Traduci con le tessere.","it":"L’amico le telefona.","answer":"De vriend belt haar.","answers":["De vriend belt haar.","De vriend belt ze.","Haar belt de vriend."],"tiles":[{"text":"De","speak":true},{"text":"vriend","speak":true},{"text":"belt","speak":true},{"text":"haar","speak":true},{"text":"ze","speak":true},{"text":"helpen","speak":true,"distractor":true}],"note":"Nell’ordine neutro il pronome oggetto segue il verbo: ik zie hem. Per anticiparlo con enfasi usa la forma piena."}]},{"id":5,"title":"Een, twee, drie","it":"I numeri","group":0,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>I numeri servono subito per prezzi, indirizzi e appuntamenti. In neerlandese la parte più insolita per un italiano è l'ordine delle decine: ventiquattro si costruisce letteralmente come «quattro e venti», \u003ci>vierentwintig\u003c/i>. Non devi invertire le cifre quando le scrivi: cambia soltanto il modo di comporre la parola. Parti dalle unità, poi memorizza le decine e infine collegale.\u003c/p>\n\u003ch3>1 · Costruisci le basi\u003c/h3>\u003cp>Da zero a dieci trovi \u003ci>nul, een, twee, drie, vier, vijf, zes, zeven, acht, negen, tien\u003c/i>. Undici e dodici sono \u003ci>elf\u003c/i> e \u003ci>twaalf\u003c/i>. Da tredici a diciannove molte forme terminano in \u003ci>-tien\u003c/i>, ma alcune basi cambiano: \u003ci>dertien\u003c/i> e \u003ci>veertien\u003c/i> vanno riconosciute come parole intere. Pronuncia i gruppi più volte senza cercare di ricostruire ogni suono dall'italiano.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Cifre\u003c/th>\u003cth>Parola\u003c/th>\u003cth>Struttura\u003c/th>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>twintig\u003c/td>\u003ctd>decina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>21\u003c/td>\u003ctd>eenentwintig\u003c/td>\u003ctd>uno + e + venti\u003c/td>\u003c/tr>\u003ctr>\u003ctd>22\u003c/td>\u003ctd>tweeëntwintig\u003c/td>\u003ctd>due + e + venti\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30 / 40\u003c/td>\u003ctd>dertig / veertig\u003c/td>\u003ctd>decine irregolari\u003c/td>\u003c/tr>\u003ctr>\u003ctd>100 / 1000\u003c/td>\u003ctd>honderd / duizend\u003c/td>\u003ctd>cento / mille\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Collega unità e decina\u003c/h3>\u003cp>Per un numero fra ventuno e novantanove, se non è una decina esatta, metti prima l'unità, poi \u003ci>en\u003c/i>, poi la decina. Il risultato si scrive unito. Il segno in \u003ci>tweeëntwintig\u003c/i> separa due suoni vocalici e si chiama dieresi: non è una decorazione facoltativa. Quando la risposta attesa contiene questo segno, l'app lo richiede. Il numero uno può avere accenti, \u003ci>één\u003c/i>, per distinguerlo dall'articolo, ma non occorrono in ogni contesto.\u003c/p>\n\u003ch3>3 · Leggi una quantità nel contesto\u003c/h3>\u003cp>Dopo un numero maggiore di uno il nome numerabile è normalmente plurale: imparerai le forme nella prossima unità. Alcune unità di misura restano singolari dopo una quantità, come \u003ci>twee euro\u003c/i>. Per prezzi con decimali si usa la virgola nella scrittura corrente. Negli esercizi sui numeri scrivi la parola richiesta, non la cifra: stiamo allenando la forma linguistica. Nei numeri lunghi, riconosci prima centinaia e migliaia e poi la parte finale. Le forme usuali sono \u003ci>honderd\u003c/i> e \u003ci>duizend\u003c/i>; in documenti finanziari puoi incontrare anche \u003ci>eenhonderd\u003c/i> ed \u003ci>eenduizend\u003c/i>.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Twintigvier\u003c/s> → \u003cstrong>vierentwintig\u003c/strong>. L'unità precede la decina. \u003cs>Tweeentwintig\u003c/s> → \u003cstrong>tweeëntwintig\u003c/strong>. Conserva la dieresi. \u003cs>Twee euros\u003c/s> → \u003cstrong>twee euro\u003c/strong> quando esprimi una somma.\u003c/p>","keywords":[{"nl":"een","it":"uno"},{"nl":"twee","it":"due"},{"nl":"drie","it":"tre"},{"nl":"vier","it":"quattro"},{"nl":"vijf","it":"cinque"},{"nl":"tien","it":"dieci"},{"nl":"twintig","it":"venti"},{"nl":"honderd","it":"cento"}],"words":[{"nl":"de euro","it":"l’euro"},{"nl":"het nummer","it":"il numero"},{"nl":"de prijs","it":"il prezzo"},{"nl":"de rekening","it":"il conto"},{"nl":"betalen","it":"pagare"},{"nl":"kosten","it":"costare"},{"nl":"duur","it":"caro"},{"nl":"goedkoop","it":"economico"}],"vlaanderen":{"text":"In Belgio voormiddag indica la seconda parte della mattina. Per un appuntamento, aggiungere l’ora numerica aiuta a evitare equivoci fra usi regionali.","source":{"label":"Taaladvies · voormiddag/namiddag","url":"https://taaladvies.net/voormiddag-namiddag/"}},"source":"time","practiceNote":"Nelle quantità composte: unità + en + decina. Euro resta singolare dopo il numero.","grammar":[{"id":"5-g1","type":"fill","prompt":"Completa la frase.","sentence":"21 = ___","answer":"eenentwintig","answers":["eenentwintig"],"it":"Ventuno.","hint":"Unità prima della decina.","note":"Si uniscono een, en, twintig."},{"id":"5-g2","type":"mc","prompt":"Completa la frase.","sentence":"24 = ___","answer":"vierentwintig","answers":["vierentwintig"],"it":"Ventiquattro.","hint":"Prima quattro, poi venti.","note":"Vier precede twintig.","options":[{"text":"vierentwintig","it":"Nella frase: Ventiquattro.","speak":true},{"text":"twintigvier","it":"Ordine errato.","speak":false},{"text":"veertig","it":"Quaranta.","speak":true}],"correct":0},{"id":"5-g3","type":"fill","prompt":"Completa la frase.","sentence":"22 = ___","answ "text":"euro","speak":true},{"text":"We","speak":true},{"text":"nummer","speak":true,"distractor":true}],"note":"Nelle quantità composte: unità + en + decina. Euro resta singolare dopo il numero."},{"id":"5-m9","type":"order","prompt":"Ricomponi la frase.","it":"La bici costa cento euro.","answer":"De fiets kost honderd euro.","answers":["De fiets kost honderd euro.","Honderd euro kost de fiets.","De fiets kost eenhonderd euro.","Eenhonderd euro kost de fiets."],"tiles":[{"text":"De","speak":true},{"text":"fiets","speak":true},{"text":"kost","speak":true},{"text":"honderd","speak":true},{"text":"euro","speak":true},{"text":"eenhonderd","speak":true},{"text":"hondertt","speak":false,"distractor":true}],"note":"Nelle quantità composte: unità + en + decina. Euro resta singolare dopo il numero."},{"id":"5-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Lei paga due euro.","answer":"Zij betaalt twee euro.","answers":["Zij betaalt twee euro.","Ze betaalt twee euro.","Twee euro betaalt zij.","Twee euro betaalt ze."],"tiles":[{"text":"Zij","speak":true},{"text":"betaalt","speak":true},{"text":"twee","speak":true},{"text":"euro","speak":true},{"text":"Ze","speak":true},{"text":"prijs","speak":true,"distractor":true}],"note":"Nelle quantità composte: unità + en + decina. Euro resta singolare dopo il numero."}]},{"id":6,"title":"Boeken en tafels","it":"Il plurale","group":1,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>In italiano il plurale cambia spesso l'ultima vocale; in neerlandese aggiungi di solito una terminazione. Le due più comuni sono \u003ci>-en\u003c/i> e \u003ci>-s\u003c/i>. Non si sceglie però soltanto guardando l'articolo: un nome con \u003ci>het\u003c/i> può avere il plurale in \u003ci>-en\u003c/i> oppure in \u003ci>-s\u003c/i>. Impara il nome al singolare insieme al suo plurale e osserva come resta riconoscibile il suono della parola.\u003c/p>\n\u003ch3>1 · Aggiungi la terminazione\u003c/h3>\u003cp>\u003ci>Boek\u003c/i> diventa \u003ci>boeken\u003c/i>; \u003ci>stoel\u003c/i> diventa \u003ci>stoelen\u003c/i>. Molti nomi che terminano in una sillaba non accentata, come \u003ci>tafel\u003c/i> e \u003ci>kamer\u003c/i>, prendono \u003ci>-s\u003c/i>. Non è una regola senza eccezioni, ma offre un punto di partenza. Il plurale definito prende sempre \u003ci>de\u003c/i>, anche quando il singolare usa \u003ci>het\u003c/i>: \u003ci>het boek\u003c/i> diventa \u003ci>de boeken\u003c/i>.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Singolare\u003c/th>\u003cth>Plurale\u003c/th>\u003cth>Cambiamento\u003c/th>\u003c/tr>\u003ctr>\u003ctd>het boek\u003c/td>\u003ctd>de boeken\u003c/td>\u003ctd>aggiungi en\u003c/td>\u003c/tr>\u003ctr>\u003ctd>de tafel\u003c/td>\u003ctd>de tafels\u003c/td>\u003ctd>aggiungi s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>de auto\u003c/td>\u003ctd>de auto's\u003c/td>\u003ctd>apostrofo + s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>het bed\u003c/td>\u003ctd>de bedden\u003c/td>\u003ctd>raddoppia d\u003c/td>\u003c/tr>\u003ctr>\u003ctd>het huis\u003c/td>\u003ctd>de huizen\u003c/td>\u003ctd>cambia s in z\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Mantieni il suono\u003c/h3>\u003cp>In \u003ci>bedden\u003c/i> la doppia consonante conserva la vocale breve. In altre parole una vocale lunga scritta doppia diventa singola nella sillaba aperta: \u003ci>raam\u003c/i> dà \u003ci>ramen\u003c/i>. Questi cambiamenti sono ortografici, non un invito a cambiare arbitrariamente la pronuncia. Anche consonanti come \u003ci>s\u003c/i> e \u003ci>f\u003c/i> possono cambiare nel plurale; impara le forme effettive invece di dedurle sempre.\u003c/p>\n\u003cp>Confronta \u003ci>tas\u003c/i> e \u003ci>tassen\u003c/i>: anche qui raddoppi la consonante perché la vocale rimanga breve. In \u003ci>deur\u003c/i> e \u003ci>deuren\u003c/i>, invece, il gruppo vocalico resta uguale. Controlla ogni volta sia la terminazione sia la grafia della base: conoscere solo \u003ci>-en\u003c/i> non basta per scrivere il plurale.\u003c/p>\n\u003ch3>3 · Attenzione alle vocali finali\u003c/h3>\u003cp>Alcuni nomi che terminano in vocale usano l'apostrofo prima di \u003ci>s\u003c/i>: \u003ci>auto's\u003c/i> e \u003ci>foto's\u003c/i>. L'apostrofo aiuta a conservare la lettura della vocale. Non aggiungerlo a tutti i plurali: \u003ci>tafels\u003c/i> non lo vuole. Esistono infine plurali irregolari come \u003ci>kinderen\u003c/i>, «bambini». L'articolo indefinito \u003ci>een\u003c/i> scompare normalmente al plurale: «ho dei libri» diventa \u003ci>ik heb boeken\u003c/i>, senza tradurre separatamente «dei».\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Het boeken\u003c/s> → \u003cstrong>de boeken\u003c/strong>. Tutti i plurali definiti usano \u003ci>de\u003c/i>. \u003cs>Autos\u003c/s> → \u003cstrong>auto's\u003c/strong>. Conserva l'apostrofo. \u003cs>Een boeken\u003c/s> → \u003cstrong>boeken\u003c/strong>: l'articolo singolare non accompagna un gruppo di libri.\u003c/p>","keywords":[{"nl":"-en","it":"terminazione plurale"},{"nl":"-s","it":"terminazione plurale"}],"words":[{"nl":"de auto","it":"l’automobile"},{"nl":"de foto","it":"la foto"},{"nl":"het bed","it":"il letto"},{"nl":"de kamer","it":"la stanza"},{"nl":"het kind","it":"il bambino"},{"nl":"de tas","it":"la borsa"},{"nl":"de deur","it":"la porta"},{"nl":"de straat","it":"la strada"}],"vlaanderen":{"text":"Le differenze regionali non rendono ogni forma colloquiale una forma standard. Per scrivere il plurale nelle Fiandre usa le forme della lingua standard presentate qui.","source":{"label":"Taaladvies · lo standard in Belgio","url":"https://taaladvies.net/wat-is-standaardtaal-algemeen/"}},"source":"standard","practiceNote":"Il plurale definito usa de. Conserva il suono della radice e gli apostrofi richiesti.","grammar":[{"id":"6-g1","type":"fill","prompt":"Completa la frase.","sentence":"boek → ___","answer":"boeken","answers":["boeken"],"it":"Libro → libri.","hint":"Plurale con terminazione più comune.","note":"Il plurale definito usa d ij heeft vijf foto's.","Ze heeft vijf foto's.","Vijf foto's heeft zij.","Vijf foto's heeft ze."],"tiles":[{"text":"Zij","speak":true},{"text":"heeft","speak":true},{"text":"vijf","speak":true},{"text":"foto's","speak":true},{"text":"Ze","speak":true},{"text":"straat","speak":true,"distractor":true}],"note":"Il plurale definito usa de. Conserva il suono della radice e gli apostrofi richiesti."},{"id":"6-m7","type":"order","prompt":"Ricomponi la frase.","it":"Abbiamo due letti.","answer":"Wij hebben twee bedden.","answers":["Wij hebben twee bedden.","We hebben twee bedden.","Twee bedden hebben wij.","Twee bedden hebben we."],"tiles":[{"text":"Wij","speak":true},{"text":"hebben","speak":true},{"text":"twee","speak":true},{"text":"bedden","speak":true},{"text":"We","speak":true},{"text":"beds","speak":false,"distractor":true}],"note":"Il plurale definito usa de. Conserva il suono della radice e gli apostrofi richiesti."},{"id":"6-m8","type":"tr","prompt":"Traduci con le tessere.","it":"Le porte sono pronte.","answer":"De deuren zijn klaar.","answers":["De deuren zijn klaar.","Klaar zijn de deuren."],"tiles":[{"text":"De","speak":true},{"text":"deuren","speak":true},{"text":"zijn","speak":true},{"text":"klaar","speak":true},{"text":"auto","speak":true,"distractor":true}],"note":"Il plurale definito usa de. Conserva il suono della radice e gli apostrofi richiesti."},{"id":"6-m9","type":"order","prompt":"Ricomponi la frase.","it":"Vedo le case.","answer":"Ik zie de huizen.","answers":["Ik zie de huizen.","De huizen zie ik."],"tiles":[{"text":"Ik","speak":true},{"text":"zie","speak":true},{"text":"de","speak":true},{"text":"huizen","speak":true},{"text":"huisens","speak":false,"distractor":true}],"note":"Il plurale definito usa de. Conserva il suono della radice e gli apostrofi richiesti."},{"id":"6-m10","type":"tr","prompt":"Traduci con le tessere.","it":"Le borse sono economiche.","answer":"De tassen zijn goedkoop.","answers":["De tassen zijn goedkoop.","Goedkoop zijn de tassen."],"tiles":[{"text":"De","speak":true},{"text":"tassen","speak":true},{"text":"zijn","speak":true},{"text":"goedkoop","speak":true},{"text":"kamer","speak":true,"distractor":true}],"note":"Il plurale definito usa de. Conserva il suono della radice e gli apostrofi richiesti."}]},{"id":7,"title":"Wie, wat, waar?","it":"Le domande","group":1,"explanation":"\u003ch2>L'idea\u003c/h2>\u003cp>In italiano l'intonazione può bastare a trasformare «lavori» in una domanda. In neerlandese cambia normalmente anche l'ordine delle parole: \u003ci>jij werkt\u003c/i> diventa \u003ci>werk jij?\u003c/i>. Il verbo coniugato si sposta davanti al soggetto. Non devi aggiungere un ausiliare simile all'inglese \u003ci>do\u003c/i>. Imparare questo movimento ti permette di chiedere informazioni senza costruire ogni frase da zero.\u003c/p>\n\u003ch3>1 · Chiedi sì o no\u003c/h3>\u003cp>Metti prima il verbo e subito dopo il soggetto: \u003ci>is de winkel open?\u003c/i>, «il negozio è aperto?». Tutto il gruppo soggetto segue il verbo, anche se contiene più parole. Con una persona plurale la forma resta plurale: \u003ci>werken jullie?\u003c/i>. La risposta breve può essere \u003ci>ja\u003c/i> oppure \u003ci>nee\u003c/i>, ma puoi anche riprendere il contenuto nella forma dichiarativa.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Informazione\u003c/th>\u003cth>Parola\u003c/th>\u003cth>Domanda\u003c/th>\u003c/tr>\u003ctr>\u003ctd>persona\u003c/td>\u003ctd>wie\u003c/td>\u003ctd>Wie is klaar? Chi è pronto?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cosa\u003c/td>\u003ctd>wat\u003c/td>\u003ctd>Wat drink je? Che cosa bevi?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>luogo\u003c/td>\u003ctd>waar\u003c/td>\u003ctd>Waar woon je? Dove abiti?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tempo\u003c/td>\u003ctd>wanneer\u003c/td>\u003ctd>Wanneer werk je? Quando lavori?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>modo / motivo\u003c/td>\u003ctd>hoe / waarom\u003c/td>\u003ctd>come / perché\u003c/td>\u003c/tr>\u003c/table>\n\u003ch3>2 · Aggiungi una parola interrogativa\u003c/h3>\u003cp>Se cerchi un'informazione precisa, la parola interrogativa occupa l'inizio: \u003ci>waar werkt de collega?\u003c/i>. Poi vengono verbo e soggetto. Quando \u003ci>wie\u003c/i> è esso stesso il soggetto, non inserire un secondo pronome: \u003ci>wie werkt?\u003c/i>, «chi lavora?». Confronta \u003ci>wie helpt jou?\u003c/i>, «chi ti aiuta?», con \u003ci>wie help jij?\u003c/i>, «chi aiuti tu?». Nella prima domanda \u003ci>wie\u003c/i> compie l'azione; nella seconda la compie \u003ci>jij\u003c/i> e \u003ci>wie\u003c/i> è l'oggetto.\u003c/p>\n\u003cp>In \u003ci>wanneer komt de trein?\u003c/i>, «quando arriva il treno?», \u003ci>komen\u003c/i> significa «arrivare». La traduzione di un verbo dipende anche dal contesto, non solo dalla sua prima definizione nel lessico.\u003c/p>\n\u003ch3>3 · Osserva la t di jij\u003c/h3>\u003cp>Con \u003ci>jij\u003c/i> o \u003ci>je\u003c/i> soggetto dopo il verbo, la terminazione \u003ci>t\u003c/i> del presente regolare cade: \u003ci>jij woont\u003c/i>, ma \u003ci>woon jij?\u003c/i>. Non togliere una \u003ci>t\u003c/i> che appartiene già alla radice, come in \u003ci>zit je?\u003c/i>. Con \u003ci>u\u003c/i> e con gli altri soggetti la terminazione resta. Leggi sempre la funzione di \u003ci>je\u003c/i>: se significa «tuo» davanti a un nome, non è il soggetto personale cui si applica questa regola.\u003c/p>\n\u003ch3>Attenzione: errori tipici di chi parla italiano\u003c/h3>\u003cp>\u003cs>Waar jij woont?\u003c/s> → \u003cstrong>Waar woon jij?\u003c/strong> Nella domanda diretta inverti. \u003cs>Werkt jij?\u003c/s> → \u003cstrong>Werk jij?\u003c/strong> Cade la terminazione. \u003cs>Werk u?\u003c/s> → \u003cstrong>Werkt u?\u003c/strong> La cortesia conserva la forma con \u003ci>t\u003c/i>.\u003c/p>","keywords":[{"nl":"wie","it":"chi"},{"nl":"wat","it":"che cosa"},{"nl":"waar","it":"dove"},{"nl":"wanneer","it":"quando"},{"nl":"hoe","it":"come"},{"nl":"waarom","it":"perché"},{"nl":"ja","it":"sì"},{"nl":"nee","it":"no"}],"words":[{"nl":"de winkel","it":"il negozio"},{"nl":"het station","it":"la stazione"},{"nl":"de markt","it":"il mercato"},{"nl":"de trein","it":"il treno"},{"nl":"komen","it":"venire, arrivare"},{"nl":"gaan","it":"andare"},{"nl":"open","it":"aperto"},{"nl":"gesloten","it":"chiuso"}],"vlaanderen":{"text":"In Belgio anche om hoe laat è standard per chiedere a che ora. Hoe laat è utilizzabile in tutta l’area neerlandofona.","source":{"label":"Team Taaladvies · hoe laat","url":"https://www.vlaanderen.be/team-taaladvies/taaladviezen/hoe-laat-om-hoe-laat-om-welk-uur"}},"source":"hour","practiceNote":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza.","grammar":[{"id":"7-g1","type":"fill","prompt":"Completa la frase.","sentence":"___ woont Nora?","answer":"Waar","answers":["Waar"],"it":"Dove abita Nora?","hint":"Chiedi il luogo.","note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza."},{"id":"7-g2","type":"mc","prompt":"Completa la frase.","sentence":"___ is klaar?","answer":"Wie","answers":["Wie"],"it":"Chi è pronto?","hint":"Chiedi una persona.","note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo + soggetto, salvo quando l’interrogativo è già il soggetto. Con jij/je soggetto dopo il verbo cade la t di desinenza.","options":[{"text":"Wie","it":"Nella frase: Chi è pronto?","speak":true},{"text":"Waar","it":"Dove.","speak":true},{"text":"Wanneer","it":"Quando.","speak":true}],"correct":0},{"id":"7-g3","type":"fill","prompt":"Completa la frase.","sentence":"___ drink jij?","answer":"Wat","answers":["Wat"],"it":"Che cosa bevi?","hint":"Chiedi una cosa.","note":"Domanda sì/no: verbo + soggetto. Con un interrogativo: interrogativo + verbo
